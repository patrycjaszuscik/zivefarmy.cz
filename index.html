  /* ---- Region selection + map zoom ---- */
  var mapStage = document.getElementById('mapStage');

  var view = { s:1, fx:0.5, fy:0.5 };

  function applyView(){
    if (view.s <= 1.001){
      view.s = 1; view.fx = 0.5; view.fy = 0.5;
      mapStage.style.transform = '';
    } else {
      mapStage.style.transform =
        'translate(' + ((0.5 - view.fx * view.s) * 100).toFixed(2) + '%,' +
                       ((0.5 - view.fy * view.s) * 100).toFixed(2) + '%)' +
        ' scale(' + view.s.toFixed(3) + ')';
    }
    mapStage.style.setProperty('--zoom-scale', view.s.toFixed(3));
    setZoomedDetail(view.s > 1.35);
    updateMapControls();
    updateTipSides();
    setTimeout(updateTipSides, 520);
  }


/* ---- Pinch to zoom, drag to pan ------------------------------------------
   The +/- buttons were the only way in, which is not how anyone uses a map
   on a phone. Two fingers scale around the point between them; one finger
   pans once you are zoomed in. The CSS transition is switched off while a
   gesture is running, otherwise every frame chases the last one. */
(function(){
  var wrap = document.querySelector('.map-wrap');
  if (!wrap) return;

  var gest = null;

  function dist(t){
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function mid(t){
    return t.length > 1
      ? { x:(t[0].clientX + t[1].clientX) / 2, y:(t[0].clientY + t[1].clientY) / 2 }
      : { x:t[0].clientX, y:t[0].clientY };
  }
  /* Where a screen point sits in the map's own 0-1 space, so the spot under
     the fingers stays under the fingers as the scale changes. */
  function toStage(px, py){
    var b = wrap.getBoundingClientRect();
    return {
      x: view.fx + (px - b.left - b.width / 2) / (b.width * view.s),
      y: view.fy + (py - b.top - b.height / 2) / (b.height * view.s)
    };
  }
  function live(on){
    mapStage.style.transition = on ? 'none' : '';
  }

  wrap.addEventListener('touchstart', function(e){
    if (pickingLocation) return;
    var t = e.touches;
    if (t.length === 2){
      gest = { mode:'pinch', d0:dist(t), s0:view.s, anchor:toStage(mid(t).x, mid(t).y) };
      live(true);
    } else if (t.length === 1 && view.s > 1.01){
      gest = { mode:'pan', x:t[0].clientX, y:t[0].clientY, fx:view.fx, fy:view.fy };
      live(true);
    }
  }, { passive:true });

  wrap.addEventListener('touchmove', function(e){
    if (!gest) return;
    var t = e.touches;

    if (gest.mode === 'pinch' && t.length === 2){
      e.preventDefault();
      var next = Math.max(1, Math.min(gest.s0 * (dist(t) / gest.d0), 6));
      var b = wrap.getBoundingClientRect(), m = mid(t);
      view.s = next;
      /* Keep the anchor under the fingers. */
      view.fx = gest.anchor.x - (m.x - b.left - b.width / 2) / (b.width * next);
      view.fy = gest.anchor.y - (m.y - b.top - b.height / 2) / (b.height * next);
      clampView();
      paint();
    } else if (gest.mode === 'pan' && t.length === 1){
      e.preventDefault();
      var b2 = wrap.getBoundingClientRect();
      view.fx = gest.fx - (t[0].clientX - gest.x) / (b2.width * view.s);
      view.fy = gest.fy - (t[0].clientY - gest.y) / (b2.height * view.s);
      clampView();
      paint();
    }
  }, { passive:false });

  function end(){
    if (!gest) return;
    gest = null;
    live(false);
    applyView();
  }
  wrap.addEventListener('touchend', end);
  wrap.addEventListener('touchcancel', end);

  /* Never let the map be dragged off screen. */
  function clampView(){
    if (view.s <= 1.001){ view.s = 1; view.fx = 0.5; view.fy = 0.5; return; }
    var half = 0.5 / view.s;
    view.fx = Math.max(half, Math.min(view.fx, 1 - half));
    view.fy = Math.max(half, Math.min(view.fy, 1 - half));
  }
  /* The cheap half of applyView: move it now, do the bookkeeping on release. */
  function paint(){
    mapStage.style.transform =
      'translate(' + ((0.5 - view.fx * view.s) * 100).toFixed(2) + '%,' +
                     ((0.5 - view.fy * view.s) * 100).toFixed(2) + '%)' +
      ' scale(' + view.s.toFixed(3) + ')';
    mapStage.style.setProperty('--zoom-scale', view.s.toFixed(3));
  }
})();

  function zoomBy(factor){
    view.s = Math.max(1, Math.min(view.s * factor, 6));
    applyView();
  }

  function zoomToRegion(name){
    var path = name === 'all' ? null : regionsLayer.querySelector('path[data-region="'+name+'"]');
    if (!path){ view.s = 1; applyView(); return; }
    var b = path.getBBox();
    var s = Math.min(VB_W / b.width, VB_H / b.height) * 0.82;
    view.s = Math.max(1, Math.min(s, 4));
    view.fx = (b.x + b.width / 2) / VB_W;
    view.fy = (b.y + b.height / 2) / VB_H;
    applyView();
  }

  /* Zoomed in there is room for more: farm names sit permanently beside their
     pins and the smaller district towns appear for orientation. */
  function setZoomedDetail(on){
    pinsLayer.classList.toggle('zoomed', on);
    citiesLayer.classList.toggle('zoomed', on);
  }

/* Zoomed into one region, only that region shows its district towns; the
   regions around it keep just their capital, so the edges stay readable. */
function focusLabels(kraj){
  citiesLayer.querySelectorAll('.town').forEach(function(g){
    g.classList.toggle('off-focus', kraj !== 'all' && g.getAttribute('data-kraj') !== kraj);
  });
}

  function setRegion(name){
    activeRegion = name;
    regionsLayer.querySelectorAll('path.region').forEach(function(p){
      p.classList.toggle('selected', p.getAttribute('data-region') === name);
    });
    regionsLayer.classList.toggle('has-selection', name !== 'all');
    var outline = document.getElementById('regionOutline');
    var chosen = name === 'all' ? null : regionsLayer.querySelector('path[data-region="'+name+'"]');
    outline.setAttribute('d', chosen ? chosen.getAttribute('d') : '');
    outline.hidden = !chosen;
    focusLabels(name);
    renderRegionOptions();
    applyFilters();
    zoomToRegion(name);
  }

  function updateMapControls(){
    document.getElementById('zoomIn').disabled = view.s >= 6;
    document.getElementById('zoomOut').disabled = view.s <= 1;
    var filtered = activeCats.length > 0 || activeChannel !== 'all' || activeRegion !== 'all' ||
                   nearActive || searchQuery || view.s > 1;
    document.getElementById('mapReset').hidden = !filtered;
  }

  document.getElementById('zoomIn').addEventListener('click', function(){ zoomBy(1.6); });
  document.getElementById('zoomOut').addEventListener('click', function(){ zoomBy(1 / 1.6); });

  function resetFilters(){
    if (nearActive) deactivateNear();
    activeCats = [];
    activeChannel = 'all';
    searchQuery = '';
    document.getElementById('searchInput').value = '';
    syncCatChips();
    channelDD.setOn(false);
    activeDelivery = 'all';
    onlyFavs = false;
    var fc = document.getElementById('favChip');
    fc.classList.remove('active');
    fc.setAttribute('aria-pressed','false');
    renderChannelOptions();
    renderDeliveryOptions();
    setRegion('all');
  }

  document.getElementById('mapReset').addEventListener('click', resetFilters);
  document.getElementById('clearFilters').addEventListener('click', resetFilters);

  /* Clicking the empty ground around Czechia is how you leave a region. */
  document.querySelector('.map-inner').addEventListener('click', function(e){
    if (pickingLocation) return;
    if (e.target.closest('path.region') || e.target.closest('.pin') ||
        e.target.closest('.map-zoom') || e.target.closest('.map-reset')) return;
    if (activeRegion !== 'all' || view.s > 1) resetFilters();
  });

  regionsLayer.addEventListener('click', function(e){
    var path = e.target.closest('path.region');
    if (!path) return;

    if (pickingLocation){
      var stage = mapStage.getBoundingClientRect();
      if (!stage.width || !stage.height) return;
      var vx = ((e.clientX - stage.left) / stage.width) * VB_W;
      var vy = ((e.clientY - stage.top) / stage.height) * VB_H;
      setUserLocation({
        lon: PROJ.minlon + (vx - PROJ.margin) / (PROJ.cosLat * PROJ.scale),
        lat: PROJ.maxlat - (vy - PROJ.margin) / PROJ.scale
      });
      return;
    }

    var name = path.getAttribute('data-region');
    setRegion(activeRegion === name ? 'all' : name);
  });

  /* ---- Drawer ---- */
  var drawer = document.getElementById('drawer');
  var scrim = document.getElementById('scrim');
  var drawerContent = document.getElementById('drawerContent');
  var currentId = null;

  /* Phone and e-mail are spelled out \u2014 in a farm directory the number itself is
     the useful part, not an icon you have to click to discover. */
  function contactRow(f){
    var lines = [];
    if (f.phone) lines.push('<a class="contact-line" href="tel:'+f.phone.replace(/\s+/g,'')+'">'+svgIcon(ICONS.phone)+'<span>'+f.phone+'</span></a>');
    if (f.email) lines.push('<a class="contact-line" href="mailto:'+f.email+'">'+svgIcon(ICONS.mail)+'<span>'+f.email+'</span></a>');

    var social = [];
    if (f.instagram) social.push('<a class="contact-btn" href="'+f.instagram+'" target="_blank" rel="noopener" aria-label="Instagram">'+svgIcon(ICONS.insta)+'</a>');
    if (f.facebook) social.push('<a class="contact-btn" href="'+f.facebook+'" target="_blank" rel="noopener" aria-label="Facebook">'+svgIconFilled(ICONS.facebook)+'</a>');

    if (!lines.length && !social.length) return '';
    return '<h3>'+t('contactLabel')+'</h3>' +
           (lines.length ? '<div class="d-contacts">'+lines.join('')+'</div>' : '') +
           (social.length ? '<div class="d-contact">'+social.join('')+'</div>' : '');
  }

  function openFarm(id){
    var f = FARMS.filter(function(x){ return x.id === id; })[0];
    if (!f) return;
    currentId = id;

    document.querySelectorAll('.pin').forEach(function(p){ p.classList.toggle('selected', p.dataset.id === id); });
    document.querySelectorAll('.farm-card').forEach(function(c){ c.classList.toggle('active', c.dataset.id === id); });

    var card = farmListEl.querySelector('.farm-card[data-id="'+id+'"]');
    if (card) card.scrollIntoView({ block:'nearest', behavior:'smooth' });

    var catsHtml = f.cats.map(function(c){
      return '<span class="d-cat-pill" style="background:'+CAT[c].color+'">'+CAT[c].label[LANG]+'</span>';
    }).join('');

    var storyHtml = f.story[LANG].map(function(s){ return '<li>'+s+'</li>'; }).join('');

    var actions = '';
    if (f.website) actions += '<a class="btn" href="'+f.website+'" target="_blank" rel="noopener">'+svgIcon(ICONS.globe)+t('website')+'</a>';
    var eshopBtn = f.eshop
      ? '<a class="btn primary d-buy" href="'+f.eshop+'" target="_blank" rel="noopener">'+svgIcon(ICONS.cart)+t('shop')+'</a>'
      : '';

    /* Where to buy: the farm gate always, then only channels that really exist \u2014
       the farm's own e-shop, verified marketplace pages, and any shop or pickup
       point the farm itself lists. */
    /* The farm's own e-shop sits at the end of this row as the one filled
       button, so the place to buy and the act of buying stay together. */
    var gateHtml = '<p class="d-fact">'+svgIcon(ICONS.pin)+
      '<span>'+(f.saleLabel ? f.saleLabel[LANG] : t('channelFarm'))+'</span></p>';
    var shopsHtml = '';
    if (f.shops) Object.keys(f.shops).forEach(function(k){
      shopsHtml += '<a class="shop-tag" href="'+f.shops[k]+'" target="_blank" rel="noopener">'+CHANNEL_NAME[k]+svgIcon(ICONS.external)+'</a>';
    });
    (f.sellers || []).forEach(function(s){
      shopsHtml += s.url
        ? '<a class="shop-tag" href="'+s.url+'" target="_blank" rel="noopener">'+s.name+svgIcon(ICONS.external)+'</a>'
        : '<span class="shop-tag plain">'+s.name+'</span>';
    });

/* Hours reach us as one free-text sentence per farm, and printing that sentence
   as-is turns the panel into a wall of bold. So each sentence is taken apart
   into the two things it actually mixes: timings, which belong on their own
   tabular line under the place they apply to, and remarks ("call ahead",
   "orders are collected at the farm"), which drop to a quiet note underneath. */
var HOURS_TIME = /\d{1,2}[:.]\d{2}|24\/7/;
var HOURS_LEAD = /(?:^|\s)(?:Pond\u011Bl\u00ED|\u00DAter\u00FD|St\u0159eda|\u010Ctvrtek|P\u00E1tek|Sobota|Ned\u011Ble|Po|\u00DAt|St|\u010Ct|P\u00E1|So|Ne|Mon|Tue|Wed|Thu|Fri|Sat|Sun)(?=[\s.,;\u2013\u2014-]|$)|(?:^|\s)\d{1,2}[:.]\d{2}|(?:^|\s)24\/7/;

/* An address can be put on the map; "every other week" cannot. Only labels that
   carry a number read as somewhere you could actually drive to. */
function hoursPlaceLink(label, f){
  if (!/\d/.test(label) || label.length > 60 || HOURS_TIME.test(label)) return '';
  return '<a class="d-hours-place" target="_blank" rel="noopener" href="' +
    'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(label + ', ' + f.town.cs.split(/[,\u2013\u2014-]/)[0].trim()) + '">' +
    '<span>'+label+'</span>'+svgIcon(ICONS.external)+'</a>';
}

function hoursParts(raw){
  var groups = [], notes = [];
  raw.split(/\s*;\s*|(?:\.\s+)(?=[A-Z\u00C1-\u017D])/).forEach(function(chunk){
    chunk.split(/\s+[\u2014\u2013-]\s+/).forEach(function(frag){
      frag = frag.replace(/[.\s]+$/, '').trim();
      if (!frag) return;
      if (!HOURS_TIME.test(frag)){ notes.push(frag); return; }

      var label = '', rest = frag, ci = frag.indexOf(': ');
      if (ci > -1 && !HOURS_TIME.test(frag.slice(0, ci))){
        label = frag.slice(0, ci).trim();
        rest  = frag.slice(ci + 2);
      } else {
        var at = frag.search(HOURS_LEAD);
        if (at > 0){
          label = frag.slice(0, at).trim().replace(/[,:]$/, '');
          label = label.charAt(0).toUpperCase() + label.slice(1);
          rest  = frag.slice(at).trim();
        }
      }

      var rows = [], carry = '';
      rest.split(/,\s*/).forEach(function(r){
        r = r.trim();
        if (!r) return;
        if (!HOURS_TIME.test(r)){ notes.push(r); return; }
        var lead = r.match(/^([^\d]*?)\s*(?=\d{1,2}[:.]\d{2}|24\/7)/);
        if (lead && lead[1]) carry = lead[1].trim();
        else if (carry) r = carry + ' ' + r;
        rows.push(r);
      });
      if (rows.length) groups.push({ label:label, rows:rows });
      else if (label) notes.push(label);
    });
  });
  return { groups:groups, notes:notes };
}

var hoursHtml = '';
if (f.hours){
  var parsed = hoursParts(f.hours[LANG]);
  var body = parsed.groups.map(function(g){
    var link = g.label ? hoursPlaceLink(g.label, f) : '';
    return '<div class="hours-group">' +
      (g.label ? (link || '<p class="hours-where">'+g.label+'</p>') : '') +
      '<ul class="d-hours-rows">' +
        g.rows.map(function(r){
          return '<li>' + r.replace(/\s*\(([^)]+)\)/g,
            ' <span class="hours-qual">($1)</span>') + '</li>';
        }).join('') +
      '</ul></div>';
  }).join('');
  var noteHtml = parsed.notes.length
    ? '<p class="hours-note">' +
      parsed.notes.map(function(n){ return n.charAt(0).toUpperCase() + n.slice(1); }).join('. ') +
      '.</p>'
    : '';
  if (!body && !noteHtml){
    noteHtml = '<p class="hours-note">'+f.hours[LANG]+'</p>';
  }
  hoursHtml = '<div class="d-hours">' +
    '<p class="d-hours-head">'+svgIcon(ICONS.clock)+'<span>'+t('hoursLabel')+'</span></p>' +
    body + noteHtml +
  '</div>';
}

/* Some farms do not keep shop hours at all - they open for a handful of dated
   pickup and delivery windows and announce them as they go. Those dates are
   stored on the farm and resolved against today every time the panel opens, so
   the visitor is told which one is actually next rather than reading a list and
   working it out. */
function ymd(str){
  var p = str.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function slotDate(d){
  return t('weekdays')[d.getDay()] + ' ' + d.getDate() + '. ' + (d.getMonth() + 1) + '.';
}
function slotRange(slot){
  var a = slotDate(ymd(slot.d));
  return slot.end ? a + ' \u2013 ' + slotDate(ymd(slot.end)) : a;
}
function slotLead(slot, today){
  var days = Math.round((ymd(slot.d) - today) / 86400000);
  if (days <= 0) return t('slotRunning');
  if (days === 1) return t('slotTomorrow');
  return t('slotInDays')(days);
}
function slotPlace(place){
  return '<a class="slot-place" target="_blank" rel="noopener" href="' +
    'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place) + '">' +
    svgIcon(ICONS.pin) + '<span>' + place + '</span>' + svgIcon(ICONS.external) + '</a>';
}
function slotMeta(kind){
  var bits = [];
  if (kind.when) bits.push(kind.when[LANG]);
  if (kind.price) bits.push(kind.price[LANG]);
  return bits.length ? '<p class="slot-meta">' + bits.join(' \u00B7 ') + '</p>' : '';
}
function scheduleHtml(f){
  var sc = f.schedule;
  if (!sc) return '';
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var open = (sc.slots || []).filter(function(sl){
    return ymd(sl.end || sl.d) >= today;
  });
  var srcLink = sc.src
    ? '<a class="slot-src" target="_blank" rel="noopener" href="'+sc.src+'">' +
      t('slotsSource') + svgIcon(ICONS.external) + '</a>'
    : '';

  var extras = (sc.extra || []).map(function(x){
    return '<li><span class="slot-rest-kind">'+x[LANG]+'</span>' + slotMeta(x) + '</li>';
  }).join('');
  var extraBlock = extras
    ? '<details class="slot-more"><summary>'+t('otherPickup')+'</summary>' +
      '<ul class="slot-rest">'+extras+'</ul></details>'
    : '';

  if (!open.length){
    return '<div class="d-slots stale"><p class="d-slots-head">'+svgIcon(ICONS.calendar)+
      '<span>'+t('nextSlot')+'</span></p><p class="slot-stale">'+t('slotsStale')+'</p>' +
      extraBlock + srcLink + '</div>';
  }

  var next = open[0], kind = sc.kinds[next.k] || {};
  var rest = open.slice(1).map(function(sl){
    var k = sc.kinds[sl.k] || {};
    return '<li><span class="slot-rest-date">'+slotRange(sl)+'</span>' +
           '<span class="slot-rest-kind">'+(k[LANG] || '')+'</span></li>';
  }).join('');

  return '<div class="d-slots">' +
    '<p class="d-slots-head">'+svgIcon(ICONS.calendar)+'<span>'+t('nextSlot')+'</span></p>' +
    '<p class="slot-next"><strong>'+slotRange(next)+'</strong>' +
      '<span class="slot-lead">'+slotLead(next, today)+'</span></p>' +
    '<p class="slot-kind">'+(kind[LANG] || '')+'</p>' +
    slotMeta(kind) +
    (kind.place ? slotPlace(kind.place) : '') +
    (rest ? '<details class="slot-more"><summary>'+t('moreSlots')(open.length - 1)+'</summary>' +
            '<ul class="slot-rest">'+rest+'</ul></details>' : '') +
    extraBlock +
    srcLink +
  '</div>';
}

/* Bedynky, a vending machine or a CSA share are ways of buying, not buttons -
   they read as a sentence about how this farm sells, next to the hours. */
var BUY_WAYS = ['bedynky','samosber','kpz','automat','mobile'];
var buyWays = (f.offers || []).filter(function(o){ return BUY_WAYS.indexOf(o) !== -1; });
var farmExtras = (f.offers || []).filter(function(o){ return BUY_WAYS.indexOf(o) === -1; });
function offerLine(label, list, icon){
  if (!list.length) return '';
  return '<p class="d-fact d-fact-sub">'+svgIcon(icon)+
         '<span><strong>'+label+':</strong> '+
         list.map(function(o){ return t('offerNames')[o]; }).join(', ')+'</span></p>';
}
var offersHtml = offerLine(t('waysToBuy'), buyWays, ICONS.cart) +
                 offerLine(t('alsoOnFarm'), farmExtras, ICONS.store) +
                 ((f.delivery || []).length
                   ? '<p class="d-fact d-fact-sub">'+svgIcon(ICONS.truck)+
                     '<span><strong>'+t('deliveryLabel')+':</strong> '+
                     f.delivery.map(function(d){ return t('deliveryNames')[d]; }).join(', ')+'</span></p>'
                   : '');

    var awardsHtml = (f.awards && f.awards.length)
      ? '<div class="d-awards">' + f.awards.map(function(a){
          return '<span class="award-badge">'+svgIconFilled(ICONS.award)+a[LANG]+'</span>';
        }).join('') + '</div>'
      : '';

    /* Only certification is stated. Not holding one says nothing about a
       farm, so nothing is shown for it. */
    var certHtml = f.cert === 'bio'
      ? '<span class="cert-pill cert-bio">'+svgIcon(ICONS.leaf)+
        '<span>'+t('certNames').bio+'</span></span>'
      : '';

    drawerContent.innerHTML =
      '<div class="d-cats">'+catsHtml+certHtml+'</div>' +
      '<h2>'+f.name+'</h2>' +
      '<a class="d-loc" href="https://www.google.com/maps/search/?api=1&query='+
        encodeURIComponent(f.name + ', ' + f.town.cs)+'" target="_blank" rel="noopener">' +
        svgIcon(ICONS.pin)+'<span>'+f.town[LANG]+', '+f.region[LANG]+'</span>'+svgIcon(ICONS.external)+'</a>' +
      awardsHtml +
      '<h3>'+t('story')+'</h3>' +
      '<ul class="d-story">'+storyHtml+'</ul>' +
      '<h3>'+t('whereToBuy')+'</h3>' +
      ((shopsHtml || eshopBtn) ? '<div class="d-shops">'+eshopBtn+shopsHtml+'</div>' : '') +
      (f.shipNote ? '<p class="ship-note">'+f.shipNote[LANG]+'</p>' : '') +
      gateHtml +
      scheduleHtml(f) +
      hoursHtml +
      offersHtml +
      '<div class="d-actions">'+actions+'</div>' +
      contactRow(f);

    syncDrawerFav(f.id);
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden','false');
    scrim.classList.add('show');
  }

  function syncDrawerFav(id){
    var b = document.getElementById('drawerFav');
    var on = FAVS.has(id);
    b.innerHTML = svgIcon(ICONS.heart);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', on ? t('favRemove') : t('favAdd'));
    b.setAttribute('title', on ? t('favRemove') : t('favAdd'));
  }

  function closeDrawer(){
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden','true');
    scrim.classList.remove('show');
    document.querySelectorAll('.pin').forEach(function(p){ p.classList.remove('selected'); });
    document.querySelectorAll('.farm-card').forEach(function(c){ c.classList.remove('active'); });
    currentId = null;
  }

  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', function(){ closeDrawer(); closeMobileList(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeDrawer(); closeMobileList(); }
  });

  /* ---- Mobile farm list drawer ---- */
  var mobileListDrawer = document.getElementById('mobileListDrawer');
  function openMobileList(){
    mobileListDrawer.classList.add('open');
    mobileListDrawer.setAttribute('aria-hidden','false');
    scrim.classList.add('show');
  }
  function closeMobileList(){
    mobileListDrawer.classList.remove('open');
    mobileListDrawer.setAttribute('aria-hidden','true');
    if (!drawer.classList.contains('open')) scrim.classList.remove('show');
  }
  /* Wide enough for a column, the list opens beside the map; on a narrow
     screen there is no room for that, so it slides over instead. */
  document.getElementById('listToggle').addEventListener('click', function(){
    if (window.matchMedia('(max-width:960px)').matches){ openMobileList(); return; }
    var open = document.querySelector('.layout').classList.toggle('list-open');
    this.classList.toggle('on', open);
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (typeof updateTipSides === 'function') setTimeout(updateTipSides, 60);
  });


/* ---- Favourites ---- */
document.getElementById('favChip').addEventListener('click', function(){
  onlyFavs = !onlyFavs;
  this.classList.toggle('active', onlyFavs);
  this.setAttribute('aria-pressed', onlyFavs ? 'true' : 'false');
  applyFilters();
});

document.getElementById('drawerFav').addEventListener('click', function(){
  if (currentId) toggleFav(currentId);
});

document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var fav = e.target.closest && e.target.closest('.fav-btn');
  if (fav){ e.preventDefault(); toggleFav(fav.dataset.fav); }
});

/* ---- Search suggestions: farms by name or product, plus any Czech town ---- */
var suggestBox = document.getElementById('searchSuggest');
var searchEl = document.getElementById('searchInput');

function placeToLatLon(p){ return { lat:p.lat, lon:p.lon }; }

function showSuggestions(q){
  var fq = fold(q.trim());
  if (fq.length < 2){ hideSuggestions(); return; }

  var farmHits = FARMS.filter(function(f){ return farmHaystack(f).indexOf(fq) !== -1; }).slice(0, 5);
  var placeHits = gazetteer().filter(function(p){ return p.fold.indexOf(fq) === 0; });
  if (placeHits.length < 6){
    var more = gazetteer().filter(function(p){ return p.fold.indexOf(fq) > 0; });
    placeHits = placeHits.concat(more);
  }
  placeHits = placeHits.slice(0, 6);

  if (!farmHits.length && !placeHits.length){ hideSuggestions(); return; }

  var html = '';
  if (farmHits.length){
    html += '<div class="suggest-group">'+t('farmsGroup')+'</div>';
    farmHits.forEach(function(f){
      html += '<button type="button" class="suggest-item" role="option" data-farm="'+f.id+'">' +
              svgIcon(ICONS.pin)+'<span>'+f.name+'</span>' +
              '<span class="sub">'+f.town[LANG]+'</span></button>';
    });
  }
  if (placeHits.length){
    html += '<div class="suggest-group">'+t('placesGroup')+'</div>';
    placeHits.forEach(function(p, i){
      html += '<button type="button" class="suggest-item" role="option" data-place="'+i+'">' +
              svgIcon(ICONS.town)+'<span>'+p.name+'</span>' +
              '<span class="sub">'+p.okres+'</span></button>';
    });
  }
  suggestBox.innerHTML = html;
  suggestBox._places = placeHits;
  suggestBox.hidden = false;
  searchEl.setAttribute('aria-expanded', 'true');
}

function hideSuggestions(){
  suggestBox.hidden = true;
  searchEl.setAttribute('aria-expanded', 'false');
}

/* Picking a town answers "what is near here?" - it becomes the reference
   point for the proximity filter and the map flies to it. */
function krajOfOkres(okres){
  var i = OKRESY.indexOf(okres);
  return i === -1 ? null : (OKRES_KRAJ[i] || null);
}

function goToPlace(p){
  searchEl.value = '';
  searchQuery = '';
  hideSuggestions();
  /* Someone typing a town wants the farms around it, so the region that town
     belongs to becomes the filter and the whole kraj fills the map. The town
     is only remembered as a reference point for "Blizko me". */
  var kraj = krajOfOkres(p.okres);
  setUserLocation(placeToLatLon(p), !!kraj);
  if (kraj){
    setRegion(kraj);
    showHint(t('townRegion')(p.name, kraj), true);
  } else {
    showHint(t('nearPlace')(p.name, p.okres), true);
  }

  /* setRegion already framed the whole kraj. Only when the town sits in no
     region we know do we fall back to flying to the town itself. */
  if (!kraj){
    view.fx = ((p.lon - PROJ.minlon) * PROJ.cosLat * PROJ.scale + PROJ.margin) / VB_W;
    view.fy = ((PROJ.maxlat - p.lat) * PROJ.scale + PROJ.margin) / VB_H;
    view.s = 3;
    applyView();
  }
}

suggestBox.addEventListener('click', function(e){
  var item = e.target.closest('.suggest-item');
  if (!item) return;
  if (item.dataset.farm){
    searchEl.value = '';
    searchQuery = '';
    hideSuggestions();
    applyFilters();
    openFarm(item.dataset.farm);
  } else {
    goToPlace(suggestBox._places[+item.dataset.place]);
  }
});

searchEl.addEventListener('input', function(e){ showSuggestions(e.target.value); });
searchEl.addEventListener('focus', function(e){ if (e.target.value) showSuggestions(e.target.value); });
document.addEventListener('click', function(e){
  if (!suggestBox.contains(e.target) && e.target !== searchEl) hideSuggestions();
});
searchEl.addEventListener('keydown', function(e){
  if (e.key === 'Escape') hideSuggestions();
});

  /* ---- Language switching ---- */
  document.querySelector('#favChip .cat-icon').innerHTML = svgIcon(ICONS.heart);
  document.querySelectorAll('.dd-icon').forEach(function(el){
    el.innerHTML = svgIcon(ICONS[el.dataset.icon]);
  });

  function renderChipIcons(){
    Object.keys(CAT).forEach(function(c){
      var dot = document.querySelector('.chip[data-cat="'+c+'"] .dot');
      if (dot && !dot.classList.contains('cat-icon')){
        dot.classList.add('cat-icon');
        dot.innerHTML = svgIconFilled(CAT[c].icon);
      }
    });
  }

  function applyStaticText(){
    document.documentElement.lang = LANG;
    document.getElementById('txtTitle').textContent = t('title');
    document.getElementById('txtTagline').textContent = t('tagline');
    document.getElementById('txtListToggle').textContent = t('listToggle');
    document.getElementById('txtFootnote').textContent = t('footnote');
    if (document.querySelector('[data-rec-open]')) recLabels();
    document.getElementById('searchInput').placeholder = t('searchPlaceholder');
    document.getElementById('filterBar').setAttribute('aria-label', t('filterAria'));
    document.querySelector('.chip[data-cat="all"] .chip-label').textContent = t('chipAll');
    document.getElementById('txtListHeading').textContent = t('listHeading');
    document.getElementById('txtFavChip').textContent = t('favChip');
    document.getElementById('txtNearChip').textContent = t('nearChip');
    document.getElementById('txtClear').textContent = t('clearFilters');
    document.getElementById('txtMapReset').textContent = t('mapReset');
    Object.keys(CAT).forEach(function(c){
      var el = document.querySelector('.chip[data-cat="'+c+'"] .chip-label');
      if (el) el.textContent = CAT[c].label[LANG];
    });
    document.querySelectorAll('#langSwitch button').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === LANG);
    });
    document.querySelectorAll('#regionsLayer path.region').forEach(function(p){
      var cs = p.getAttribute('data-region');
      var entry = REGION_LIST.filter(function(r){ return r.cs === cs; })[0];
      var title = p.querySelector('title');
      if (title) title.textContent = entry ? entry[LANG] : cs;
    });
  }

  function setLang(lang){
    if (lang !== 'cs' && lang !== 'en') return;
    LANG = lang;
    try { localStorage.setItem('cfa_lang', LANG); } catch(e){}
    applyStaticText();
    renderChannelOptions();
    renderRegionOptions();
    renderFarmLists();
    if (currentId) openFarm(currentId);
  }

  document.getElementById('langSwitch').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-lang]');
    if (btn) setLang(btn.dataset.lang);
  });

  renderChipIcons();
  applyStaticText();
  renderChannelOptions();
  renderDeliveryOptions();
  renderRegionOptions();
  renderFarmLists();

/* ---- Recommend a farm ----------------------------------------------------
   The address tips are sent to. Joined at runtime rather than written out
   whole, because this page is public and a plain address in the markup is the
   first thing an address harvester picks up. Nothing is posted to a server
   from here - the visitor sends the mail from their own client. */
var SUGGEST_TO = ["patrycja.szuscik", "gmail.com"].join("@");

var recPanel = document.getElementById('recPanel');
var recScrim = document.getElementById('recScrim');

function recLabels(){
  document.querySelectorAll('[data-rec-open]').forEach(function(b){ b.textContent = t('recOpen'); });
  document.getElementById('recTitle').textContent  = t('recTitle');
  document.getElementById('recLead').textContent   = t('recLead');
  document.getElementById('recLName').textContent  = t('recName');
  document.getElementById('recLWeb').textContent   = t('recWeb');
  document.getElementById('recLNote').textContent  = t('recNote');
  document.getElementById('recSend').textContent   = t('recSend');
  document.getElementById('recHint').textContent   = t('recHint');
}

function recText(){
  var v = function(id){ return document.getElementById(id).value.trim(); };
  return [t('recName') + ': ' + v('recName'),
          t('recWeb') + ': ' + v('recWeb'),
          t('recNote') + ': ' + v('recNote')].join('\n');
}

function openRec(){
  recLabels();
  recScrim.hidden = false;
  recPanel.hidden = false;
  document.getElementById('recName').focus();
}
function closeRec(){ recPanel.hidden = true; recScrim.hidden = true; }

document.querySelectorAll('[data-rec-open]').forEach(function(b){ b.addEventListener('click', openRec); });
document.getElementById('recClose').addEventListener('click', closeRec);
recScrim.addEventListener('click', closeRec);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !recPanel.hidden) closeRec();
});

document.getElementById('recSend').addEventListener('click', function(){
  if (!document.getElementById('recName').value.trim()){ showToast(t('recNeedName')); return; }
  window.location.href = 'mailto:' + SUGGEST_TO +
    '?subject=' + encodeURIComponent(t('recTitle')) +
    '&body=' + encodeURIComponent(recText());
  closeRec();
});

recLabels();

})();
