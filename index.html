  story:{ cs:["Farmu zalo\u017Eil v roce 2005 Martin Kozohorsk\u00FD s rodinou v osad\u011B Chaloupky-Oub\u011Bnice na Dob\u0159\u00ED\u0161sku \u2014 p\u016Fvodn\u011B jako farmu jelen\u00ED.",
              "Maj\u00ED prostornou oboru s loukami, p\u00EDskovcov\u00FDmi skalami a lesem, kde chovaj\u00ED divokou zv\u011B\u0159 i masn\u00FD skot.",
              "Zv\u00ED\u0159ata jsou na pastv\u011B ve dne i v noci, na jedno p\u0159ipad\u00E1 jeden a\u017E dva hektary a p\u0159ipou\u0161t\u00ED se p\u0159irozen\u011B.",
              "Krmivo je bez GMO a farma si zaji\u0161\u0165uje vlastn\u00ED por\u00E1\u017Eku.",
              "BIO certifikaci m\u00E1 hov\u011Bz\u00ED a jehn\u011B\u010D\u00ED. Zv\u011B\u0159ina ji nem\u00E1 \u2014 divokou zv\u011B\u0159 ze z\u00E1kona nelze chovat v ekologick\u00E9m re\u017Eimu, p\u00E9\u010De je ale stejn\u00E1.",
              "Na Scuku nab\u00EDzej\u00ED kolem devades\u00E1ti polo\u017Eek: BIO hov\u011Bz\u00ED od mlet\u00E9ho po sv\u00ED\u010Dkovou, T-bone a Rib Eye, BIO jehn\u011B\u010D\u00ED, zv\u011B\u0159inu (jelen\u00ED, dan\u010D\u00ED, srn\u010D\u00ED, divo\u010D\u00E1k) i \u010Derstv\u00E9 ryby \u2014 pstruha duhov\u00E9ho a lososovit\u00E9ho a sume\u010Dka africk\u00E9ho.",
              "Pozor, existuje i jin\u00E1 Poctiv\u00E1 farma ve Verm\u011B\u0159ovic\u00EDch na Orlicko\u00FAstecku; s touto nem\u00E1 nic spole\u010Dn\u00E9ho."],
          en:["Martin Kozohorsk\u00FD and his family founded the farm in 2005 at Chaloupky-Oub\u011Bnice near Dob\u0159\u00ED\u0161 \u2014 originally as a deer farm.",
              "They have a spacious enclosure of meadows, sandstone outcrops and woodland, holding both wild game and beef cattle.",
              "The animals are on pasture day and night, at one to two hectares each, with natural mating.",
              "Feed is GMO-free and the farm does its own slaughter.",
              "The beef and lamb are organically certified. The venison is not \u2014 game cannot legally be kept under organic rules \u2014 though the animals are cared for the same way.",
              "Scuk lists around ninety items: organic beef from mince to fillet, T-bone and Rib Eye, organic lamb, venison (red, fallow, roe and wild boar) and fresh fish \u2014 rainbow and salmon trout, and African catfish.",
              "Note there is a different Poctiv\u00E1 farma at Verm\u011B\u0159ovice in the \u00DAst\u00ED nad Orlic\u00ED area; the two are unrelated."] } },

  story:{ cs:["Rodinn\u00E1 ekologick\u00E1 farma Radima Holovsk\u00E9ho ml. v Trn\u011Bn\u00E9m \u00DAjezd\u011B u Karl\u0161tejna, z\u010D\u00E1sti v CHKO \u010Cesk\u00FD kras, nedaleko lom\u016F Velk\u00E1 a Mal\u00E1 Amerika.",
              "Hospoda\u0159\u00ED na 220 hektarech \u2014 zhruba p\u016Fl na p\u016Fl orn\u00E1 p\u016Fda a travn\u00ED porosty.",
              "Chovaj\u00ED masn\u00E1 plemena skotu, ovce, prasata a dr\u016Fbe\u017E; trval\u00E9 travn\u00ED porosty slou\u017E\u00ED hlavn\u011B jako pastviny.",
              "Na orn\u00E9 p\u016Fd\u011B p\u011Bstuj\u00ED p\u0161enici, oves, je\u010Dmen, kuku\u0159ici a brambory, \u010D\u00EDm\u017E si zaji\u0161\u0165uj\u00ED v\u011Bt\u0161inu krmiv.",
              "Cel\u00E1 farma je od dubna 2011 v re\u017Eimu ekologick\u00E9ho zem\u011Bd\u011Blstv\u00ED, certifikuje KEZ o.p.s. \u2014 prvn\u00ED certifik\u00E1t v roce 2013, ka\u017Edoro\u010Dn\u011B obnovovan\u00FD.",
              "Farmu sm\u011B\u0159uj\u00ED k regenerativn\u00EDmu hospoda\u0159en\u00ED: bez chemick\u00FDch hnojiv a post\u0159ik\u016F, s p\u0159echodem na bezorebn\u00E9 zpracov\u00E1n\u00ED p\u016Fdy.",
              "Rodina hospoda\u0159\u00ED v Trn\u011Bn\u00E9m \u00DAjezd\u011B od po\u010D\u00E1tku 20. stolet\u00ED; majetek j\u00ED byl v 50. letech zabaven a vr\u00E1cen a\u017E v roce 1990.",
              "Objedn\u00E1vky masa a ostatn\u00EDch produkt\u016F vy\u0159izuje Anna Holovsk\u00E1 na \u010D\u00EDsle +420 602 951 288.",
              "V pl\u00E1nu maj\u00ED kr\u00E1mek pro prodej p\u0159\u00EDmo ve dvo\u0159e farmy."],
          en:["Radim Holovsk\u00FD jr.'s family organic farm at Trn\u011Bn\u00FD \u00DAjezd near Karl\u0161tejn, partly inside the \u010Cesk\u00FD kras protected landscape area, close to the Velk\u00E1 and Mal\u00E1 Amerika quarries.",
              "They work 220 hectares, split roughly half arable and half grassland.",
              "They keep beef cattle breeds, sheep, pigs and poultry; the permanent grassland serves mainly as pasture.",
              "Wheat, oats, barley, maize and potatoes on the arable land cover most of their own feed.",
              "The whole farm has been in the organic regime since April 2011, certified by KEZ o.p.s. \u2014 first certificate in 2013, renewed every year.",
              "They are moving the farm toward regenerative practice: no chemical fertilisers or sprays, shifting to no-till cultivation.",
              "The family has farmed at Trn\u011Bn\u00FD \u00DAjezd since the early 20th century; the property was seized in the 1950s and only returned in 1990.",
              "Meat and other orders are handled by Anna Holovsk\u00E1 on +420 602 951 288.",
              "A farm shop in the yard is planned."] } },

  story:{ cs:["Ekologick\u00E1 farma na Vala\u0161sku, ocen\u011Bn\u00E1 jako Ekofarma roku 2025.",

              "Na konci v\u00FDkrmu p\u0159ipad\u00E1 na metr \u010Dtvere\u010Dn\u00ED zast\u0159e\u0161en\u00E9 plochy nejv\u00FD\u0161 5,5 ku\u0159ete; v konven\u010Dn\u00EDm chovu je to zhruba 15\u201317 kus\u016F.",

          en:["An organic farm in Wallachia, named Organic Farm of the Year 2025.",
              "Chilled pasture-raised chicken, goose, lamb and beef.",
              "Poultry is processed in their own certified facility.",
              "Individual poultry batches and their dates are published on the site as they come; beef is by order.",

  /* Farms in the same town would otherwise stack into one unclickable pin, so

  (function spreadOverlappingPins(){
    var placed = [];
    var minDx = 2.3, minDy = 3.9, aspect = VB_W / VB_H;
    FARMS.forEach(function(f){
      var baseX = parseFloat(f.leftPct), baseY = parseFloat(f.topPct);
      var x = baseX, y = baseY, tries = 0, angle = 0;
      function collides(){
        return placed.some(function(p){
          return Math.abs(p.x - x) < minDx && Math.abs(p.y - y) < minDy;
        });
      }
      while (collides() && tries < 24){
        angle += 1.1;
        var r = 1.1 + tries * 0.22;
        x = baseX + Math.cos(angle) * r;
        y = baseY + Math.sin(angle) * r * aspect;
        tries++;
      }
      f.leftPct = x.toFixed(2);
      f.topPct = y.toFixed(2);
      placed.push({ x:x, y:y });

  /* The SVG letterboxes its viewBox inside the stage box (xMidYMid meet),

     the two disagree and every pin drifts off the country, so size the
     stage to the largest 900:532.92 rectangle that fits the frame -- then
     box and artwork are the same rectangle and the pins land true. */
  function fitStage(){
    var inner = mapStage.parentElement;
    var cs = getComputedStyle(inner);
    var w = inner.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var h = inner.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (!(w > 0) || !(h > 0)) return;
    mapStage.style.width = Math.min(w, h * VB_W / VB_H).toFixed(1) + 'px';

    var floor = w < 420 ? 0.58 : w < 560 ? 0.68 : 0.90;

  if (window.ResizeObserver){

  setInterval(function(){

  (f.awards || []).forEach(function(a){ parts.push(a.cs, a.en); });
  (f.sellers || []).forEach(function(x){ parts.push(x.name); });
  (f.tags || []).forEach(function(x){ parts.push(x); });
  if (f.hours) parts.push(f.hours.cs, f.hours.en);
  f._hay = fold(parts.filter(Boolean).join(' '));
  return f._hay;
}

/* People search by product, not by farm name, and they mix the two languages
   and the word order freely: "hovezi jatra", "organ meats", "raw milk".
   Every group below is interchangeable in both directions, and a query of
   several words matches when each word finds something - so "veprove jatra"
   hits a farm whose page says pork in one place and liver in another. */
var SEARCH_SYN = (function(){
  var groups = [
    ["maso","meat"],["hovezi","beef"],["veprove","pork"],["jehneci","lamb"],
    ["skopove","mutton"],["telec\u00ED","telec","veal"],["kureci","kure","chicken"],
    ["drubez","poultry"],["kachna","kachni","duck"],["husa","husi","goose"],
    ["kruta","kruti","turkey"],["kralik","kralici","rabbit"],
    ["zverina","game","venison"],["jeleni","red deer"],["danci","fallow"],
    ["srnci","roe"],["divocak","wild boar"],
    ["vnitrnosti","droby","offal","organ meats","organ meat"],
    ["jatra","liver"],["srdce","heart"],["ledvinky","ledviny","kidney","kidneys"],
    ["jazyk","tongue"],["kostni dren","bone marrow","marrow","morek"],
    ["brzlik","sweetbread","sweetbreads"],["drstky","tripe"],
    ["loj","tallow"],["sadlo","lard"],["slanina","bacon"],
    ["klobasa","klobasy","sausage","sausages","parky","spekacky"],
    ["sunka","ham"],["pastika","pate"],["gulas","goulash"],["steak","biftek"],
    ["mleko","milk"],["syrove mleko","raw milk"],["syr","syry","cheese"],
    ["maslo","butter"],["jogurt","yoghurt","yogurt"],["tvaroh","curd","quark"],
    ["smetana","cream"],["kefir","kefir drink"],["podmasli","buttermilk"],
    ["kozi","goat"],["ovci","sheep"],["kravske","cow"],
    ["vejce","egg","eggs"],["med","honey"],
    ["zelenina","vegetables","veg"],["ovoce","fruit"],["brambory","potatoes"],
    ["bylinky","herbs"],["mouka","flour"],["chleb","bread"],
    ["bedynky","bedynka","veg box","box"]
  ];
  var m = {};
  groups.forEach(function(g){
    g.forEach(function(w){
      m[w] = (m[w] || []).concat(g.filter(function(x){ return x !== w; }));
    });
  });
  return m;
})();

/* Matching at the START of a word, not anywhere inside one: a plain
   substring made "liver" fire on "delivery" and "med" on "Medlanky",
   while a full word boundary would have broken typing half a farm's
   name. Word-start keeps the prefix search and drops the nonsense. */
var WORD_RE = {};
function wordStart(hay, w){
  var re = WORD_RE[w] || (WORD_RE[w] =
    new RegExp('(^|[^a-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
  return re.test(hay);
}
function termHit(hay, w){
  if (wordStart(hay, w)) return true;
  var alts = SEARCH_SYN[w];
  if (!alts) return false;
  for (var i = 0; i < alts.length; i++){ if (wordStart(hay, alts[i])) return true; }
  return false;
}

/* Whole phrase first, so "organ meats" and "raw milk" keep their meaning;
   only then word by word, which is what rescues "hovezi srdce". */
function searchHit(hay, q){
  var fq = fold(q).trim();
  if (!fq) return true;
  if (termHit(hay, fq)) return true;
  var words = fq.split(/\s+/).filter(Boolean);
  if (words.length < 2) return false;
  for (var i = 0; i < words.length; i++){ if (!termHit(hay, words[i])) return false; }
  return true;
}

function matches(f){
    if (onlyFavs && !FAVS.has(f.id)) return false;
    var catOk = !activeCats.length || f.cats.some(function(c){ return activeCats.indexOf(c) !== -1; });
    var chanOk = activeChannel === 'all' || farmChannels(f).indexOf(activeChannel) !== -1;
    var regionOk = activeRegion === 'all' || f.region.cs === activeRegion;
    var delivOk = activeDelivery === 'all' || (f.delivery || []).indexOf(activeDelivery) !== -1;
    var q = searchQuery.trim().toLowerCase();
    var textOk = !q || searchHit(farmHaystack(f), q);
    return catOk && chanOk && regionOk && delivOk && textOk;
  }

  function renderDeliveryOptions(){
    var counts = {};
    FARMS.forEach(function(f){ (f.delivery || []).forEach(function(d){ counts[d] = (counts[d] || 0) + 1; }); });
    var opts = [{ value:'all', label:(activeDelivery === 'all' ? t('deliveryLabel') : t('deliveryAll')), count:FARMS.length }];
    DELIVERY.forEach(function(d){
      if (!counts[d]) return;
      opts.push({ value:d, label:t('deliveryNames')[d], count:counts[d] });
    });
    deliveryDD.set(opts, activeDelivery);
    deliveryDD.setOn(activeDelivery !== 'all');
  }

  function renderRegionOptions(){
    var counts = {};
    FARMS.forEach(function(f){ counts[f.region.cs] = (counts[f.region.cs] || 0) + 1; });
    var opts = [{ value:'all', label:(activeRegion === 'all' ? t('regionLabel') : t('regionAll')), count:FARMS.length }];
    REGION_LIST.forEach(function(r){

  }

  /* Minimal listbox: a pill trigger plus a menu in the page's own styling.
     The menu lives on <body> because the filter bar scrolls and would clip it. */
  function makeDropdown(hostId, onSelect){
    var host = document.getElementById(hostId);
    var trigger = host.querySelector('.dd-trigger');
    var labelEl = host.querySelector('.dd-label');
    var menu = document.createElement('div');
    menu.className = 'dd-menu';
    menu.setAttribute('role', 'listbox');
    document.body.appendChild(menu);

    var options = [], value = null, focusIdx = -1;

    function close(){
      menu.classList.remove('open');
      host.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
      focusIdx = -1;
    }
    /* The menu used to be pinned under its trigger whatever the consequences.
       Inside the filter sheet the triggers sit near the bottom of the screen,
       so Kraj opened into the two visible lines below it and the other twelve
       regions were off the bottom edge with no way to reach them. It now
       takes whichever side has more room and never exceeds it. */
    function open(){
      menu.classList.add('open');
      menu.style.maxHeight = '';
      menu.style.width = '';
      menu.style.maxWidth = '';

      var r = trigger.getBoundingClientRect();
      var vv = window.visualViewport;
      var viewTop = vv ? vv.offsetTop : 0;
      var viewH = vv ? vv.height : window.innerHeight;
      var GAP = 6, EDGE = 8;

      /* A narrow menu floating under a full-width control reads as if it
         belongs to something else, so match the trigger when it is wide. */
      if (r.width >= 230){
        menu.style.width = r.width + 'px';
        menu.style.maxWidth = r.width + 'px';   /* beats the 320px design cap */
      }

      var w = menu.offsetWidth;
      menu.style.left = Math.max(EDGE, Math.min(r.left, window.innerWidth - w - EDGE)) + 'px';

      var below = (viewTop + viewH) - r.bottom - GAP - EDGE;
      var above = r.top - viewTop - GAP - EDGE;
      var natural = menu.scrollHeight;
      var downwards = natural <= below || below >= above;
      var room = Math.max(140, Math.min(downwards ? below : above, 340));

      menu.style.maxHeight = room + 'px';
      if (downwards){
        menu.style.top = (r.bottom + GAP) + 'px';
      } else {
        menu.style.top = (r.top - GAP - Math.min(natural, room)) + 'px';
      }

      host.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
      var sel = menu.querySelector('[aria-selected="true"]');
      if (sel) sel.scrollIntoView({ block:'nearest' });
    }
    function isOpen(){ return menu.classList.contains('open'); }

    function paint(){
      menu.innerHTML = options.map(function(o, i){
        return '<button type="button" class="dd-opt" role="option" data-i="'+i+'"' +
               ' aria-selected="'+(o.value === value)+'">' +
               '<span>'+o.label+'</span>' +
               (o.count === undefined ? '' : '<span class="dd-count">'+o.count+'</span>') +
               '</button>';
      }).join('');
      var cur = options.filter(function(o){ return o.value === value; })[0];
      labelEl.textContent = cur ? cur.label : '';
    }

    menu.addEventListener('click', function(e){
      var opt = e.target.closest('.dd-opt');
      if (!opt) return;
      close();
      onSelect(options[parseInt(opt.dataset.i, 10)].value);
    });
    trigger.addEventListener('click', function(){ isOpen() ? close() : open(); });
    trigger.addEventListener('keydown', function(e){
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if (!isOpen()) open(); }
    });
    document.addEventListener('keydown', function(e){
      if (!isOpen()) return;
      var opts = [].slice.call(menu.querySelectorAll('.dd-opt'));
      if (e.key === 'Escape'){ close(); trigger.focus(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        e.preventDefault();
        focusIdx = Math.max(0, Math.min(opts.length - 1, focusIdx + (e.key === 'ArrowDown' ? 1 : -1)));
        opts.forEach(function(o, i){ o.classList.toggle('focused', i === focusIdx); });
        opts[focusIdx].scrollIntoView({ block:'nearest' });
      } else if (e.key === 'Enter' && focusIdx >= 0){
        e.preventDefault();
        close();
        onSelect(options[focusIdx].value);
      }
    });
    document.addEventListener('click', function(e){
      if (isOpen() && !menu.contains(e.target) && !host.contains(e.target)) close();
    });
    window.addEventListener('resize', close);
    document.getElementById('filterBar').addEventListener('scroll', close);
    document.getElementById('filtersPanel').addEventListener('scroll', close);

    return {
      set:function(opts, val){ options = opts; value = val; paint(); },
      value:function(){ return value; },
      setOn:function(on){ host.classList.toggle('on', on); },
      host:host
    };
  }

  var channelDD = makeDropdown('channelDD', function(v){
    activeChannel = v;
    renderChannelOptions();
    applyFilters();
  });
  var regionDD = makeDropdown('regionDD', function(v){ setRegion(v); });
  var deliveryDD = makeDropdown('deliveryDD', function(v){
    activeDelivery = v;
    renderDeliveryOptions();
    applyFilters();
  });

  function renderChannelOptions(){
    var counts = {};
    CHANNELS.forEach(function(c){ counts[c] = 0; });
    FARMS.forEach(function(f){
      farmChannels(f).forEach(function(c){ counts[c] = (counts[c] || 0) + 1; });
    });
    var opts = [{ value:'all', label:(activeChannel === 'all' ? t('channelLabel') : t('channelAll')), count:FARMS.length }];
    CHANNELS.forEach(function(c){
      opts.push({ value:c, label:channelName(c), count:counts[c] || 0 });
    });
    channelDD.set(opts, activeChannel);
    channelDD.setOn(activeChannel !== 'all');
  }

  function applyFilters(){
    var visibleCount = 0;
    FARMS.forEach(function(f){
      var ok = matches(f);
      if (ok) visibleCount++;
      var pin = pinsLayer.querySelector('.pin[data-id="'+f.id+'"]');
      if (pin) pin.classList.toggle('dim', !ok);
      document.querySelectorAll('.farm-card[data-id="'+f.id+'"]').forEach(function(card){
        card.classList.toggle('hidden', !ok);
      });
    });
    document.querySelectorAll('.empty-state').forEach(function(el){
      el.hidden = visibleCount > 0;
      el.textContent = (onlyFavs && FAVS.size === 0) ? t('favEmpty') : t('noMatch');
    });
    var filtered = activeCats.length > 0 || activeChannel !== 'all' || activeRegion !== 'all' || activeDelivery !== 'all' ||
                   searchQuery;
    document.getElementById('mapCaption').textContent = visibleCount + ' ' + t('farmWord')(visibleCount) + (filtered ? t('farmsShown') + FARMS.length : '');
    document.getElementById('sidebarCount').textContent = visibleCount + (filtered ? '/' + FARMS.length : '');
    document.querySelectorAll('.list-filter-input').forEach(function(inp){
      if (document.activeElement !== inp) inp.value = searchQuery;
    });
    var hi = document.getElementById('searchInput');
    document.querySelector('.topbar').classList
      .toggle('searching', document.activeElement === hi || !!hi.value);
    refreshPinMarks();
    var activeCount = [activeCats.length > 0, activeChannel !== 'all', activeDelivery !== 'all',
                       activeRegion !== 'all', onlyFavs, !!searchQuery]
                      .filter(Boolean).length;
    var clearBtn = document.getElementById('clearFilters');
    clearBtn.hidden = activeCount === 0;
    document.getElementById('count-active').textContent = activeCount || '';
    document.getElementById('filtersCount').textContent = activeCount || '';
    document.getElementById('filterCountM').textContent =
      visibleCount + ' ' + t('farmWord')(visibleCount) + (filtered ? t('farmsShown') + FARMS.length : '');
    updateMapControls();
    if (typeof renderSeason === 'function') renderSeason();
  }

  /* "V\u0161e" clears the lot; any other chip toggles itself on or off, and with
     nothing chosen we are back to showing everything. */
  function refreshPinMarks(){
    FARMS.forEach(function(f){
      var pin = pinsLayer.querySelector('.pin[data-id="' + f.id + '"]');
      if (!pin) return;
      var dc = displayCat(f);
      if (pin.dataset.mark === dc) return;
      pin.dataset.mark = dc;
      pin.innerHTML = buildPinSVG(f) + '<span class="pin-tip">' + f.name + '</span>';
    });
  }

  function syncCatChips(){
    document.querySelectorAll('.chip[data-cat]').forEach(function(c){
      c.classList.toggle('active', c.dataset.cat === 'all'
        ? activeCats.length === 0
        : activeCats.indexOf(c.dataset.cat) !== -1);
      c.setAttribute('aria-pressed', c.classList.contains('active') ? 'true' : 'false');
    });
  }

  document.getElementById('filterBar').addEventListener('click', function(e){
    var chip = e.target.closest('.chip[data-cat]');
    if (!chip) return;
    var cat = chip.dataset.cat;
    trackEvent('filtr/' + cat);
    if (cat === 'all'){
      activeCats = [];
    } else {
      var at = activeCats.indexOf(cat);
      if (at === -1) activeCats.push(cat); else activeCats.splice(at, 1);
    }
    syncCatChips();
    applyFilters();
  });

  document.getElementById('sortRow').addEventListener('click', function(e){
    var b = e.target.closest('.sort-btn');
    if (!b) return;
    sortMode = b.dataset.sort;
    this.querySelectorAll('.sort-btn').forEach(function(x){
      x.classList.toggle('active', x.dataset.sort === sortMode);
    });
    renderFarmLists();
  });

  document.getElementById('searchInput').addEventListener('input', function(e){
    searchQuery = e.target.value;
    applyFilters();
  });

  /* On a phone the field is an icon until it is used; while it is in use it
     takes the whole header row, because 62vw left the suggestions narrower
     than their own text. applyFilters() owns the class once a query exists,
     so this only has to cover plain focus and blur. */
  (function searchRow(){
    var topbar = document.querySelector('.topbar');
    var inp = document.getElementById('searchInput');
    function sync(){
      topbar.classList.toggle('searching',
        document.activeElement === inp || !!inp.value);
    }
    inp.addEventListener('focus', sync);
    inp.addEventListener('blur', function(){ setTimeout(sync, 120); });
    inp.addEventListener('input', sync);
  })();

  /* ---- Region selection + map zoom ---- */
  var mapStage = document.getElementById('mapStage');

  var view = { s:1, fx:0.5, fy:0.5 };

  /* Map point -> screen point. The stage's own rect already carries the zoom
     and pan, so one linear mapping covers every view. */
  /* The pin layer rides on the stage rather than inside it: give it the
     stage's current box and every pin's left/top percentage still resolves
     to the same point on the country, at full resolution. */
  /* Reached from the visualViewport handler, which lives outside this
     closure. */
  window.__repositionMap = function(){ positionCityLabels(); updateTipSides(); };

  function positionPins(){
    var inner = mapStage.parentElement;
    var sr = mapStage.getBoundingClientRect();
    var ir = inner.getBoundingClientRect();
    if (!sr.width || !sr.height) return;
    var st = pinsLayer.style;
    st.left   = (sr.left - ir.left).toFixed(1) + 'px';
    st.top    = (sr.top  - ir.top ).toFixed(1) + 'px';
    st.width  = sr.width.toFixed(1) + 'px';
    st.height = sr.height.toFixed(1) + 'px';
    st.right = st.bottom = 'auto';
  }

  var cityLabelEls = null;
  function positionCityLabels(){
    positionPins();
    var inner = mapStage.parentElement;
    if (!cityLabelEls || !cityLabelEls.length){
      cityLabelEls = [].slice.call(cityLabels.children);
      if (!cityLabelEls.length) return;
    }
    var sr = mapStage.getBoundingClientRect();
    var ir = inner.getBoundingClientRect();
    if (!sr.width || !sr.height) return;
    var ox = sr.left - ir.left, oy = sr.top - ir.top;
    for (var i = 0; i < cityLabelEls.length; i++){
      var el = cityLabelEls[i];
      var x = ox + (+el.dataset.x / VB_W) * sr.width;
      var y = oy + (+el.dataset.y / VB_H) * sr.height;
      el.style.transform = el.classList.contains('to-left')
        ? 'translate(' + (x - 7).toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-100%,-50%)'
        : 'translate(' + (x + 7).toFixed(1) + 'px,' + y.toFixed(1) + 'px) translateY(-50%)';
    }
  }

  /* The stage eases over ~0.5s, so follow it frame by frame rather than
     snapping the labels to the destination. */
  /* Follow until the stage has actually stopped, not for a fixed stretch of
     time: a frame budget that merely covers the 0.5s transition leaves the
     labels and the pin layer parked at the previous zoom if anything delays
     a frame. */
  var labelFollow = 0;
  function followCityLabels(ms){
    cancelAnimationFrame(labelFollow);
    var deadline = performance.now() + (ms || 1400);
    var lastW = -1, still = 0;
    (function step(){
      positionCityLabels();
      var w = mapStage.getBoundingClientRect().width;
      still = (Math.abs(w - lastW) < 0.05) ? still + 1 : 0;
      lastW = w;
      if (still < 3 && performance.now() < deadline) labelFollow = requestAnimationFrame(step);
    })();
  }
  mapStage.addEventListener('transitionend', function(e){
    if (e.propertyName === 'transform') positionCityLabels();
  });

  function applyView(){
    if (view.s <= 1.001){
      view.s = 1; view.fx = 0.5; view.fy = 0.5;
      mapStage.style.transform = '';
    } else {
      mapStage.style.transform =
        'translate(' + ((0.5 - view.fx * view.s) * 100).toFixed(2) + '%,' +
                       ((0.5 - view.fy * view.s) * 100).toFixed(2) + '%)' +
        ' scale(' + view.s.toFixed(3) + ')';
    }
    mapStage.style.setProperty('--zoom-scale', view.s.toFixed(3));
    setZoomedDetail(view.s > 1.35);
    updateMapControls();
    updatePinScale();
    updateTipSides();
    followCityLabels();
    setTimeout(updateTipSides, 520);
  }


/* ---- Pinch to zoom, drag to pan ------------------------------------------
   The +/- buttons were the only way in, which is not how anyone uses a map
   on a phone. Two fingers scale around the point between them; one finger
   pans once you are zoomed in. The CSS transition is switched off while a
   gesture is running, otherwise every frame chases the last one. */
(function(){
  var wrap = document.querySelector('.map-wrap');
  if (!wrap) return;

  var gest = null;

  function dist(t){
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function mid(t){
    return t.length > 1
      ? { x:(t[0].clientX + t[1].clientX) / 2, y:(t[0].clientY + t[1].clientY) / 2 }
      : { x:t[0].clientX, y:t[0].clientY };
  }
  /* Where a screen point sits in the map's own 0-1 space, so the spot under
     the fingers stays under the fingers as the scale changes. */
  function toStage(px, py){
    var b = wrap.getBoundingClientRect();
    return {
      x: view.fx + (px - b.left - b.width / 2) / (b.width * view.s),
      y: view.fy + (py - b.top - b.height / 2) / (b.height * view.s)
    };
  }
  function live(on){
    mapStage.style.transition = on ? 'none' : '';
  }

  wrap.addEventListener('touchstart', function(e){
    var t = e.touches;
    if (t.length === 2){
      gest = { mode:'pinch', d0:dist(t), s0:view.s, anchor:toStage(mid(t).x, mid(t).y) };
      live(true);
    } else if (t.length === 1 && view.s > 1.01){
      gest = { mode:'pan', x:t[0].clientX, y:t[0].clientY, fx:view.fx, fy:view.fy };
      live(true);
    }
  }, { passive:true });

  wrap.addEventListener('touchmove', function(e){
    if (!gest) return;
    var t = e.touches;

    if (gest.mode === 'pinch' && t.length === 2){
      e.preventDefault();
      var next = Math.max(1, Math.min(gest.s0 * (dist(t) / gest.d0), 6));
      var b = wrap.getBoundingClientRect(), m = mid(t);
      view.s = next;
      /* Keep the anchor under the fingers. */
      view.fx = gest.anchor.x - (m.x - b.left - b.width / 2) / (b.width * next);
      view.fy = gest.anchor.y - (m.y - b.top - b.height / 2) / (b.height * next);
      clampView();
      paint();
    } else if (gest.mode === 'pan' && t.length === 1){
      e.preventDefault();
      var b2 = wrap.getBoundingClientRect();
      view.fx = gest.fx - (t[0].clientX - gest.x) / (b2.width * view.s);
      view.fy = gest.fy - (t[0].clientY - gest.y) / (b2.height * view.s);
      clampView();
      paint();
    }
  }, { passive:false });

  function end(){
    if (!gest) return;
    gest = null;
    live(false);
    applyView();
  }
  wrap.addEventListener('touchend', end);
  wrap.addEventListener('touchcancel', end);

  /* Never let the map be dragged off screen. */
  function clampView(){
    if (view.s <= 1.001){ view.s = 1; view.fx = 0.5; view.fy = 0.5; return; }
    var half = 0.5 / view.s;
    view.fx = Math.max(half, Math.min(view.fx, 1 - half));
    view.fy = Math.max(half, Math.min(view.fy, 1 - half));
  }
  /* The cheap half of applyView: move it now, do the bookkeeping on release. */
  function paint(){
    mapStage.style.transform =
      'translate(' + ((0.5 - view.fx * view.s) * 100).toFixed(2) + '%,' +
                     ((0.5 - view.fy * view.s) * 100).toFixed(2) + '%)' +
      ' scale(' + view.s.toFixed(3) + ')';
    mapStage.style.setProperty('--zoom-scale', view.s.toFixed(3));
    /* Pinch and pan repaint every frame and skip the CSS transition, so the
       labels are placed here rather than through the follow loop. */
    positionCityLabels();
  }
})();

  function zoomBy(factor){
    view.s = Math.max(1, Math.min(view.s * factor, 6));
    applyView();
  }

  function zoomToRegion(name){
    var path = name === 'all' ? null : regionsLayer.querySelector('path[data-region="'+name+'"]');
    if (!path){ view.s = 1; applyView(); return; }
    var b = path.getBBox();
    var s = Math.min(VB_W / b.width, VB_H / b.height) * 0.82;
    view.s = Math.max(1, Math.min(s, 4));
    view.fx = (b.x + b.width / 2) / VB_W;
    view.fy = (b.y + b.height / 2) / VB_H;
    applyView();
  }

  /* Zoomed in there is room for more: farm names sit permanently beside their
     pins and the smaller district towns appear for orientation. */
  function setZoomedDetail(on){
    pinsLayer.classList.toggle('zoomed', on);
    citiesLayer.classList.toggle('zoomed', on);
    cityLabels.classList.toggle('zoomed', on);
  }

/* Zoomed into one region, only that region shows its district towns; the
   regions around it keep just their capital, so the edges stay readable. */
function focusLabels(kraj){
  var off = function(el){
    el.classList.toggle('off-focus', kraj !== 'all' && el.getAttribute('data-kraj') !== kraj);
  };
  citiesLayer.querySelectorAll('.town').forEach(off);
  cityLabels.querySelectorAll('.town').forEach(off);
}

  /* `el.hidden` is an HTMLElement property. On an SVG node it silently
     becomes a JS expando and the hidden="" attribute stays put, so
     [hidden]{display:none} keeps winning. Toggle the attribute instead. */
  function setSvgHidden(el, on){
    if (on) el.setAttribute('hidden', '');
    else el.removeAttribute('hidden');
  }

  function setRegion(name){
    if (name !== activeRegion && name !== 'all') trackEvent('kraj/' + name);
    activeRegion = name;
    regionsLayer.querySelectorAll('path.region').forEach(function(p){
      p.classList.toggle('selected', p.getAttribute('data-region') === name);
    });
    regionsLayer.classList.toggle('has-selection', name !== 'all');
    var outline = document.getElementById('regionOutline');
    var chosen = name === 'all' ? null : regionsLayer.querySelector('path[data-region="'+name+'"]');
    outline.setAttribute('d', chosen ? chosen.getAttribute('d') : '');
    setSvgHidden(outline, !chosen);
    focusLabels(name);
    renderRegionOptions();
    applyFilters();
    zoomToRegion(name);
  }

  function updateMapControls(){
    document.getElementById('zoomIn').disabled = view.s >= 6;
    document.getElementById('zoomOut').disabled = view.s <= 1;
    var filtered = activeCats.length > 0 || activeChannel !== 'all' || activeRegion !== 'all' ||
                   searchQuery || view.s > 1;
    document.getElementById('mapReset').hidden = !filtered;
  }

  document.getElementById('zoomIn').addEventListener('click', function(){ zoomBy(1.6); });
  document.getElementById('zoomOut').addEventListener('click', function(){ zoomBy(1 / 1.6); });

  function resetFilters(){
    activeCats = [];
    activeChannel = 'all';
    searchQuery = '';
    document.getElementById('searchInput').value = '';
    syncCatChips();
    channelDD.setOn(false);
    activeDelivery = 'all';
    onlyFavs = false;
    var fc = document.getElementById('favChip');
    fc.classList.remove('active');
    fc.setAttribute('aria-pressed','false');
    renderChannelOptions();
    renderDeliveryOptions();
    setRegion('all');
  }

  document.getElementById('mapReset').addEventListener('click', resetFilters);
  document.getElementById('clearFilters').addEventListener('click', resetFilters);

  /* Clicking the empty ground around Czechia is how you leave a region. */
  document.querySelector('.map-inner').addEventListener('click', function(e){
    if (e.target.closest('path.region') || e.target.closest('.pin') ||
        e.target.closest('.map-zoom') || e.target.closest('.map-reset')) return;
    if (activeRegion !== 'all' || view.s > 1) resetFilters();
  });

  /* Set by the drag handler below: a real drag ends with a click, and that
     click used to land on the region the drag had just chosen and toggle it
     straight back off. */
  var dragJustEnded = false;

  regionsLayer.addEventListener('click', function(e){
    if (dragJustEnded){ dragJustEnded = false; return; }
    var path = e.target.closest('path.region');
    if (!path) return;

    var name = path.getAttribute('data-region');
    setRegion(activeRegion === name ? 'all' : name);
  });

  /* Drag across the map to try regions on: whichever kraj is under the
     cursor previews as you go, and the one you release over is selected.
     Saves zooming back out to the whole country just to reach a neighbour.
     A plain click is untouched -- the preview only starts once the cursor
     has actually left the region it began in. */
  (function(){
    var dragFrom = null, dragOver = null, dragging = false;

    function regionAt(x, y){
      var el = document.elementFromPoint(x, y);
      var p = el && el.closest ? el.closest('path.region') : null;
      return (p && regionsLayer.contains(p)) ? p : null;
    }

    function clearPreview(){
      regionsLayer.querySelectorAll('path.region.drag-target').forEach(function(p){
        p.classList.remove('drag-target');
      });
    }

    function restoreOutline(){
      var outline = document.getElementById('regionOutline');
      var cur = activeRegion === 'all' ? null :
        regionsLayer.querySelector('path[data-region="' + activeRegion + '"]');
      outline.setAttribute('d', cur ? cur.getAttribute('d') : '');
      setSvgHidden(outline, !cur);
    }

    function preview(p){
      dragOver = p;
      clearPreview();
      if (!p){ restoreOutline(); return; }
      p.classList.add('drag-target');
      var outline = document.getElementById('regionOutline');
      outline.setAttribute('d', p.getAttribute('d'));
      setSvgHidden(outline, false);
    }

    /* What makes it a drag is that the pointer travelled, not that it
       happened to cross a border: a real drag ends with a click whose
       target can still be the region it started in, and that click used
       to toggle the selection straight back off. */
    var startX = 0, startY = 0, killClick = false;
    var DRAG_SLOP = 5;

    /* A drag ends with a click on whatever is under the pointer, which
       would re-toggle the region the drag just chose. Swallow that one
       click in the capture phase so the selecting handler never runs. */
    regionsLayer.addEventListener('click', function(e){
      if (!killClick) return;
      killClick = false;
      e.stopPropagation();
      e.preventDefault();
    }, true);

    regionsLayer.addEventListener('mousedown', function(e){
      killClick = false;
      if (e.button !== 0) return;
      dragFrom = regionAt(e.clientX, e.clientY);
      startX = e.clientX; startY = e.clientY;
      dragOver = null;
      dragging = false;
    });

    window.addEventListener('mousemove', function(e){
      if (!dragFrom) return;
      if (!dragging){
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if (dx * dx + dy * dy < DRAG_SLOP * DRAG_SLOP) return;
        dragging = true;
        mapStage.classList.add('region-dragging');
      }
      var p = regionAt(e.clientX, e.clientY);
      if (p !== dragOver) preview(p);
    });

    /* Touch: one finger is unused while the whole country is shown \u2014 pinch
       zooms and one-finger pan only kicks in once zoomed \u2014 so that is where
       dragging between kraje lives. Zoomed in, the finger still pans. */
    var touchDrag = false;

    regionsLayer.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1 || view.s > 1.01) return;
      var t = e.touches[0];
      dragFrom = regionAt(t.clientX, t.clientY);
      startX = t.clientX; startY = t.clientY;
      dragOver = null; dragging = false; killClick = false;
      touchDrag = !!dragFrom;
    }, { passive:true });

    window.addEventListener('touchmove', function(e){
      if (!touchDrag || !dragFrom || e.touches.length !== 1) return;
      var t = e.touches[0];
      if (!dragging){
        var dx = t.clientX - startX, dy = t.clientY - startY;
        if (dx * dx + dy * dy < DRAG_SLOP * DRAG_SLOP) return;
        dragging = true;
        mapStage.classList.add('region-dragging');
      }
      var p = regionAt(t.clientX, t.clientY);
      if (p !== dragOver) preview(p);
    }, { passive:true });

    function endTouchDrag(){
      if (touchDrag && dragging){
        var target = dragOver;
        mapStage.classList.remove('region-dragging');
        clearPreview();
        var name = target && target.getAttribute('data-region');
        killClick = true;
        if (name && name !== activeRegion) setRegion(name);
        else restoreOutline();
      }
      touchDrag = false; dragFrom = null; dragOver = null; dragging = false;
    }
    window.addEventListener('touchend', endTouchDrag);
    window.addEventListener('touchcancel', endTouchDrag);

    window.addEventListener('mouseup', function(){
      if (dragging){
        var target = dragOver;
        mapStage.classList.remove('region-dragging');
        clearPreview();
        var name = target && target.getAttribute('data-region');
        killClick = true;
        dragJustEnded = true;
        if (name && name !== activeRegion) setRegion(name);
        else restoreOutline();
      }
      dragFrom = null; dragOver = null; dragging = false;
    });
  })();

  /* ---- Drawer ---- */
  var drawer = document.getElementById('drawer');
  var scrim = document.getElementById('scrim');
  var drawerContent = document.getElementById('drawerContent');
  var currentId = null;

  /* Phone and e-mail are spelled out \u2014 in a farm directory the number itself is
     the useful part, not an icon you have to click to discover. */
  function contactRow(f){
    var lines = [];
    if (f.phone) lines.push('<a class="contact-line" href="tel:'+f.phone.replace(/\s+/g,'')+'">'+svgIcon(ICONS.phone)+'<span>'+f.phone+'</span></a>');
    if (f.email) lines.push('<a class="contact-line" href="mailto:'+f.email+'">'+svgIcon(ICONS.mail)+'<span>'+f.email+'</span></a>');

    var social = [];
    if (f.instagram) social.push('<a class="contact-btn" href="'+f.instagram+'" target="_blank" rel="noopener" aria-label="Instagram">'+svgIcon(ICONS.insta)+'</a>');
    if (f.facebook) social.push('<a class="contact-btn" href="'+f.facebook+'" target="_blank" rel="noopener" aria-label="Facebook">'+svgIconFilled(ICONS.facebook)+'</a>');

    if (!lines.length && !social.length) return '';
    return '<h3>'+t('contactLabel')+'</h3>' +
           (lines.length ? '<div class="d-contacts">'+lines.join('')+'</div>' : '') +
           (social.length ? '<div class="d-contact">'+social.join('')+'</div>' : '');

  function openFarm(id){
    var f = FARMS.filter(function(x){ return x.id === id; })[0];
    if (!f) return;
    trackEvent('farma/' + f.id, f.name);
    currentId = id;

    document.querySelectorAll('.pin').forEach(function(p){ p.classList.toggle('selected', p.dataset.id === id); });
    document.querySelectorAll('.farm-card').forEach(function(c){ c.classList.toggle('active', c.dataset.id === id); });

    var card = farmListEl.querySelector('.farm-card[data-id="'+id+'"]');

      return '<span class="d-cat-pill" style="background:'+CAT[c].color+'">'+CAT[c].label[LANG]+'</span>';
    }).join('');

    var storyHtml = f.story[LANG].map(function(s){ return '<li>'+s+'</li>'; }).join('');

    var actions = '';
    if (f.website) actions += '<a class="btn" href="'+f.website+'" target="_blank" rel="noopener">'+svgIcon(ICONS.globe)+t('website')+'</a>';
    var eshopBtn = f.eshop
      ? '<a class="btn primary d-buy" href="'+f.eshop+'" target="_blank" rel="noopener">'+svgIcon(ICONS.cart)+t('shop')+'</a>'
      : '';

    /* Where to buy: the farm gate always, then only channels that really exist \u2014
       the farm's own e-shop, verified marketplace pages, and any shop or pickup
       point the farm itself lists. */
    /* The farm's own e-shop sits at the end of this row as the one filled
       button, so the place to buy and the act of buying stay together. */
    var gateHtml = '<p class="d-fact">'+svgIcon(ICONS.pin)+
      '<span>'+(f.saleLabel ? f.saleLabel[LANG] : t('channelFarm'))+'</span></p>';
    var shopsHtml = '';
    if (f.shops) Object.keys(f.shops).forEach(function(k){
      shopsHtml += '<a class="shop-tag" href="'+f.shops[k]+'" target="_blank" rel="noopener">'+CHANNEL_NAME[k]+svgIcon(ICONS.external)+'</a>';
    });
    (f.sellers || []).forEach(function(s){
      shopsHtml += s.url
        ? '<a class="shop-tag" href="'+s.url+'" target="_blank" rel="noopener">'+s.name+svgIcon(ICONS.external)+'</a>'
        : '<span class="shop-tag plain">'+s.name+'</span>';
    });

/* Hours reach us as one free-text sentence per farm, and printing that sentence
   as-is turns the panel into a wall of bold. So each sentence is taken apart
   into the two things it actually mixes: timings, which belong on their own
   tabular line under the place they apply to, and remarks ("call ahead",
   "orders are collected at the farm"), which drop to a quiet note underneath. */
var HOURS_TIME = /\d{1,2}[:.]\d{2}|24\/7/;
var HOURS_LEAD = /(?:^|\s)(?:Pond\u011Bl\u00ED|\u00DAter\u00FD|St\u0159eda|\u010Ctvrtek|P\u00E1tek|Sobota|Ned\u011Ble|Po|\u00DAt|St|\u010Ct|P\u00E1|So|Ne|Mon|Tue|Wed|Thu|Fri|Sat|Sun)(?=[\s.,;\u2013\u2014-]|$)|(?:^|\s)\d{1,2}[:.]\d{2}|(?:^|\s)24\/7/;

/* An address can be put on the map; "every other week" cannot. Only labels that
   carry a number read as somewhere you could actually drive to. */
function hoursPlaceLink(label, f){
  if (!/\d/.test(label) || label.length > 60 || HOURS_TIME.test(label)) return '';
  return '<a class="d-hours-place" target="_blank" rel="noopener" href="' +
    'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(label + ', ' + f.town.cs.split(/[,\u2013\u2014-]/)[0].trim()) + '">' +
    '<span>'+label+'</span>'+svgIcon(ICONS.external)+'</a>';
}

function hoursParts(raw){
  var groups = [], notes = [];
  raw.split(/\s*;\s*|(?:\.\s+)(?=[A-Z\u00C1-\u017D])/).forEach(function(chunk){
    chunk.split(/\s+[\u2014\u2013-]\s+/).forEach(function(frag){
      frag = frag.replace(/[.\s]+$/, '').trim();
      if (!frag) return;
      if (!HOURS_TIME.test(frag)){ notes.push(frag); return; }

      var label = '', rest = frag, ci = frag.indexOf(': ');
      if (ci > -1 && !HOURS_TIME.test(frag.slice(0, ci))){
        label = frag.slice(0, ci).trim();
        rest  = frag.slice(ci + 2);
      } else {
        var at = frag.search(HOURS_LEAD);
        if (at > 0){
          label = frag.slice(0, at).trim().replace(/[,:]$/, '');
          label = label.charAt(0).toUpperCase() + label.slice(1);
          rest  = frag.slice(at).trim();
        }
      }

      var rows = [], carry = '';
      rest.split(/,\s*/).forEach(function(r){
        r = r.trim();
        if (!r) return;
        if (!HOURS_TIME.test(r)){ notes.push(r); return; }
        var lead = r.match(/^([^\d]*?)\s*(?=\d{1,2}[:.]\d{2}|24\/7)/);
        if (lead && lead[1]) carry = lead[1].trim();
        else if (carry) r = carry + ' ' + r;
        rows.push(r);
      });
      if (rows.length) groups.push({ label:label, rows:rows });
      else if (label) notes.push(label);
    });
  });
  return { groups:groups, notes:notes };
}

var hoursHtml = '';
if (f.hours){
  var parsed = hoursParts(f.hours[LANG]);
  var body = parsed.groups.map(function(g){
    var link = g.label ? hoursPlaceLink(g.label, f) : '';
    return '<div class="hours-group">' +
      (g.label ? (link || '<p class="hours-where">'+g.label+'</p>') : '') +
      '<ul class="d-hours-rows">' +
        g.rows.map(function(r){
          return '<li>' + r.replace(/\s*\(([^)]+)\)/g,
            ' <span class="hours-qual">($1)</span>') + '</li>';
        }).join('') +
      '</ul></div>';
  }).join('');
  var noteHtml = parsed.notes.length
    ? '<p class="hours-note">' +
      parsed.notes.map(function(n){ return n.charAt(0).toUpperCase() + n.slice(1); }).join('. ') +
      '.</p>'
    : '';
  if (!body && !noteHtml){
    noteHtml = '<p class="hours-note">'+f.hours[LANG]+'</p>';
  }
  hoursHtml = '<div class="d-hours">' +
    '<p class="d-hours-head">'+svgIcon(ICONS.clock)+'<span>'+t('hoursLabel')+'</span></p>' +
    body + noteHtml +
  '</div>';
}

/* Some farms do not keep shop hours at all - they open for a handful of dated
   pickup and delivery windows and announce them as they go. Those dates are
   stored on the farm and resolved against today every time the panel opens, so
   the visitor is told which one is actually next rather than reading a list and
   working it out. */
function ymd(str){
  var p = str.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}
function slotDate(d){
  return t('weekdays')[d.getDay()] + ' ' + d.getDate() + '. ' + (d.getMonth() + 1) + '.';
}
function slotRange(slot){
  var a = slotDate(ymd(slot.d));
  return slot.end ? a + ' \u2013 ' + slotDate(ymd(slot.end)) : a;
}
function slotLead(slot, today){
  var days = Math.round((ymd(slot.d) - today) / 86400000);
  if (days <= 0) return t('slotRunning');
  if (days === 1) return t('slotTomorrow');
  return t('slotInDays')(days);
}
function slotPlace(place){
  return '<a class="slot-place" target="_blank" rel="noopener" href="' +
    'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place) + '">' +
    svgIcon(ICONS.pin) + '<span>' + place + '</span>' + svgIcon(ICONS.external) + '</a>';
}
function slotMeta(kind){
  var bits = [];
  if (kind.when) bits.push(kind.when[LANG]);
  if (kind.price) bits.push(kind.price[LANG]);
  return bits.length ? '<p class="slot-meta">' + bits.join(' \u00B7 ') + '</p>' : '';
}
function scheduleHtml(f){
  var sc = f.schedule;
  if (!sc) return '';
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var open = (sc.slots || []).filter(function(sl){
    return ymd(sl.end || sl.d) >= today;
  });
  var srcLink = sc.src
    ? '<a class="slot-src" target="_blank" rel="noopener" href="'+sc.src+'">' +
      t('slotsSource') + svgIcon(ICONS.external) + '</a>'
    : '';

  var extras = (sc.extra || []).map(function(x){
    return '<li><span class="slot-rest-kind">'+x[LANG]+'</span>' + slotMeta(x) + '</li>';
  }).join('');
  var extraBlock = extras
    ? '<details class="slot-more"><summary>'+t('otherPickup')+'</summary>' +
      '<ul class="slot-rest">'+extras+'</ul></details>'
    : '';

  if (!open.length){
    return '<div class="d-slots stale"><p class="d-slots-head">'+svgIcon(ICONS.calendar)+
      '<span>'+t('nextSlot')+'</span></p><p class="slot-stale">'+t('slotsStale')+'</p>' +
      extraBlock + srcLink + '</div>';
  }

  var next = open[0], kind = sc.kinds[next.k] || {};
  var rest = open.slice(1).map(function(sl){
    var k = sc.kinds[sl.k] || {};
    return '<li><span class="slot-rest-date">'+slotRange(sl)+'</span>' +
           '<span class="slot-rest-kind">'+(k[LANG] || '')+'</span></li>';
  }).join('');

  return '<div class="d-slots">' +
    '<p class="d-slots-head">'+svgIcon(ICONS.calendar)+'<span>'+t('nextSlot')+'</span></p>' +
    '<p class="slot-next"><strong>'+slotRange(next)+'</strong>' +
      '<span class="slot-lead">'+slotLead(next, today)+'</span></p>' +
    '<p class="slot-kind">'+(kind[LANG] || '')+'</p>' +
    slotMeta(kind) +
    (kind.place ? slotPlace(kind.place) : '') +
    (rest ? '<details class="slot-more"><summary>'+t('moreSlots')(open.length - 1)+'</summary>' +
            '<ul class="slot-rest">'+rest+'</ul></details>' : '') +
    extraBlock +
    srcLink +
  '</div>';
}

/* Bedynky, a vending machine or a CSA share are ways of buying, not buttons -
   they read as a sentence about how this farm sells, next to the hours. */
var BUY_WAYS = ['bedynky','samosber','kpz','automat','mobile'];
var buyWays = (f.offers || []).filter(function(o){ return BUY_WAYS.indexOf(o) !== -1; });
var farmExtras = (f.offers || []).filter(function(o){ return BUY_WAYS.indexOf(o) === -1; });
function offerLine(label, list, icon){
  if (!list.length) return '';
  return '<p class="d-fact d-fact-sub">'+svgIcon(icon)+
         '<span><strong>'+label+':</strong> '+
         list.map(function(o){ return t('offerNames')[o]; }).join(', ')+'</span></p>';
}
var offersHtml = offerLine(t('waysToBuy'), buyWays, ICONS.cart) +
                 offerLine(t('alsoOnFarm'), farmExtras, ICONS.store) +
                 ((f.delivery || []).length
                   ? '<p class="d-fact d-fact-sub">'+svgIcon(ICONS.truck)+
                     '<span><strong>'+t('deliveryLabel')+':</strong> '+
                     f.delivery.map(function(d){ return t('deliveryNames')[d]; }).join(', ')+'</span></p>'
                   : '');

    var awardsHtml = (f.awards && f.awards.length)
      ? '<div class="d-awards">' + f.awards.map(function(a){
          return '<span class="award-badge">'+svgIconFilled(ICONS.award)+a[LANG]+'</span>';
        }).join('') + '</div>'
      : '';

    /* Only certification is stated. Not holding one says nothing about a
       farm, so nothing is shown for it. */
    var certHtml = f.cert === 'bio'
      ? '<span class="cert-pill cert-bio">'+svgIcon(ICONS.leaf)+
        '<span>'+t('certNames').bio+'</span></span>'
      : '';
    /* Regenerative practice is a separate claim from organic certification:
       a farm can carry one, the other, or both. */
    if (f.regen) certHtml += '<span class="cert-pill cert-regen">'+svgIcon(ICONS.sprout)+
      '<span>'+t('certNames').regen+'</span></span>';

    drawerContent.innerHTML =
      '<div class="d-cats">'+catsHtml+certHtml+'</div>' +
      '<h2>'+f.name+'</h2>' +
      '<a class="d-loc" href="https://www.google.com/maps/search/?api=1&query='+
        encodeURIComponent(f.name + ', ' + f.town.cs)+'" target="_blank" rel="noopener">' +
        svgIcon(ICONS.pin)+'<span>'+f.town[LANG]+', '+f.region[LANG]+'</span>'+svgIcon(ICONS.external)+'</a>' +
      awardsHtml +
      '<h3>'+t('story')+'</h3>' +
      '<ul class="d-story">'+storyHtml+'</ul>' +
      '<h3>'+t('whereToBuy')+'</h3>' +
      ((shopsHtml || eshopBtn) ? '<div class="d-shops">'+eshopBtn+shopsHtml+'</div>' : '') +
      (f.shipNote ? '<p class="ship-note">'+f.shipNote[LANG]+'</p>' : '') +
      gateHtml +
      scheduleHtml(f) +
      hoursHtml +
      offersHtml +
      '<div class="d-actions">'+actions+'</div>' +
      contactRow(f);

    syncDrawerFav(f.id);
    syncDrawerShare(f.id);
    fitDrawerCats();
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden','false');
    scrim.classList.add('show');
  }

  /* The share/save/close buttons float over the top-right corner of the card,
     where they were landing on top of the category chips. How much room they
     need depends on the pointer type and the language, so measure it. */
  function fitDrawerCats(){
    var cats = drawerContent.querySelector('.d-cats');
    var tools = document.querySelector('.drawer-tools');
    if (!cats || !tools) return;
    var btns = tools.querySelectorAll('.drawer-tool');
    if (!btns.length) return;
    var w = tools.getBoundingClientRect().right - btns[0].getBoundingClientRect().left;
    if (w > 0) cats.style.paddingRight = Math.round(w + 10) + 'px';
  }
  window.addEventListener('resize', fitDrawerCats);
  (function(){
    var wide = window.matchMedia('(max-width:600px)').matches;
    window.addEventListener('resize', function(){
      var now = window.matchMedia('(max-width:600px)').matches;
      if (now !== wide){ wide = now; applyStaticText(); }

  /* Swipe it away. Dragging the handle always works; dragging the body works
     too, but only while the sheet is scrolled to its top - otherwise the
     gesture is someone trying to scroll the filters, not dismiss them. */
  (function filtersDrag(){
    var grab = document.querySelector('.filters-grab');
    var y0 = 0, dy = 0, dragging = false, moved = false;

    function begin(e, fromHandle){
      if (!phoneFilters() || !filtersPanel.classList.contains('open')) return;
      if (e.touches.length !== 1) return;
      if (!fromHandle && filtersPanel.scrollTop > 0) return;
      dragging = true; moved = false; dy = 0;
      y0 = e.touches[0].clientY;
      filtersPanel.style.transition = 'none';
    }
    function move(e){
      if (!dragging) return;
      dy = e.touches[0].clientY - y0;
      if (dy < 0) dy = 0;                /* it is already as open as it gets */
      if (dy > 3){ moved = true; e.preventDefault(); }
      filtersPanel.style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
    }
    function end(){
      if (!dragging) return;
      dragging = false;
      filtersPanel.style.transition = '';
      filtersPanel.style.transform = '';
      if (!moved) return;                /* a tap - the click handler has it */
      if (dy > 70 || dy > filtersPanel.offsetHeight * 0.3) closeFilters();
    }

    grab.addEventListener('touchstart', function(e){ begin(e, true); }, { passive:true });
    filtersPanel.addEventListener('touchstart', function(e){
      if (e.target.closest('.filters-grab')) return;
      begin(e, false);
    }, { passive:true });
    filtersPanel.addEventListener('touchmove', move, { passive:false });
    filtersPanel.addEventListener('touchend', end);
    filtersPanel.addEventListener('touchcancel', end);

    /* A tap on the handle still closes it. */
    grab.addEventListener('click', function(){ if (!moved) closeFilters(); moved = false; });
  })();

  window.addEventListener('resize', function(){

     rather than a panel that slides in from the left: portrait leaves ~500px
     of dead space below the country, and browsing 91 farms should not mean
     aiming at a clump of pins. Wider than that it stays the side drawer. */
  function phoneSheet(){ return window.matchMedia('(max-width:600px)').matches; }

  function setSheetOpen(on){
    mobileListDrawer.classList.toggle('open', on);
    sheetGrab.setAttribute('aria-expanded', on ? 'true' : 'false');
    /* Peeking, the sheet is on screen and readable, so it must not be hidden
       from assistive tech the way the off-canvas side drawer is. */
    mobileListDrawer.setAttribute('aria-hidden', on ? 'false' : 'true');
  }
  function openMobileList(){
    setSheetOpen(true);

  function closeMobileList(){
    setSheetOpen(false);
    if (!drawer.classList.contains('open')) scrim.classList.remove('show');

  setSheetOpen(false);
  window.addEventListener('resize', function(){
    setSheetOpen(mobileListDrawer.classList.contains('open'));
  });

  /* Drag the bar to open or collapse, or just tap it. */
  (function sheetDrag(){
    var y0 = 0, dy = 0, dragging = false, wasOpen = false, moved = false;
    /* No peek any more: closed is a full slide off the bottom. */
    function travel(){ return mobileListDrawer.offsetHeight; }
    sheetGrab.addEventListener('touchstart', function(e){
      if (!phoneSheet() || e.touches.length !== 1) return;
      dragging = true; moved = false; dy = 0;
      y0 = e.touches[0].clientY;
      wasOpen = mobileListDrawer.classList.contains('open');
      mobileListDrawer.style.transition = 'none';
    }, { passive:true });
    sheetGrab.addEventListener('touchmove', function(e){
      if (!dragging) return;
      dy = e.touches[0].clientY - y0;
      if (Math.abs(dy) > 4) moved = true;
      var t = travel();
      mobileListDrawer.style.transform =
        'translateY(' + Math.max(0, Math.min((wasOpen ? 0 : t) + dy, t)) + 'px)';
      e.preventDefault();
    }, { passive:false });
    function end(){
      if (!dragging) return;
      dragging = false;
      mobileListDrawer.style.transition = '';
      mobileListDrawer.style.transform = '';
      if (!moved) return;                 /* a tap - the click handler has it */
      setSheetOpen(wasOpen && dy < 60);
      syncSheetScrim();
    }
    sheetGrab.addEventListener('touchend', end);
    sheetGrab.addEventListener('touchcancel', end);
    /* The handle is reachable only while the sheet is open, so a tap on it
       can only mean "put it away". */
    sheetGrab.addEventListener('click', function(){
      if (!phoneSheet()) return;
      if (moved){ moved = false; return; }
      closeMobileList();
    });
  })();

  function syncSheetScrim(){
    if (mobileListDrawer.classList.contains('open')) scrim.classList.add('show');

/* ---- Search suggestions: farms by name or product, plus any Czech town ---- */
var suggestBox = document.getElementById('searchSuggest');

function showSuggestions(q){
  var fq = fold(q.trim());
  if (fq.length < 2){ hideSuggestions(); return; }

  var farmHits = FARMS.filter(function(f){ return farmHaystack(f).indexOf(fq) !== -1; }).slice(0, 5);
  var placeHits = gazetteer().filter(function(p){ return p.fold.indexOf(fq) === 0; });
  if (placeHits.length < 6){
    var more = gazetteer().filter(function(p){ return p.fold.indexOf(fq) > 0; });
    placeHits = placeHits.concat(more);
  }
  placeHits = placeHits.slice(0, 6);

  /* A search that finds nothing says which places the map is still missing.
     Debounced so a half-typed word doesn't get counted as a miss. */
  clearTimeout(window._missTimer);
  if (!farmHits.length && !placeHits.length){
    var missed = q.trim();
    window._missTimer = setTimeout(function(){ trackEvent('hledani-bez-vysledku', missed); }, 1200);
    hideSuggestions(); return;
  }

  var html = '';
  if (farmHits.length){
    html += '<div class="suggest-group">'+t('farmsGroup')+'</div>';
    farmHits.forEach(function(f){
      html += '<button type="button" class="suggest-item" role="option" data-farm="'+f.id+'">' +
              svgIcon(ICONS.pin)+'<span>'+f.name+'</span>' +
              '<span class="sub">'+f.town[LANG]+'</span></button>';
    });
  }
  if (placeHits.length){
    html += '<div class="suggest-group">'+t('placesGroup')+'</div>';
    placeHits.forEach(function(p, i){
      html += '<button type="button" class="suggest-item" role="option" data-place="'+i+'">' +
              svgIcon(ICONS.town)+'<span>'+p.name+'</span>' +
              '<span class="sub">'+p.okres+'</span></button>';
    });
  }
  suggestBox.innerHTML = html;
  suggestBox._places = placeHits;
  suggestBox.hidden = false;
  searchEl.setAttribute('aria-expanded', 'true');
  fitSuggest();
}

/* A dropdown measured in vh runs straight under the on-screen keyboard -
   you get the top half of the list and nothing else, with no way to scroll
   to the rest. Only visualViewport reports what is actually on screen once
   the keyboard is up, so the panel is measured against that instead. */
function fitSuggest(){
  if (!suggestBox || suggestBox.hidden) return;
  var vv = window.visualViewport;
  if (!vv) return;
  var below = (vv.offsetTop + vv.height) - searchEl.getBoundingClientRect().bottom - 16;
  /* Never taller than the design cap - this is here to SHRINK the panel
     when the keyboard is up, not to let it grow on a tall desktop window. */
  suggestBox.style.maxHeight = Math.max(132, Math.min(Math.round(below), 340)) + 'px';
}

/* iOS measures vh against the layout viewport, which includes the strip
   behind the browser chrome and the whole keyboard. Everything that has to
   fit on screen reads these instead. */
(function viewportFit(){
  var vv = window.visualViewport;
  if (!vv) return;
  function apply(){
    var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', Math.round(kb) + 'px');
    fitSuggest();
    if (typeof window.__repositionMap === 'function') window.__repositionMap();
  }
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
  window.addEventListener('orientationchange', function(){ setTimeout(apply, 120); });
  apply();
})();

function hideSuggestions(){
  suggestBox.hidden = true;
  suggestBox.style.maxHeight = '';
  searchEl.setAttribute('aria-expanded', 'false');
}

/* Picking a town answers "what is near here?" - it becomes the reference
   point for the proximity filter and the map flies to it. */
function krajOfOkres(okres){
  var i = OKRESY.indexOf(okres);
  return i === -1 ? null : (OKRES_KRAJ[i] || null);
}

function goToPlace(p){
  searchEl.value = '';
  searchQuery = '';
  hideSuggestions();
  /* Someone typing a town wants the farms around it, so the region that town
     belongs to becomes the filter and the whole kraj fills the map. */
  var kraj = krajOfOkres(p.okres);
  if (kraj){
    setRegion(kraj);
    showToast(t('townRegion')(p.name, kraj));
  } else {
    showToast(t('nearPlace')(p.name, p.okres));
  }

  /* setRegion already framed the whole kraj. Only when the town sits in no
     region we know do we fall back to flying to the town itself. */
  if (!kraj){
    view.fx = ((p.lon - PROJ.minlon) * PROJ.cosLat * PROJ.scale + PROJ.margin) / VB_W;
    view.fy = ((PROJ.maxlat - p.lat) * PROJ.scale + PROJ.margin) / VB_H;
    view.s = 3;
    applyView();
  }
}

  8:{veg:[["rajce","f"],["paprika","f"],["cuketa","f"],["okurka","f"],["lilek","f"],["fazolky","f"],["kukurice","f"],["mrkev","f"],["brambory","f"],["cibule","f"],["zeli","f"],["dyne","f"]], fruit:[["svestky","f"],["mirabelky","f"],["broskve","f"],["jablka","f"],["hrusky","f"],["ostruziny","f"],["maliny","f"],["boruvky","f"],["bezinky","f"]], herbs:[["bazalka","f"],["oregano","f"],["tymian","f"],["saturejka","f"],["mata","f"],["salvej","f"]]},
  9:{veg:[["dyne","f"],["zeli","f"],["kapusta","f"],["porek","f"],["mrkev","f"],["repa","f"],["celer","f"],["brambory","f"],["rajce","f"],["paprika","f"],["brokolice","f"]], fruit:[["jablka","f"],["hrusky","f"],["svestky","f"],["ryngle","f"],["hrozny","f"],["bezinky","f"],["orechy","f"],["kdoule","f"]], herbs:[["petrzelovanat","f"],["pazitka","f"],["tymian","f"],["salvej","f"],["mata","f"],["libecek","f"]]},
  10:{veg:[["dyne","f"],["zeli","f"],["kapusta","f"],["ruzickova","f"],["porek","f"],["mrkev","f"],["celer","f"],["petrzel","f"],["pastinak","f"],["repa","f"],["brambory","f"],["kren","f"],["polnicek","f"],["cernykoren","f"]], fruit:[["jablka","f"],["hrusky","f"],["kdoule","f"],["orechy","f"],["hrozny","f"],["sipky","f"],["trnky","f"],["kastany","f"]], herbs:[["petrzelovanat","f"],["pazitka","f"],["tymian","f"],["salvej","f"],["rozmaryn","f"]]},
  11:{veg:[["ruzickova","f"],["kaderavek","f"],["porek","f"],["polnicek","f"],["kren","f"],["mrkev","s"],["celer","s"],["zeli","s"],["brambory","s"],["cibule","s"],["dyne","s"]], fruit:[["kdoule","f"],["trnky","f"],["sipky","f"],["jablka","s"],["hrusky","s"],["orechy","s"]], herbs:[["tymian","f"],["rozmaryn","f"],["petrzelovanat","f"]]},
  12:{veg:[["ruzickova","f"],["kaderavek","f"],["porek","f"],["polnicek","f"],["mrkev","s"],["celer","s"],["zeli","s"],["brambory","s"],["cibule","s"],["dyne","s"],["kren","s"]], fruit:[["jablka","s"],["hrusky","s"],["orechy","s"]], herbs:[["tymian","f"]]},
};

  /* The card renders whatever month is selected; it opens on the real one and
     the arrows step a month either way, which is how you find out whether to
     wait a fortnight for the asparagus. */
  var MONTH_NAMES = {
    cs:["Leden","\u00DAnor","B\u0159ezen","Duben","Kv\u011Bten","\u010Cerven",
        "\u010Cervenec","Srpen","Z\u00E1\u0159\u00ED","\u0158\u00EDjen","Listopad","Prosinec"],
    en:["January","February","March","April","May","June",
        "July","August","September","October","November","December"]
  };
  var seasonModal = document.getElementById('seasonModal');
  var seasonScrim = document.getElementById('seasonScrim');
  var seasonNow = new Date().getMonth() + 1;
  var seasonShown = seasonNow;

  function seasonName(m){ return MONTH_NAMES[LANG][(m + 11) % 12]; }

  /* Fresh first, then the quieter states. The "ze skladu" heading only earns
     its place in a month that actually mixes them - in October everything is
     picked now and the group stays a single clean block. */
  var STATE_LABEL = { f:'legFresh', s:'legStored', g:'legGlass' };
  function seasonChips(list){
    var byState = { f:[], s:[], g:[] };
    list.forEach(function(e){ (byState[e[1]] || byState.f).push(SEASON_ITEMS[e[0]][LANG]); });
    var mixed = ['f','s','g'].filter(function(k){ return byState[k].length; }).length > 1;
    return ['f','s','g'].map(function(k){
      var names = byState[k];
      if (!names.length) return '';
      return (mixed ? '<em class="season-sub">' + t(STATE_LABEL[k]) + '</em>' : '') +
        '<div class="season-chips">' + names.map(function(n){
          return '<span class="season-chip ' + k + '">' + n + '</span>';
        }).join('') + '</div>';
    }).join('');
  }

  function renderSeason(){
    if (!seasonModal) return;
    var d = SEASON[seasonShown];
    /* The pill always names the real month; only the panel follows the
       arrows, so the corner never lies about what is in season today. */
    document.getElementById('seasonMonth').textContent = seasonName(seasonNow);
    document.getElementById('seasonKicker').textContent = t('seasonNowLead');
    /* Opened on today it answers the question; stepped away it becomes an
       ordinary month view and says so. */
    var isNow = seasonShown === seasonNow;
    document.getElementById('seasonTitle').textContent =
      isNow ? t('seasonNowTitle') : seasonName(seasonShown);
    document.getElementById('seasonKickerM').textContent =
      isNow ? seasonName(seasonNow) : t('seasonOther');
    var groups = [['veg','seasonVeg'],['fruit','seasonFruit'],['herbs','seasonHerbs']];
    document.getElementById('seasonGroups').innerHTML = groups.map(function(g){
      if (!d[g[0]] || !d[g[0]].length) return '';
      return '<div class="season-group ' + g[0] + '"><h4>' + t(g[1]) + '</h4>' +
             seasonChips(d[g[0]]) + '</div>';
    }).join('');
    document.getElementById('seasonNote').textContent = t('seasonNote');
    var n = FARMS.filter(function(f){ return f.cats.indexOf('veggies') !== -1; }).length;
    document.getElementById('seasonLink').textContent = t('seasonLink')(n);
    document.getElementById('seasonPrev').textContent = '\u2039 ' + seasonName(seasonShown - 1);
    document.getElementById('seasonNext').textContent = seasonName(seasonShown + 1) + ' \u203A';
    var today = document.getElementById('seasonToday');
    today.hidden = seasonShown === seasonNow;
    today.textContent = t('seasonToday');
  }

  function openSeason(){
    seasonShown = seasonNow;          /* always opens on the real month */
    renderSeason();
    seasonScrim.hidden = false;
    seasonModal.hidden = false;
    document.getElementById('seasonClose').focus();
  }
  function closeSeason(){
    seasonModal.hidden = true;
    seasonScrim.hidden = true;
    document.getElementById('seasonOpen').focus();
  }

  if (seasonModal){
    document.getElementById('seasonOpen').addEventListener('click', openSeason);
    document.getElementById('seasonClose').addEventListener('click', closeSeason);
    seasonScrim.addEventListener('click', closeSeason);
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && !seasonModal.hidden) closeSeason();
    });
    document.getElementById('seasonPrev').addEventListener('click', function(){
      seasonShown = seasonShown === 1 ? 12 : seasonShown - 1; renderSeason();
    });
    document.getElementById('seasonNext').addEventListener('click', function(){
      seasonShown = seasonShown === 12 ? 1 : seasonShown + 1; renderSeason();
    });
    document.getElementById('seasonToday').addEventListener('click', function(){
      seasonShown = seasonNow; renderSeason();
    });
    /* The panel is a pointer to the map, not a catalogue: it hands you the
       farms that sell any of this. The records carry no crop-level detail,
       so it filters to the category and says nothing more specific. */
    document.getElementById('seasonLink').addEventListener('click', function(){
      var chip = document.querySelector('.chip[data-cat="veggies"]');
      if (chip && !chip.classList.contains('active')) chip.click();
      closeSeason();
    });
  }

  function applyStaticText(){
    document.documentElement.lang = LANG;
    document.getElementById('txtTitle').textContent = t('title');
    document.getElementById('txtTagline').textContent = t('tagline');
    document.getElementById('txtTaglineM').textContent = t('tagline');
    document.getElementById('txtListToggle').textContent = t('listToggle');
    document.getElementById('txtFootnote').textContent = t('footnote');
    if (document.querySelector('[data-rec-open]')) recLabels();
    document.getElementById('searchInput').placeholder = t('searchPlaceholder');
    renderSeason();
    document.querySelectorAll('.list-filter-input').forEach(function(inp){
      inp.placeholder = t('listFilter');
      inp.setAttribute('aria-label', t('listFilter'));
    });
    document.getElementById('filterBar').setAttribute('aria-label', t('filterAria'));
    document.querySelector('.chip[data-cat="all"] .chip-label').textContent = t('chipAll');
    document.getElementById('txtListHeading').textContent = t('listHeading');
    document.getElementById('txtFavChip').textContent = t('favChip');
    document.getElementById('txtClear').textContent = t('clearFilters');
    document.getElementById('txtFiltersBtn').textContent = t('filtersBtn');
    document.getElementById('filtersDone').textContent = t('filtersDone');
    document.getElementById('txtMapReset').textContent = t('mapReset');
    /* On a 375px screen "Zelenina a plodiny \u00B7 36" is a third of the row, so
       only two categories were ever visible and the rest lived behind a
       sideways scroll nobody discovers. The short names fit five. */
    var narrow = window.matchMedia('(max-width:600px)').matches;
    Object.keys(CAT).forEach(function(c){
      var el = document.querySelector('.chip[data-cat="'+c+'"] .chip-label');
      if (!el) return;
      var short = CAT[c].short;
      el.textContent = (narrow && short ? short : CAT[c].label)[LANG];
    });
    document.querySelectorAll('#langSwitch button').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === LANG);
    });
    document.querySelectorAll('#regionsLayer path.region').forEach(function(p){
      var cs = p.getAttribute('data-region');
      var entry = REGION_LIST.filter(function(r){ return r.cs === cs; })[0];
      var title = p.querySelector('title');
      if (title) title.textContent = entry ? entry[LANG] : cs;
    });
  }

  function setLang(lang){
    if (lang !== 'cs' && lang !== 'en') return;
    LANG = lang;
    try { localStorage.setItem('cfa_lang', LANG); } catch(e){}
    applyStaticText();
    renderChannelOptions();
    renderRegionOptions();
    renderFarmLists();
    if (currentId) openFarm(currentId);
  }

  document.getElementById('langSwitch').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-lang]');
    if (btn) setLang(btn.dataset.lang);
  });

  renderChipIcons();
  applyStaticText();
  renderChannelOptions();
  renderDeliveryOptions();
  renderRegionOptions();
  renderFarmLists();
  updatePinScale();

  /* A shared link lands on its farm. The parameter is dropped from the bar
     afterwards so a reload doesn't reopen the card unexpectedly. */
  (function openSharedFarm(){
    var m = /[?&]farma=([^&]+)/.exec(location.search);
    if (!m) return;
    var id = decodeURIComponent(m[1]);
    if (!FARMS.some(function(f){ return f.id === id; })) return;
    setTimeout(function(){
      openFarm(id);
      try { history.replaceState(null, '', location.pathname); } catch(e){}
    }, 150);
  })();

/* ---- Recommend a farm ----------------------------------------------------
   The address tips are sent to. Joined at runtime rather than written out
   whole, because this page is public and a plain address in the markup is the
   first thing an address harvester picks up. Nothing is posted to a server
   from here - the visitor sends the mail from their own client. */
var SUGGEST_TO = ["ahoj", "zivefarmy.cz"].join("@");

/* Paste the endpoint from the form service here and the box posts the tip
   straight through - no mail client opens. Left empty it falls back to
   mailto so the form is never a dead end. Note the POST only works on the
   real site: the artifact preview blocks requests to outside hosts. */
var SUGGEST_ENDPOINT = "https://formsubmit.co/ajax/" + SUGGEST_TO;

var recPanel = document.getElementById('recPanel');
var recScrim = document.getElementById('recScrim');

function recLabels(){
  document.querySelectorAll('[data-rec-open]').forEach(function(b){
    var tgt = b.querySelector('[data-rec-label]') || b;
    tgt.textContent = t(b.getAttribute('data-rec-open') === 'short' ? 'recOpenShort' : 'recOpen');
  });
  document.getElementById('recTitle').textContent  = t('recTitle');
  document.getElementById('recLead').textContent   = t('recLead');
  document.getElementById('recLName').textContent  = t('recName');
  document.getElementById('recLWeb').textContent   = t('recWeb');
  document.getElementById('recLNote').textContent  = t('recNote');
  document.getElementById('recSend').textContent   = t(SUGGEST_ENDPOINT ? 'recSendPost' : 'recSend');
  var recHintEl = document.getElementById('recHint');
  recHintEl.textContent = t('recHint');
  recHintEl.hidden = !!SUGGEST_ENDPOINT;
  document.getElementById('recMailLead').textContent = t('recMailLead');
  var a = document.getElementById('recMailTo');
  a.textContent = SUGGEST_TO;
  a.href = 'mailto:' + SUGGEST_TO + '?subject=' + encodeURIComponent(t('recTitle'));
}

function recText(){
  var v = function(id){ return document.getElementById(id).value.trim(); };
  return [t('recName') + ': ' + v('recName'),
          t('recWeb') + ': ' + v('recWeb'),
          t('recNote') + ': ' + v('recNote')].join('\n');
}

function openRec(){
  recLabels();
  recScrim.hidden = false;
  recPanel.hidden = false;
  document.getElementById('recName').focus();
}
function closeRec(){ recPanel.hidden = true; recScrim.hidden = true; }

document.querySelectorAll('[data-rec-open]').forEach(function(b){ b.addEventListener('click', openRec); });
document.getElementById('recClose').addEventListener('click', closeRec);
recScrim.addEventListener('click', closeRec);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !recPanel.hidden) closeRec();
});

var recSending = false;
document.getElementById('recSend').addEventListener('click', function(){
  if (recSending) return;
  var val = function(id){ return document.getElementById(id).value.trim(); };
  if (!val('recName')){ showToast(t('recNeedName')); return; }
  /* Anything that filled the hidden field is a bot. Act sent, send nothing. */
  if (val('recTrap')){ closeRec(); showToast(t('recSent')); return; }

  if (!SUGGEST_ENDPOINT){
    window.location.href = 'mailto:' + SUGGEST_TO +
      '?subject=' + encodeURIComponent(t('recTitle')) +
      '&body=' + encodeURIComponent(recText());
    closeRec();
    return;
  }

  var btn = this;
  recSending = true;
  btn.disabled = true;
  btn.textContent = t('recSending');
  fetch(SUGGEST_ENDPOINT, {
    method: 'POST',
    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
    body: JSON.stringify({
      _subject: t('recTitle') + ': ' + val('recName'),
      _captcha: 'false',
      _template: 'table',
      farma: val('recName'),
      web: val('recWeb'),
      poznamka: val('recNote'),
      jazyk: LANG
    })
  }).then(function(r){
    if (!r.ok) throw new Error(r.status);
    ['recName','recWeb','recNote'].forEach(function(id){ document.getElementById(id).value = ''; });
    closeRec();
    showToast(t('recSent'));
  }).catch(function(){
    /* The address is sitting in the open under the form, so say so rather
       than hijacking them into a mail client they did not ask for. */
    showToast(t('recFailed'));
  }).then(function(){
    recSending = false;
    btn.disabled = false;
    btn.textContent = t(SUGGEST_ENDPOINT ? 'recSendPost' : 'recSend');
  });
});

recLabels();

})();
</script>
