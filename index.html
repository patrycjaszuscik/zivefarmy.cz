<body>

<style>
  :root{
    --bg:#F6F0E1;
    --surface:#FFFDF7;
    --surface-2:#EFE2C6;
    --surface-3:#E6D4AE;
    --text:#332619;
    --text-soft:#7C6A50;
    --border:#DECBA3;
    --pasture-fill:#DCE3C2;
    --pasture-fill-hover:#CCDAA9;
    --pasture-fill-active:#BCD3A2;
    --pasture-fill-muted:#EAF0DF;
    --pasture-stroke:#96AC76;
    --river:#6E9BBF;
    --accent:#B2552A;
    --pin-fill:#B2552A;
    --accent-ink:#FFFFFF;
    --meat:#B2552A;
    --dairy:#5C7C8B;
    --eggs:#C38A30;
    --veg:#5B7A3A;
    --honey:#8A5A16;
    --shadow:rgba(51,38,25,0.16);
    --scrim:rgba(35,26,16,0.45);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:22px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E170F;
      --surface:#282015;
      --surface-2:#302719;
      --surface-3:#3A2F1E;
      --text:#EFE4CE;
      --text-soft:#B8A47E;
      --border:#48391F;
      --pasture-fill:#39452A;
      --pasture-fill-hover:#44512F;
      --pasture-fill-active:#4E6B3E;
      --pasture-fill-muted:#333B27;
      --pasture-stroke:#7C8B5980;
      --river:#5F8FB4;
      --accent:#D97B45;
      --pin-fill:#D97B45;
      --accent-ink:#241505;
      --meat:#D97B45;
      --dairy:#8FB0BE;
      --eggs:#D9AA51;
      --veg:#8CAE6C;
      --honey:#C89246;
      --shadow:rgba(0,0,0,0.45);
      --scrim:rgba(8,6,3,0.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E170F;
    --surface:#282015;
    --surface-2:#302719;
    --surface-3:#3A2F1E;
    --text:#EFE4CE;
    --text-soft:#B8A47E;
    --border:#48391F;
    --pasture-fill:#39452A;
    --pasture-fill-hover:#44512F;
    --pasture-fill-active:#4E6B3E;
    --pasture-fill-muted:#333B27;
    --pasture-stroke:#7C8B5980;
    --river:#5F8FB4;
    --accent:#D97B45;
    --pin-fill:#D97B45;
    --accent-ink:#241505;
    --meat:#D97B45;
    --dairy:#8FB0BE;
    --eggs:#D9AA51;
    --veg:#8CAE6C;
    --honey:#C89246;
    --shadow:rgba(0,0,0,0.45);
    --scrim:rgba(8,6,3,0.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  /* A panel hanging past the right edge used to make the whole page
     horizontally scrollable, and once Safari had scrolled sideways every
     fixed panel - the farm card included - looked cut off. */
  html,body{margin:0;padding:0;overflow-x:clip;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Lora","Iowan Old Style",Georgia,serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }
  button{font-family:inherit;}
  a{color:var(--accent);}
  svg.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  svg.icon-filled{fill:currentColor;stroke:none;}

  .app{
    height:100vh;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 22px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(145deg,var(--veg),var(--dairy));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    color:#fff;
    box-shadow:0 3px 8px var(--shadow);
  }
  .brand-mark svg{width:22px;height:22px;stroke:#fff;}
  .brand h1{font-size:1.28rem;line-height:1.1;letter-spacing:-0.01em;}
  .tagline{margin:2px 0 0;font-size:0.82rem;color:var(--text-soft);}
  /* The phone copy of the subtitle: it needs to be a child of the header row
     to take a full-width line of its own, so there are two and the phone
     breakpoint swaps which one shows. */
  .tagline-m{display:none;}

  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .lang-switch{
    display:flex;border:1px solid var(--border);border-radius:999px;
    padding:3px;background:var(--surface-2);gap:2px;
  }
  .lang-switch button{
    border:none;background:none;color:var(--text-soft);
    font-size:0.78rem;font-weight:700;letter-spacing:0.03em;
    padding:5px 11px;border-radius:999px;cursor:pointer;
  }
  .lang-switch button.active{background:var(--accent);color:var(--accent-ink);}
  .search{position:relative;}
  .search > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-soft);width:16px;height:16px;}
  .search input{
    width:230px;max-width:48vw;
    padding:9px 12px 9px 34px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:0.88rem;
  }
  .search input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search input::placeholder{color:var(--text-soft);}

  .icon-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:0.86rem;font-weight:500;
    cursor:pointer;
  }
  .icon-btn:hover{background:var(--surface-3);}
  .icon-btn svg{width:16px;height:16px;}
  #listToggle{display:inline-flex;}
  #listToggle.on{background:var(--accent);border-color:transparent;color:var(--accent-ink);}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .fav-toggle{position:relative;padding:9px 11px;}
  .fav-toggle .dot.cat-icon{width:18px;height:18px;color:var(--text-soft);}
  .fav-toggle .dot.cat-icon svg{width:18px;height:18px;}
  .fav-toggle.active{background:var(--accent);border-color:transparent;}
  .fav-toggle.active .dot.cat-icon{color:#fff;}
  .fav-toggle .chip-count{
    position:absolute;top:-3px;right:-3px;
    min-width:17px;height:17px;padding:0 4px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:var(--accent-ink);
    font-size:0.66rem;font-weight:700;opacity:1;
  }
  .fav-toggle .chip-count:empty{display:none;}

  /* ---------- Filters ---------- */
  .filters{
    display:flex;align-items:center;
    padding:12px 22px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  /* Only the chips scroll; the clear button keeps its place beside them. */
  .filters-scroll{
    display:flex;gap:8px;align-items:center;
    flex:1;min-width:0;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .filters-scroll::-webkit-scrollbar{height:6px;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:0.85rem;font-weight:500;
    cursor:pointer;white-space:nowrap;flex-shrink:0;
    transition:transform .12s ease;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cat,var(--text-soft));flex-shrink:0;}
  .chip .dot.cat-icon{width:17px;height:17px;background:none;border-radius:0;color:var(--cat);display:inline-flex;align-items:center;justify-content:center;}
  .chip .dot.cat-icon svg{width:17px;height:17px;}
  .chip.active .dot.cat-icon{color:#fff;}
  .chip[data-cat="all"] .dot{background:conic-gradient(var(--meat) 0 25%,var(--dairy) 25% 50%,var(--eggs) 50% 75%,var(--veg) 75% 100%);}
  .chip.active{
    background:var(--cat,var(--accent));
    border-color:transparent;
    color:#fff;
  }
  .chip[data-cat="all"].active{background:var(--text);}
  .chip-count{
    font-variant-numeric:tabular-nums;
    font-size:0.76rem;
    opacity:0.75;
  }
  .filter-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 2px;}
  /* The three dropdowns sit outside the scrolling chip track. Inside it they
     made the track 967px of content in a 280px window on a phone - you saw
     two of eight controls and the rest were behind a sideways scroll nobody
     finds. Out here the track carries the six categories and nothing else,
     and Kraj's right edge lines up with the search field above it. */
  .filters > .dd{flex-shrink:0;margin-left:10px;}
  .filter-sep-pin{margin-left:14px;}
  /* Filter dropdowns are built from the page's own parts rather than a native
     select, whose open list can't be styled to match. */
  .dd{position:relative;flex-shrink:0;}
  .dd[hidden]{display:none;}
  .dd-trigger{
    display:inline-flex;align-items:center;gap:8px;
    font-family:inherit;font-size:0.85rem;font-weight:500;
    color:var(--text);background:var(--surface-2);
    border:1px solid var(--border);border-radius:999px;
    padding:8px 13px 8px 15px;cursor:pointer;max-width:250px;
  }
  .dd-trigger .dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dd-icon{display:inline-flex;flex-shrink:0;opacity:0.85;}
  .dd-icon svg{width:15px;height:15px;}
  .dd.on .dd-icon{opacity:1;}
  /* Clearing is an action, not another filter - and it has to stay reachable:
     the chips scroll sideways, so this sits outside their track. */
  .chip-clear{
    position:relative;flex-shrink:0;margin-left:20px;
    background:var(--surface);
    border-color:var(--accent);
    color:var(--accent);font-weight:600;
    gap:8px;padding-left:12px;
  }
  .chip-clear::before{
    content:"";position:absolute;right:calc(100% + 10px);
    top:-7px;bottom:-7px;width:1px;background:var(--border);
  }
  .chip-clear:hover{
    background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  }
  .chip-clear .icon{width:14px;height:14px;stroke-width:2.2;opacity:0.9;}
  /* How many filters are live, as a counter rather than a trailing dot. */
  .chip-clear .chip-count{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 5px;border-radius:999px;
    background:var(--accent);color:var(--accent-ink);
    font-size:0.72rem;font-weight:700;opacity:1;
  }
  .chip-clear:hover .chip-count{background:var(--accent-ink);color:var(--accent);}
  .chip-clear .chip-count:empty{display:none;}
  .chip-clear[hidden]{display:none;}
  .dd-chev{width:14px;height:14px;flex-shrink:0;opacity:0.8;transition:transform .15s ease;}
  .dd.open .dd-chev{transform:rotate(180deg);}
  .dd-trigger:hover{background:var(--surface-3);}
  .dd-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .dd.on .dd-trigger{
    border-color:var(--accent);color:var(--accent);
    background:var(--surface-3);font-weight:600;
  }
  .dd-menu{
    position:fixed;z-index:40;
    min-width:230px;max-width:320px;max-height:340px;overflow-y:auto;
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;box-shadow:0 12px 30px var(--shadow);
    padding:6px;display:none;
  }
  .dd-menu.open{display:block;}
  .dd-opt{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:100%;padding:9px 12px;border:none;background:none;
    border-radius:10px;cursor:pointer;text-align:left;
    font-family:inherit;font-size:0.86rem;color:var(--text);
  }
  .dd-opt:hover,.dd-opt.focused{background:var(--surface-2);}
  .dd-opt[aria-selected="true"]{color:var(--accent);font-weight:600;background:var(--surface-3);}
  .dd-opt .dd-count{
    font-size:0.78rem;color:var(--text-soft);
    font-variant-numeric:tabular-nums;flex-shrink:0;
  }
  .dd-opt[aria-selected="true"] .dd-count{color:var(--accent);}

.chip-fav .dot.cat-icon{color:var(--accent);}
.chip-fav.active{background:var(--accent);border-color:transparent;color:#fff;}
.chip-fav.active .dot.cat-icon{color:#fff;}

/* Anchored to the field's RIGHT edge: the search sits at the end of the
   header, so a panel hung from the left ran off the window and the town
   beside each farm was cut in half. */
.suggest{
  position:absolute;top:calc(100% + 6px);right:0;z-index:45;
  width:360px;max-width:min(92vw, 360px);max-height:340px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:0 12px 30px var(--shadow);padding:6px;
}
.suggest[hidden]{display:none;}
.suggest-group{
  padding:8px 12px 4px;font-size:0.68rem;font-weight:700;
  letter-spacing:0.07em;text-transform:uppercase;color:var(--text-soft);
}
.suggest-item{
  display:flex;align-items:flex-start;gap:9px;width:100%;
  padding:9px 12px;border:none;background:none;border-radius:10px;
  font-family:inherit;font-size:0.86rem;color:var(--text);
  text-align:left;cursor:pointer;line-height:1.35;
}
.suggest-item > span:first-of-type{flex:1;min-width:0;}
.suggest-item:hover,.suggest-item.focused{background:var(--surface-2);}
.suggest-item svg{width:15px;height:15px;flex-shrink:0;color:var(--text-soft);margin-top:2px;}
.suggest-item .sub{
  font-size:0.76rem;color:var(--text-soft);
  flex-shrink:1;min-width:0;max-width:46%;text-align:right;margin-top:1px;
  overflow-wrap:anywhere;
}

/* The farm-gate line is a statement of fact, not somewhere to click. */
.shop-tag.own,.shop-tag.plain{
  border-style:dashed;border-color:var(--border);
  color:var(--text-soft);background:transparent;
  font-weight:500;cursor:default;gap:6px;
}
.shop-tag.own:hover,.shop-tag.plain:hover{background:transparent;}
.shop-tag.own svg{width:14px;height:14px;margin:0;opacity:0.8;}

/* Secondary action, but still clearly a button. */
.btn{background:var(--surface-3);border-color:transparent;}
.btn:hover{background:var(--surface-2);}
.btn.primary:hover{background:var(--accent);}

.fav-btn{
  margin-left:auto;align-self:flex-start;flex-shrink:0;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;background:none;cursor:pointer;
  color:var(--text-soft);
}
.fav-btn:hover{background:var(--surface);color:var(--accent);}
/* Hearts stop shouting from every row: they appear on hover or focus and
   stay put once a farm is actually saved. Touch devices keep them on. */
@media (hover:hover){
  .fav-btn{opacity:0;transition:opacity .15s ease;}
  .farm-card:hover .fav-btn,
  .farm-card:focus-within .fav-btn,
  .fav-btn.on{opacity:1;}
}
.fav-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;}
.fav-btn.on{color:var(--accent);}
.fav-btn.on svg{fill:currentColor;stroke:currentColor;}
.d-fav{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 15px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface-2);
  color:var(--text);font-family:inherit;font-size:0.86rem;font-weight:600;
}
.d-fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;}
.d-fav.on{border-color:var(--accent);color:var(--accent);}
.d-fav.on svg{fill:currentColor;}

  /* ---------- Layout ---------- */
  .layout{
    flex:1;
    display:grid;
    grid-template-columns:1fr;
    min-height:0;
  }
  .layout.list-open{grid-template-columns:300px 1fr;}

  .sidebar{
    display:none;
    border-right:1px solid var(--border);
    background:var(--surface);
    overflow-y:auto;
    min-height:0;
    padding:14px;
    flex-direction:column;
    gap:10px;
  }
  .layout.list-open .sidebar{display:flex;}
  .sidebar-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:2px 4px 8px;
    border-bottom:1px solid var(--border);
    font-size:0.72rem;font-weight:700;letter-spacing:0.07em;
    text-transform:uppercase;color:var(--text-soft);
  }
  .sidebar-count{font-variant-numeric:tabular-nums;letter-spacing:0;margin-left:auto;}
  .sort-row{display:inline-flex;gap:3px;}
  .sort-btn{
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--text-soft);font-family:inherit;
    font-size:0.64rem;font-weight:700;letter-spacing:0.04em;
    padding:3px 8px;border-radius:999px;cursor:pointer;text-transform:none;
  }
  .sort-btn:hover{background:var(--surface-3);}
  .sort-btn.active{background:var(--accent);border-color:transparent;color:var(--accent-ink);}
  .farm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .farm-card{
    display:flex;align-items:flex-start;gap:10px;
    width:100%;
    text-align:left;
    padding:10px 11px;
    border-radius:var(--radius-md);
    border:1px solid var(--border);
    background:var(--surface-2);
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .farm-card:hover{background:var(--surface-3);}
  .farm-card.active{border-color:var(--accent);background:var(--surface-3);}
  .farm-card .swatch{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;margin-top:1px;
  }
  .farm-card .swatch svg{width:16px;height:16px;fill:#fff;stroke:none;}
  .farm-card .meta{min-width:0;display:flex;flex-direction:column;gap:3px;}
  .farm-card .name{display:block;font-weight:600;font-size:0.92rem;line-height:1.25;}
  .farm-card .town{
    display:flex;align-items:flex-start;gap:5px;
    font-size:0.78rem;color:var(--text-soft);line-height:1.3;
  }
  .farm-card .town svg{width:12px;height:12px;flex-shrink:0;margin-top:1px;stroke:currentColor;fill:none;}
  .farm-card.hidden{display:none;}
  .empty-state{
    padding:22px 10px;text-align:center;color:var(--text-soft);font-size:0.86rem;
  }
  .sidebar-footnote{
    margin-top:auto;
    font-size:0.76rem;
    color:var(--text-soft);
    line-height:1.5;
    padding-top:10px;
    border-top:1px solid var(--border);
  }

  /* ---------- Map ---------- */
  .map-wrap{
    position:relative;
    touch-action:none;
    min-height:0;
    background:
      radial-gradient(ellipse at 30% 15%, var(--surface-2), var(--bg) 60%);
    overflow:hidden;
  }
  .map-inner{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:14px 16px 42px;
  }
  .map-stage{
    position:relative;
    /* Width is set by fitStage() so the box always matches the
       artwork; aspect-ratio derives the height from it. */
    width:100%;
    max-width:100%;
    aspect-ratio:900/532.92;
    transform-origin:0 0;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
  }
  .map-stage > svg{width:100%;height:100%;display:block;overflow:visible;}
  .map-stage path.region{
    fill:var(--pasture-fill);
    stroke:var(--pasture-stroke);
    stroke-width:1.1;
    cursor:pointer;
    vector-effect:non-scaling-stroke;
    transition:fill .15s ease;
  }
  .map-stage path.region:hover{fill:var(--pasture-fill-hover);}
  /* With a region chosen, it goes a deeper green and the rest fade back. */
  .regions.has-selection path.region{fill:var(--pasture-fill-muted);}
  .regions.has-selection path.region:hover{fill:var(--pasture-fill-hover);}
  .map-stage path.region.selected,
  .regions.has-selection path.region.selected:hover{
    fill:var(--pasture-fill-active);
    stroke:var(--accent);
  }
  /* Drawn above every region so no neighbour can paint over it. */
  /* Main rivers, drawn from OpenStreetMap ways and clipped to the border so
     they stop at the frontier rather than trailing off into the surround.
     A non-scaling stroke keeps them a hairline at every zoom. */
  .rivers{pointer-events:none;}
  .rivers path{
    fill:none;
    stroke:var(--river);
    stroke-width:0.85;
    stroke-linecap:round;
    stroke-linejoin:round;
    opacity:0.40;
    vector-effect:non-scaling-stroke;
  }
  /* Labe, Vltava, Morava and Odra carry the country's drainage, so they read
     first; the rest sit back as context. */
  .rivers path[data-major="1"]{stroke-width:1.3;opacity:0.55;}
  .region-outline{
    fill:none;stroke:var(--accent);stroke-width:2.2;
    stroke-linejoin:round;pointer-events:none;
    vector-effect:non-scaling-stroke;
  }
  /* Dragging across the map previews each kraj under the cursor. Last of
     the region fill rules so it beats .selected and .has-selection. */
  .map-stage path.region.drag-target{fill:var(--pasture-fill-active);}
  .map-stage.region-dragging,
  .map-stage.region-dragging path.region{cursor:grabbing;}
  /* Town names live in HTML, not in the SVG. Inside the zoomed stage the
     browser rasterises SVG text at its pre-transform size and then magnifies
     that bitmap, so at 4x a 6px glyph turns to mush. An HTML span that is
     counter-scaled instead keeps a constant size on screen and is redrawn
     sharp at every zoom. */
  /* The overlay sits OUTSIDE .map-stage on purpose. Safari rasterises a
     CSS-transformed subtree and then scales that bitmap, so anything inside
     the zoomed stage goes soft; Chrome re-renders it as vectors, which is why
     this only showed up in Safari. Out here the labels are ordinary page text
     at a fixed size, and JS puts them where the map currently is. */
  .city-labels{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .city-labels span{
    position:absolute;
    left:0; top:0;
    transform-origin:0 0;
    white-space:nowrap;
    font-family:"Work Sans",sans-serif;
    font-weight:650;
    font-size:12px;
    letter-spacing:0.01em;
    color:#2F5D45;
    text-shadow:
      0 1px 2px var(--surface), 0 -1px 2px var(--surface),
      1px 0 2px var(--surface), -1px 0 2px var(--surface),
      0 0 3px var(--surface);
  }
  .city-labels span.capital{font-weight:800;font-size:13.5px;color:#24503A;}
  .city-labels span.town{opacity:0;transition:none;font-size:11px;font-weight:600;}
  .city-labels.zoomed span.town{opacity:1;transition:opacity .25s ease;}
  .city-labels span.town.off-focus{display:none;}
  .city-labels.zoomed span{font-size:13px;color:#24503A;}
  .city-labels.zoomed span.capital{font-size:15px;}
  .city-labels.zoomed span.town{font-size:11.5px;}
  .cities{pointer-events:none;}
  .cities circle{
    fill:var(--text-soft);opacity:0.55;
    stroke:var(--surface);stroke-width:calc(1.4px / var(--zoom-scale,1));
  }
  /* Every label sits on a halo in the page's surface colour, so it reads over
     pale pasture and over the deep green of a selected region alike. The halo
     stays thin relative to the glyphs &#8212; a heavy one turns small text to mush. */
  .cities text{
    fill:#2F5D45;
    font-family:"Work Sans",sans-serif;font-weight:650;
    letter-spacing:0.01em;
    font-size:calc(12px / var(--zoom-scale,1));
    paint-order:stroke fill;
    stroke:var(--surface);
    stroke-width:calc(2.6px / var(--zoom-scale,1));
    stroke-linejoin:round;
    stroke-opacity:0.92;
  }
  .cities .capital circle{fill:var(--text);opacity:0.9;}
  .cities .capital text{font-weight:800;font-size:calc(13.5px / var(--zoom-scale,1));}
  /* District towns only earn their space once you are zoomed in. */
  .cities .town{opacity:0;transition:none;pointer-events:none;}
  .cities.zoomed .town{transition:opacity .25s ease;}
  .cities.zoomed .town{opacity:1;}
  .cities .town.off-focus{display:none;}
  .cities .town circle{fill:var(--text-soft);opacity:0.65;}
  .cities .town text{font-size:calc(10.5px / var(--zoom-scale,1));font-weight:600;}
  /* Zoomed in there is room to read, so labels grow on screen instead of
     holding their size, and the halo grows only a little with them. */
  /* Zoomed in, labels flip to white on a dark halo &#8212; the map-label convention
     that stays readable over the deep green of a selected region and over the
     pale pasture around it, in either theme. */
  .cities.zoomed text{
    font-size:max(4.5px, calc(16px / var(--zoom-scale,1)));
    fill:#24503A;
    stroke:var(--surface);
    stroke-width:max(1.7px, calc(3.4px / var(--zoom-scale,1)));
    stroke-opacity:0.96;
  }
  .cities.zoomed circle{fill:#24503A;stroke:var(--surface);opacity:0.95;}
  .cities.zoomed .capital text{font-size:max(7.4px, calc(18px / var(--zoom-scale,1)));}
  .cities.zoomed .town text{font-size:max(6px, calc(14px / var(--zoom-scale,1)));font-weight:600;}
  /* Zoomed in, the farms that match keep their name showing. */
  /* Zoomed in, the pins speak for themselves - a name appears on hover,
     focus or selection, so the region stays readable. */
  .pin.selected .pin-tip{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Outside .map-stage, for the reason given above .city-labels: Safari
     rasterises a CSS-transformed subtree and then magnifies that bitmap,
     so pins and their names turned to mush as you zoomed in. Out here they
     are ordinary page elements drawn sharp at every zoom; positionPins()
     moves and resizes this layer onto wherever the stage currently is, so
     the percentage coordinates on each pin still land true. */
  .pins{position:absolute;inset:0;pointer-events:none;z-index:2;}
  .pin{
    position:absolute;
    transform-origin:50% 100%;
    transform:translate(-50%,-100%);
    pointer-events:auto;
    background:none;border:none;padding:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;
    filter:drop-shadow(0 2px 4px var(--shadow));
    transition:transform .15s ease, opacity .15s ease;
    z-index:1;
  }
  .pin:hover,.pin:focus-visible{transform:translate(-50%,-100%) scale(1.16);z-index:5;}
  .pin:focus-visible{outline:none;}
  /* Farms outside the current filter leave the map entirely &#8212; a greyed-out
     layer underneath read as noise. */
  .pin.dim{display:none;}
  .pin.hovered{z-index:5;transform:translate(-50%,-100%) scale(1.2);}
  .pin.faded{opacity:0.28;}
  .pin.faded .pin-tip{opacity:0 !important;}
  .pin.hovered .pin-outline{stroke:var(--surface);stroke-width:2.6;}
  .pin.hovered{filter:drop-shadow(0 4px 9px var(--shadow)) drop-shadow(0 1px 2px var(--shadow));}
  .pins.zoomed .pin{transform:translate(-50%,-100%) scale(1.34);}
  /* Inside a selected kraj the pin is scaled up and the name rides along
     with it, which made the label shout. Trim it back. */
  .pins.zoomed .pin-tip{font-size:0.62rem;padding:4px 8px;border-radius:8px;}

  .pins.zoomed .pin:hover,
  .pins.zoomed .pin:focus-visible{transform:translate(-50%,-100%) scale(1.52);}
  .pins.zoomed .pin.hovered{transform:translate(-50%,-100%) scale(1.57);}
  @media (pointer:coarse){
    .pin{filter:none;}
    .pin.hovered,.pin:hover{filter:none;}
    .pin-badge .pin-outline{stroke-width:2.6;}
  }
  .pin.selected{z-index:6;filter:drop-shadow(0 0 5px var(--accent)) drop-shadow(0 3px 6px var(--shadow));}
  /* Sized directly rather than through the transform, which carries the
     hover and zoomed-in steps. */
  .pin-badge{
    width:calc(27px * var(--pin-scale,1));
    height:calc(33.5px * var(--pin-scale,1));
    display:block;
  }
  .pin.selected .pin-badge .pin-outline{stroke:var(--text);stroke-width:3;}
  .pin-tip{
    position:absolute;
    bottom:calc(100% + 6px);
    left:50%;transform:translateX(-50%) translateY(4px);
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
    box-shadow:0 4px 12px var(--shadow);
    font-size:0.73rem;font-weight:600;letter-spacing:0.01em;
    padding:5px 10px;border-radius:9px;
    white-space:nowrap;
    opacity:0;pointer-events:none;
    transition:opacity .12s ease, transform .12s ease;
  }
  .pin:hover .pin-tip,.pin:focus-visible .pin-tip{opacity:1;transform:translateX(-50%) translateY(0);}
  .pin.tip-below .pin-tip{bottom:auto;top:calc(100% + 6px);transform:translateX(-50%) translateY(-4px);}
  .pin.tip-below:hover .pin-tip,.pin.tip-below:focus-visible .pin-tip{transform:translateX(-50%) translateY(0);}

  /* ---- What is in season ----
     The map frame carries furniture in three corners already; this takes the
     fourth. Only the trigger lives there - a corner card had to be narrow,
     and a list of 30 names crammed into 280px is what made it a wall. The
     panel itself opens centred, where it has room to breathe. */
  .season-pill{
    position:absolute;left:18px;top:14px;z-index:3;
    display:flex;align-items:center;gap:8px;
    max-width:calc(100% - 36px);
    padding:9px 14px;border-radius:999px;
    background:color-mix(in srgb, var(--surface) 94%, transparent);
    border:1px solid var(--border);
    box-shadow:0 2px 10px var(--shadow);
    font-family:inherit;color:var(--text);cursor:pointer;
  }
  .season-pill:hover{background:var(--surface-3);}
  .season-leaf{width:16px;height:16px;flex-shrink:0;color:var(--veg);}
  /* "Rijen" alone reads as a calendar, so the pill says what it is FOR
     first and carries the month behind it as a quiet badge. The live dot
     is the cheapest possible signal that this is about today. */
  .season-kicker{
    font-size:0.86rem;font-weight:700;letter-spacing:-0.01em;
    color:var(--text);white-space:nowrap;
  }
  .season-month{
    font-size:0.74rem;font-weight:600;white-space:nowrap;
    padding:2px 8px;border-radius:999px;
    background:var(--pasture-fill);color:var(--veg);
    border:1px solid var(--pasture-stroke);
  }
  .season-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    background:var(--veg);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--veg) 22%, transparent);
  }

  .season-scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;}
  .season-modal{
    position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(720px, calc(100vw - 40px));
    max-height:calc(100vh - 48px);
    max-height:calc(100dvh - 48px);
    display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);box-shadow:0 18px 48px var(--shadow);
    overflow:hidden;
  }
  .season-top{
    display:flex;align-items:center;gap:11px;
    padding:18px 20px 14px;border-bottom:1px solid var(--border);
  }
  .season-top .season-leaf{width:22px;height:22px;}
  .season-titles{flex:1;min-width:0;}
  .season-titles h2{font-size:1.4rem;line-height:1.1;}
  .season-titles p{margin:2px 0 0;font-size:0.82rem;color:var(--text-soft);}
  .season-close{
    background:none;border:0;cursor:pointer;font-size:1.6rem;line-height:1;
    color:var(--text-soft);padding:0 2px;align-self:flex-start;
  }
  .season-close:hover{color:var(--text);}
  .season-body{padding:18px 20px;overflow-y:auto;}

  /* Each group takes one of the map's own category colours, so the eye sorts
     vegetables from fruit from herbs before it reads a single word. */
  .season-group{--sc:var(--veg);}
  .season-group.fruit{--sc:var(--meat);}
  .season-group.herbs{--sc:var(--dairy);}
  .season-group + .season-group{margin-top:20px;}
  .season-group h4{
    display:flex;align-items:center;gap:7px;
    margin:0 0 9px;font-family:"Work Sans",sans-serif;
    font-size:0.68rem;font-weight:700;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--sc);
  }
  .season-group h4::before{
    content:"";width:8px;height:8px;border-radius:50%;
    background:var(--sc);flex-shrink:0;
  }
  .season-chips{display:flex;flex-wrap:wrap;gap:6px 7px;}
  .season-chip{
    font-size:0.85rem;line-height:1.35;font-weight:600;
    padding:6px 12px;border-radius:9px;
    background:color-mix(in srgb, var(--sc) 20%, var(--surface));
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--sc) 30%, transparent);
    color:var(--sc);
  }
  /* Kept from this year's harvest, or grown under glass: the same colour, but
     outlined rather than filled, so it is plainly the quieter kind. */
  .season-chip.s,.season-chip.g{
    background:transparent;font-weight:500;
    color:color-mix(in srgb, var(--sc) 55%, var(--text-soft));
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--sc) 30%, transparent);
  }
  .season-chip.g{border-radius:999px;}
  .season-sub{
    display:block;font-style:normal;margin:11px 0 6px;
    font-size:0.66rem;font-weight:700;letter-spacing:0.07em;
    text-transform:uppercase;color:var(--text-soft);
  }

  /* Stacked and centred: the call to action first, then the month stepper
     under it, then the caveat. Side by side the stepper read as an
     afterthought pushed into a corner. */
  .season-foot{
    display:flex;flex-direction:column;align-items:center;gap:11px;
    padding:15px 20px 16px;border-top:1px solid var(--border);
    background:var(--surface-2);
  }
  .season-link{
    width:100%;max-width:400px;padding:10px 16px;
    border:1px solid var(--accent);border-radius:999px;
    background:var(--surface);cursor:pointer;
    font-family:inherit;font-size:0.86rem;font-weight:600;color:var(--accent);
    text-align:center;
  }
  .season-link:hover{background:var(--accent);color:var(--accent-ink);}
  .season-nav{display:flex;align-items:center;justify-content:center;gap:6px;}
  .season-nav button{
    border:1px solid var(--border);background:var(--surface);
    padding:6px 13px;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:0.8rem;font-weight:600;color:var(--text);
  }
  .season-nav button:hover{background:var(--surface-3);}
  .season-today{
    border-color:transparent !important;background:none !important;
    color:var(--accent) !important;font-weight:600;
  }
  .season-today[hidden]{display:none;}
  .season-note{
    margin:0;max-width:460px;text-align:center;
    font-size:0.72rem;line-height:1.45;color:var(--text-soft);
  }

  .map-reset{
    position:absolute;right:18px;bottom:14px;
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:999px;
    border:1px solid var(--accent);background:var(--surface);
    color:var(--accent);font-size:0.83rem;font-weight:600;cursor:pointer;
    box-shadow:0 2px 10px var(--shadow);
  }
  .map-zoom{
    position:absolute;right:18px;bottom:62px;
    display:flex;flex-direction:column;
    border:1px solid var(--border);border-radius:12px;
    background:var(--surface);overflow:hidden;
    box-shadow:0 2px 10px var(--shadow);
  }
  .map-zoom button{
    width:38px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border:none;background:none;color:var(--text);cursor:pointer;
  }
  .map-zoom button + button{border-top:1px solid var(--border);}
  .map-zoom button:hover:not(:disabled){background:var(--surface-3);}
  .map-zoom button:disabled{opacity:0.35;cursor:default;}
  .map-zoom svg{width:17px;height:17px;}
  .map-reset[hidden]{display:none;}
  .map-reset:hover{background:var(--surface-3);}
  .map-reset svg{width:15px;height:15px;}
  /* Suggesting a farm used to live only at the foot of the farm list, which
     you had to open and then scroll past 91 cards to reach - on a fresh load
     there was no way in at all. It gets its own corner of the map frame. */
  .map-suggest{
    position:absolute;left:18px;bottom:46px;z-index:3;
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;
    background:var(--accent);
    border:1px solid var(--accent);color:var(--accent-ink);
    font-family:inherit;font-size:0.82rem;font-weight:700;
    cursor:pointer;box-shadow:0 3px 12px var(--shadow);
  }
  .map-suggest:hover{
    background:color-mix(in srgb, var(--accent) 86%, var(--text));
    border-color:color-mix(in srgb, var(--accent) 86%, var(--text));
  }
  .map-suggest:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
  .map-suggest svg{width:14px;height:14px;flex-shrink:0;}
  .map-caption{
    position:absolute;left:18px;bottom:14px;
    font-size:0.74rem;color:var(--text-soft);
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    padding:5px 10px;border-radius:999px;
    border:1px solid var(--border);
  }

  /* ---------- Scrim & Drawer ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  z-index:60;display:flex;align-items:center;gap:14px;
  padding:11px 14px 11px 18px;border-radius:999px;
  background:var(--text);color:var(--bg);
  font-size:0.86rem;font-weight:600;
  box-shadow:0 8px 26px var(--shadow);
  opacity:0;transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast[hidden]{display:none;}
.toast button{
  border:none;background:none;color:var(--bg);
  font-family:inherit;font-size:0.82rem;font-weight:700;
  text-decoration:underline;cursor:pointer;padding:0;opacity:0.85;
}
.toast button:hover{opacity:1;}
  .scrim{
    position:fixed;inset:0;background:var(--scrim);
    opacity:0;pointer-events:none;transition:opacity .18s ease;
    z-index:20;
  }
  .scrim.show{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;left:50%;top:50%;
    width:min(680px, calc(100vw - 56px));
    max-height:min(88vh, 940px);
    max-height:min(88dvh, 940px);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:0 24px 64px var(--shadow);
    transform:translate(-50%,-48%) scale(0.98);
    opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s cubic-bezier(.32,.72,0,1);
    z-index:21;
    overflow-y:auto;
  }
  .drawer.open{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;pointer-events:auto;
  }
.drawer-tools{
  position:sticky;top:0;z-index:2;
  display:flex;justify-content:flex-end;gap:8px;
  padding:12px 12px 0;margin-bottom:-38px;
  pointer-events:none;
}
.drawer-tool{
  pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
/* A finger is not a cursor: on touch the buttons grow to a size that can
   actually be hit, and stop sharing an edge with each other. */
@media (pointer:coarse){
  .drawer-tools{gap:12px;padding:14px 14px 0;margin-bottom:-46px;}
  .drawer-tool{width:44px;height:44px;}
  .drawer-tool svg{width:20px;height:20px;}
  .d-cats{padding-right:168px;}
}
.drawer-tool:hover{background:var(--surface-3);}
.drawer-tool svg{width:17px;height:17px;}
/* Saved farms keep a filled heart; the rest show an outline. */
#drawerFav svg{fill:none;stroke:currentColor;stroke-width:1.9;transition:transform .18s ease;}
#drawerFav:hover svg{transform:scale(1.12);}
#drawerFav.on{color:var(--accent);border-color:var(--accent);background:var(--surface);}
#drawerFav.on svg{fill:currentColor;}
  .drawer-content{padding:20px 26px 32px;}

  .mobile-list-drawer{
    position:fixed;top:0;left:0;height:100%;width:340px;max-width:88vw;
    background:var(--surface);
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);
    z-index:21;overflow-y:auto;padding:14px;
    display:none;
  }
  .mobile-list-drawer.open{transform:translateX(0);}
  .sheet-grab{display:none;}
  /* 91 farms is a lot of scrolling, so every place the list appears -
     the desktop panel, the slide-in, the phone sheet - carries the same
     filter box above it. */
  .list-filter{
    display:flex;align-items:center;gap:8px;flex:0 0 auto;
    margin:0 0 10px;padding:0 12px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
  }
  .list-filter:focus-within{border-color:var(--accent);}
  .list-filter svg{width:15px;height:15px;flex-shrink:0;color:var(--text-soft);}
  .list-filter-input{
    flex:1;min-width:0;height:36px;border:0;background:none;outline:none;
    font-family:inherit;font-size:0.88rem;color:var(--text);
    -webkit-appearance:none;appearance:none;
  }
  .list-filter-input::placeholder{color:var(--text-soft);}
  .mobile-list-drawer .list-filter{margin:0 0 12px;}

  /* ---------- Drawer content ---------- */
  .cert-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 11px;border-radius:999px;
    font-size:0.75rem;font-weight:700;letter-spacing:0.01em;
  }
  .cert-pill svg{width:13px;height:13px;flex-shrink:0;}
  .cert-bio{background:#DCE8CC;color:#3D5B2A;border:1px solid #A8C088;}
  .cert-regen{background:#D9E6EC;color:#2C5466;border:1px solid #9CBCCB;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .cert-bio{background:#33452A;color:#C6DCAB;border-color:#55703F;}
    :root:not([data-theme="light"]) .cert-regen{background:#253A44;color:#A8CBDA;border-color:#3F6273;}
  }
  :root[data-theme="dark"] .cert-bio{background:#33452A;color:#C6DCAB;border-color:#55703F;}
  :root[data-theme="dark"] .cert-regen{background:#253A44;color:#A8CBDA;border-color:#3F6273;}
  .d-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:86px;}
  .d-cat-pill{
    font-size:0.72rem;font-weight:600;color:#fff;
    padding:4px 10px;border-radius:999px;
  }
  .drawer h2{font-size:1.5rem;line-height:1.15;margin-bottom:6px;}
  .d-loc{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--text-soft);font-size:0.88rem;margin-bottom:18px;
    text-decoration:none;border-bottom:1px solid transparent;
  }
  .d-loc:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .d-loc svg{width:15px;height:15px;flex-shrink:0;}
  .d-loc svg:last-child{width:12px;height:12px;opacity:0.7;}
  .drawer h3{
    font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;
    color:var(--text-soft);font-family:"Work Sans",sans-serif;font-weight:700;
    margin:22px 0 10px;
  }
  .d-story{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;}
  .d-story li{
    position:relative;padding-left:18px;font-size:0.92rem;line-height:1.5;
  }
  .d-story li::before{
    content:"";position:absolute;left:0;top:0.55em;
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
  }
  .d-shops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px;}
  .d-shops + .d-fact{margin-top:13px;}
  .ship-note{
    margin:9px 0 0;font-size:0.79rem;line-height:1.5;
    color:var(--text-soft);
  }
  .ship-note + .d-fact{margin-top:13px;}
  /* A stated fact about the farm - deliberately not shaped like the links. */
  .d-fact{
    display:flex;align-items:flex-start;gap:7px;
    margin:0;font-size:0.84rem;line-height:1.45;color:var(--text-soft);
  }
  .d-fact svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;}
  .d-fact span{color:var(--text);font-weight:600;}
  .d-fact-sub{margin-top:10px;}
  .d-fact-sub span{font-weight:400;color:var(--text-soft);}
  .d-fact-sub strong{color:var(--text);font-weight:600;}
  .d-buy{margin-right:2px;padding:8px 15px;font-size:0.84rem;}
  .shop-tag{
    display:inline-flex;align-items:center;
    padding:6px 12px;border-radius:999px;
    font-size:0.82rem;font-weight:600;text-decoration:none;
    border:1px solid var(--accent);color:var(--accent);background:transparent;
  }
  .shop-tag.own,.shop-tag.plain{border-color:var(--border);color:var(--text-soft);background:var(--surface-2);}
  .shop-tag:hover{background:var(--surface-3);}
  .shop-tag .icon{width:11px;height:11px;margin-left:5px;opacity:0.65;}
.d-hours{
  margin:12px 0 0;padding:11px 13px;
  border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--surface-2);
}
.d-hours-head{
  display:flex;align-items:center;gap:7px;margin:0 0 6px;
  font-size:0.68rem;font-weight:700;letter-spacing:0.07em;
  text-transform:uppercase;color:var(--text-soft);
}
.d-hours-head svg{width:14px;height:14px;flex-shrink:0;}
.hours-group + .hours-group{margin-top:9px;}
.d-hours-place,.hours-where{
    display:inline-flex;align-items:flex-start;gap:5px;
    margin:0 0 3px;font-size:0.78rem;line-height:1.45;font-weight:500;
    color:var(--text-soft);text-decoration:none;
  }
  .d-hours-place{border-bottom:1px solid var(--border);}
  .d-hours-place:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .d-hours-place svg{width:11px;height:11px;flex-shrink:0;margin-top:3px;opacity:0.7;}
.d-hours-rows{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;}
.d-hours-rows li{
  font-size:0.86rem;color:var(--text);font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.45;
}
.hours-qual{font-weight:400;color:var(--text-soft);}
/* Remarks are context, not a timing - they read as a sentence, not as data. */
.hours-note{
  margin:8px 0 0;padding-top:8px;
  border-top:1px solid var(--border);
  font-size:0.82rem;font-weight:400;line-height:1.55;
  color:var(--text-soft);
}
.hours-group:first-child + .hours-note,.d-hours-head + .hours-note{
  margin-top:0;padding-top:0;border-top:0;
}
  /* The next pickup or delivery window, resolved against today. It gets a
     card of its own because it is the one date the visitor has to act on;
     everything else folds away behind a summary. */
  .d-slots{
    margin-top:12px;padding:13px 15px 12px;
    border-radius:var(--radius-md);
    background:var(--pasture-fill);
    border:1px solid var(--pasture-stroke);
  }
  .d-slots-head{
    display:flex;align-items:center;gap:7px;margin:0 0 7px;
    font-size:0.74rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
    color:var(--text-soft);
  }
  .d-slots-head svg{width:14px;height:14px;}
  .slot-next{
    display:flex;align-items:baseline;flex-wrap:wrap;gap:9px;margin:0;
    font-size:1.05rem;color:var(--text);font-variant-numeric:tabular-nums;
  }
  .slot-next strong{font-weight:700;}
  .slot-lead{
    font-size:0.74rem;font-weight:600;letter-spacing:0.02em;
    padding:2px 9px;border-radius:999px;
    background:var(--accent);color:var(--accent-ink);
  }
  .slot-kind{margin:3px 0 0;font-size:0.9rem;font-weight:600;color:var(--text);}
  .slot-meta{
    margin:2px 0 0;font-size:0.83rem;color:var(--text-soft);
    font-variant-numeric:tabular-nums;
  }
  .slot-place{
    display:inline-flex;align-items:center;gap:6px;margin-top:7px;
    font-size:0.83rem;color:var(--text);text-decoration:none;
    border-bottom:1px solid var(--border);padding-bottom:2px;
  }
  .slot-place:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .slot-place svg{width:13px;height:13px;flex-shrink:0;color:var(--text-soft);}
  .slot-stale{margin:0;font-size:0.87rem;color:var(--text-soft);line-height:1.5;}
  .slot-more{margin-top:10px;}
  .slot-more summary{
    cursor:pointer;font-size:0.82rem;font-weight:600;color:var(--text-soft);
    list-style:none;display:flex;align-items:center;gap:6px;
  }
  .slot-more summary::-webkit-details-marker{display:none;}
  .slot-more summary::before{
    content:"";width:0;height:0;
    border-left:5px solid currentColor;
    border-top:4px solid transparent;border-bottom:4px solid transparent;
    transition:transform 0.15s ease;
  }
  .slot-more[open] summary::before{transform:rotate(90deg);}
  .slot-more summary:hover{color:var(--accent);}
  .slot-rest{
    list-style:none;margin:8px 0 0;padding:0;
    display:flex;flex-direction:column;gap:5px;
  }
  .slot-rest li{
    display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
    font-size:0.84rem;color:var(--text-soft);
  }
  .slot-rest-date{
    min-width:104px;font-weight:600;color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .slot-rest .slot-meta{margin:0;flex-basis:100%;}
  .slot-src{
    display:inline-block;margin-top:10px;
    font-size:0.76rem;color:var(--text-soft);text-decoration:none;
  }
  .slot-src svg{width:11px;height:11px;margin-left:4px;vertical-align:-1px;}
  .slot-src:hover{color:var(--accent);}

  /* Recommend-a-farm panel. It never posts anywhere on its own: the visitor
     sends the message from their own mail client, or copies the text. */
  .mobile-list-drawer .rec-open{
    margin:14px 4px 4px;padding-top:12px;
    border-top:1px solid var(--border);width:100%;text-align:left;
  }
  .rec-open{
    margin-top:10px;background:none;border:0;padding:0;cursor:pointer;
    font:inherit;font-size:0.8rem;font-weight:600;color:var(--accent);
    text-decoration:underline;text-underline-offset:3px;
  }
  .rec-open:hover{opacity:0.75;}
  [hidden]{display:none !important;}
  .rec-scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;}
  .rec-panel{
    position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(460px, calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;
    max-height:calc(100dvh - 48px);
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);box-shadow:0 18px 48px var(--shadow);
    padding:22px 24px 20px;
  }
  .rec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .rec-head h2{margin:0;font-size:1.15rem;color:var(--text);}
  .rec-close{
    background:none;border:0;cursor:pointer;font-size:1.5rem;line-height:1;
    color:var(--text-soft);padding:0 2px;
  }
  .rec-close:hover{color:var(--text);}
  .rec-lead{margin:8px 0 16px;font-size:0.86rem;line-height:1.55;color:var(--text-soft);}
  .rec-field{display:block;margin-bottom:12px;}
  .rec-field span{
    display:block;margin-bottom:5px;
    font-size:0.76rem;font-weight:700;letter-spacing:0.05em;
    text-transform:uppercase;color:var(--text-soft);
  }
  .rec-field input,.rec-field textarea{
    width:100%;box-sizing:border-box;
    padding:9px 12px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);font:inherit;font-size:0.88rem;
  }
  .rec-field textarea{resize:vertical;}
  .rec-field input:focus,.rec-field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .rec-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .rec-actions .btn{cursor:pointer;font:inherit;font-size:0.88rem;font-weight:600;}
  .rec-trap{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
  .rec-hint{margin:12px 0 0;font-size:0.78rem;line-height:1.5;color:var(--text-soft);}
  /* Somebody who would rather just write an email should not have to
     hunt for the address - it sits in the open, under the form. */
  .rec-mail{
    margin:14px 0 0;padding-top:12px;border-top:1px solid var(--border);
    font-size:0.82rem;line-height:1.5;color:var(--text-soft);
  }
  .rec-mail a{
    color:var(--accent);font-weight:600;text-decoration:none;
    border-bottom:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .rec-mail a:hover{border-bottom-color:var(--accent);}

  .d-offers{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .offer-chip{
    font-size:0.76rem;font-weight:600;
    padding:4px 10px;border-radius:999px;
    background:var(--pasture-fill);color:var(--veg);
    border:1px solid var(--pasture-stroke);
  }
  .d-awards{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px;}
  .award-badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:0.78rem;font-weight:600;color:#7A5A12;
    background:#F6E4B8;border:1px solid #E0C176;
    padding:5px 11px;border-radius:999px;
  }
  .award-badge svg{width:14px;height:14px;flex-shrink:0;}
  .d-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 16px;border-radius:999px;
    font-size:0.88rem;font-weight:600;text-decoration:none;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn svg{width:16px;height:16px;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .d-contacts{display:flex;flex-direction:column;gap:8px;margin-top:2px;}
  .contact-line{
    display:flex;align-items:center;gap:10px;
    padding:9px 13px;border-radius:var(--radius-md);
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);text-decoration:none;font-size:0.88rem;
  }
  .contact-line:hover{background:var(--surface-3);border-color:var(--accent);color:var(--accent);}
  .contact-line svg{width:15px;height:15px;flex-shrink:0;color:var(--text-soft);}
  .contact-line span{word-break:break-word;}
  .d-contact{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .contact-btn{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  }
  .contact-btn svg{width:17px;height:17px;}
  .contact-btn:hover{background:var(--surface-3);}

  /* ---------- Responsive ---------- */
  @media (max-width:960px){
    .layout{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .mobile-list-drawer{display:block;}
    #listToggle{display:inline-flex;}
    .search input{width:150px;}
    /* Too narrow to centre a card: it comes up from the bottom instead. */
    .drawer{width:100%;max-width:100%;left:0;top:auto;bottom:0;
      height:86vh;max-height:86vh;
      height:86dvh;max-height:86dvh;
      border:none;border-top:1px solid var(--border);
      border-radius:20px 20px 0 0;
      transform:translateY(100%);opacity:1;pointer-events:auto;
      transition:transform .22s cubic-bezier(.32,.72,0,1);
    }
    .drawer.open{transform:translateY(0);}
    .drawer::before{
      content:"";display:block;width:38px;height:4px;border-radius:2px;
      background:var(--border);margin:10px auto 2px;
    }
  }

  .filterbar-m{display:none;}
  .filters-grab,.filters-done{display:none;}

  /* Phone layout: stack the header, let search take the width, keep taps big. */
  /* ---------- Phone ----------
     Two things matter on a 390px screen: give the map the height, and make
     everything thumb-sized. The header collapses to one row, the search
     becomes an icon until tapped, and controls meet the 44px touch target. */
  @media (max-width:600px){
    /* The title and the buttons came to a few pixels more than 375 and wrapped,
       which cost a whole 38px row for nothing. Trimmed just enough to share
       one line; the subtitle keeps the line below it. */
    .topbar{padding:7px 12px;gap:4px 6px;flex-wrap:wrap;}
    .brand{min-width:0;flex:0 1 auto;gap:8px;}
    /* Beside the title there is no room for the subtitle, so on a phone it
       gets its own full-width line under the header row. */
    .brand .tagline{display:none;}
    .tagline-m{display:block;margin:0;font-size:0.72rem;line-height:1.25;width:100%;}
    .brand-mark{width:32px;height:32px;border-radius:10px;}
    .brand-mark svg{width:18px;height:18px;}
    .brand h1{font-size:0.95rem;white-space:nowrap;}
    .controls{width:auto;flex:1 1 auto;justify-content:flex-end;gap:5px;flex-wrap:nowrap;}
    .lang-switch button{padding:7px 8px;font-size:0.74rem;}
    .icon-btn{padding:0 12px;min-height:44px;}
    #listToggle span{display:none;}            /* the icon says enough */
    #listToggle{padding:0 11px;}
    .search{flex:0 0 auto;}
    .search input{
      width:44px;max-width:none;padding-left:38px;padding-right:0;
      height:44px;cursor:pointer;
      transition:width .18s ease, padding-right .18s ease;
    }
    /* Typing takes the whole header row - 62vw left the suggestions
       narrower than their own text, and hung them off the screen edge. */
    .topbar.searching .controls > *:not(.search){display:none;}
    .topbar.searching .controls > #listToggle{display:none;}  /* beats #listToggle above */
    .topbar.searching .search{flex:1 1 100%;}
    .topbar.searching .search input{width:100%;padding-right:40px;cursor:text;}
    .search input:focus{width:100%;padding-right:40px;cursor:text;}
    .search > svg{left:14px;}
    .suggest{left:0;right:0;width:auto;max-width:none;max-height:min(46vh,320px);}
    .suggest-item .sub{max-width:40%;}
    .fav-toggle{padding:0 10px;min-height:44px;}

    /* The filters were costing a fifth of the screen before any map appeared,
       and still hid six of eight controls behind a sideways scroll. On a phone
       they move into a sheet instead: one slim button up here, and everything
       visible at once down there when you actually want it. */
    .filterbar-m{
      display:flex;align-items:center;gap:10px;
      padding:7px 12px;border-bottom:1px solid var(--border);
      background:var(--surface);
    }
    .filterbar-m .chip{min-height:40px;padding:0 13px;font-size:0.85rem;}
    .filterbar-m .icon{width:16px;height:16px;}
    .fb-count{
      margin-left:auto;font-size:0.78rem;color:var(--text-soft);
      font-variant-numeric:tabular-nums;
    }
    .filters{
      position:fixed;left:0;bottom:var(--kb, 0px);z-index:22;
      width:100%;max-height:82vh;max-height:82dvh;overflow-y:auto;
      flex-wrap:wrap;row-gap:9px;align-items:flex-start;
      padding:0 14px 16px;
      border-top:1px solid var(--border);border-bottom:0;
      border-radius:18px 18px 0 0;
      box-shadow:0 -6px 24px var(--shadow);
      transform:translateY(100%);
      transition:transform .22s cubic-bezier(.32,.72,0,1);
    }
    .filters.open{transform:translateY(0);}
    /* The visible line is 4px tall; the thing you can actually grab is the
       full-width band around it. */
    .filters-grab{
      display:block;flex:1 0 100%;width:100%;height:26px;
      position:relative;margin:0 0 2px;
      touch-action:none;cursor:grab;
    }
    .filters-grab::before{
      content:"";position:absolute;left:50%;top:11px;
      width:38px;height:4px;margin-left:-19px;
      border-radius:2px;background:var(--border);
    }
    /* Everything laid out, nothing scrolled sideways. */
    .filters-scroll{flex:1 1 100%;gap:7px;flex-wrap:wrap;overflow:visible;}
    .filters > .dd{flex:1 1 100%;margin-left:0;}
    .filters > .dd .dd-trigger{width:100%;max-width:none;justify-content:flex-start;}
    .filters > .dd .dd-chev{margin-left:auto;}
    #regionDD{margin-left:0;}
    #regionDD:not(.on) .dd-label{display:block;}
    #regionDD:not(.on) .dd-trigger{padding:0 13px;gap:8px;}
    .filter-sep,.filter-sep-pin{display:none;}
    .chip-clear{margin-left:0;}
    .chip-clear::before{display:none;}
    .filters-done{
      display:block;margin-left:auto;padding:11px 20px;
      border:1px solid var(--accent);border-radius:999px;
      background:var(--accent);color:var(--accent-ink);
      font-family:inherit;font-size:0.88rem;font-weight:600;cursor:pointer;
    }
    .chip{padding:0 12px;min-height:42px;font-size:0.84rem;gap:6px;}
    .chip .dot.cat-icon{width:16px;height:16px;}
    .chip .dot.cat-icon svg{width:16px;height:16px;}
    .chip-count{font-size:0.73rem;}
    .dd-trigger{padding:0 12px;min-height:42px;font-size:0.84rem;}
    .chip-clear{padding:0 13px;min-height:42px;}

    .map-inner{padding:4px 6px 38px;}
    /* The trigger shrinks to the month alone; the panel it opens comes up
       from the bottom like every other sheet on a phone. */
    .season-pill{left:10px;top:8px;padding:8px 12px;min-height:40px;gap:7px;}
    .season-kicker{font-size:0.82rem;}
    .season-month{font-size:0.7rem;padding:2px 7px;}
    .season-modal{
      left:0;top:auto;bottom:0;transform:none;
      width:100%;max-width:100%;max-height:82vh;
      max-height:82dvh;
      border:0;border-top:1px solid var(--border);
      border-radius:20px 20px 0 0;
    }
    .season-top{padding:14px 16px 12px;}
    .season-titles h2{font-size:1.2rem;}
    .season-body{padding:14px 16px;}
    .season-foot{padding:12px 16px 16px;}
    .season-link{max-width:none;}
    .map-zoom button{width:44px;height:44px;}

    /* Town names shrink with the map, or they cover half the country. */
    .city-labels span{font-size:10.5px;}
    .city-labels span.capital{font-size:11.5px;}
    .city-labels span.town{font-size:9.5px;}
    .city-labels.zoomed span{font-size:11.5px;}
    .city-labels.zoomed span.capital{font-size:13px;}
    .city-labels.zoomed span.town{font-size:10.5px;}

    /* ---- Farm list as a bottom sheet ----
       It sits fully off-screen until "Farmy" is tapped: a permanently peeking
       bar cost a strip of the map on every screen for something most visits

function trackEvent(path, title){
  try{
    if (window.goatcounter && typeof window.goatcounter.count === 'function'){
      window.goatcounter.count({ path: path, title: title || path, event: true });
    }
  }catch(e){}
}
(function(){

  /* Favourites live in this visitor's own browser - they are personal, and
     nobody else's view of the map changes because of them. */
  var FAVS = (function(){
    try { return new Set(JSON.parse(localStorage.getItem('cfa_favs') || '[]')); }
    catch(e){ return new Set(); }
  })();
  function saveFavs(){
    try { localStorage.setItem('cfa_favs', JSON.stringify(Array.from(FAVS))); } catch(e){}
  }
  function toggleFav(id, silent){
    var added = !FAVS.has(id);
    if (added) FAVS.add(id); else FAVS.delete(id);
    saveFavs();
    updateCounts();
    renderFarmLists();
    if (currentId === id) syncDrawerFav(id);
    if (!silent) showToast(added ? t('favAdded') : t('favRemoved'), id);
  }

  var toastTimer = null;

    undo.textContent = t('undo');

      name:"Biofarma Ko\u0161\u00EDk",
      town:{cs:"Tuchom 1, Ko\u0161\u00EDk (Nymbursko)", en:"Tuchom 1, Ko\u0161\u00EDk (Nymburk area)"},
      region:{cs:"St\u0159edo\u010Desk\u00FD kraj", en:"Central Bohemian Region"},
      lat:50.24, lon:15.17, cats:["meat","dairy","eggs","veggies"],
      tags:["ov\u010D\u00ED s\u00FDr","brynza","\u017Ein\u010Dica","o\u0161tiepok","mangalica","p\u0159e\u0161t\u00EDk","jehn\u011B\u010D\u00ED","sheep cheese","lamb"],
      story:{ cs:["Farma v \u00FAdol\u00ED asi 70 kilometr\u016F od Prahy, kterou jej\u00ED hospod\u00E1\u0159i popisuj\u00ED jako ostr\u016Fvek slovensk\u00FDch produkt\u016F ve st\u0159edn\u00EDch \u010Cech\u00E1ch.",
              "Za\u010Dalo to v roce 2006 s patn\u00E1cti romanovsk\u00FDmi ovcemi, kter\u00E9 sp\u00E1saly zarostl\u00E1 pole kolem chaloupky v Ko\u0161\u00EDku; po dvoulet\u00E9m p\u0159echodn\u00E9m obdob\u00ED farma v roce 2009 z\u00EDskala zna\u010Dku BIO.",
              "Prim hraje chov romanovsk\u00FDch a v\u00FDchodofri\u0161sk\u00FDch ovc\u00ED; p\u0159ibyly k nim kozy, prasata mangalica a p\u0159e\u0161t\u00EDk a kr\u00E1vy Jersey.",
              "Ov\u010D\u00ED s\u00FDry jsou sezonn\u00ED \u2014 od Velikonoc do Michala: hrudka, tvrd\u00FD s\u00FDr ement\u00E1lsk\u00E9ho typu, uzen\u00FD o\u0161tiepok, brynza a \u017Ein\u010Dica.",
              "Vedle ml\u00E9\u010Dn\u00FDch v\u00FDrobk\u016F nab\u00EDzej\u00ED jehn\u011B\u010D\u00ED a k\u016Fzle\u010D\u00ED maso, mlad\u00E9 vep\u0159ov\u00E9, klob\u00E1sky, uzenou slaninu, vejce, marmel\u00E1dy, nakl\u00E1danou zeleninu a chutney; podle sezony ovoce, zeleninu a brambory.",
              "V restauraci penzionu Tuchom va\u0159\u00ED jehn\u011B\u010D\u00ED na mnoho zp\u016Fsob\u016F, slovenskou kapustnicu i brynzov\u00E9 halu\u0161ky."],
          en:["A farm in a valley some 70 kilometres from Prague, which its keepers describe as an island of Slovak products in Central Bohemia.",
              "It began in 2006 with fifteen Romanov sheep grazing the overgrown fields around the family cottage in Ko\u0161\u00EDk; after a two-year conversion period the farm earned organic certification in 2009.",
              "Romanov and East Friesian sheep lead the way, joined since by goats, Mangalica and P\u0159e\u0161tice pigs and Jersey cows.",
              "The sheep cheeses are seasonal \u2014 from Easter to Michaelmas: fresh hrudka, a hard Emmental-style cheese, smoked o\u0161tiepok, bryndza and \u017Ein\u010Dica.",
              "Alongside the dairy they sell lamb and kid, young pork, sausages, smoked bacon, eggs, jams, pickled vegetables and chutneys, plus seasonal fruit, vegetables and potatoes.",
              "The restaurant at the Tuchom guesthouse cooks lamb many ways, along with Slovak kapustnica and bryndza halu\u0161ky."] } },

      story:{ cs:["Certifikovan\u00E1 BIO farma hospoda\u0159\u00EDc\u00ED v re\u017Eimu komunitou podporovan\u00E9ho zem\u011Bd\u011Blstv\u00ED (KPZ).",

                  "Pod\u00EDl se odeb\u00EDr\u00E1 na v\u00FDdejn\u00EDch m\u00EDstech v Libereck\u00E9m kraji, nebo p\u0159\u00EDmo na farm\u011B.",
                  "Kdo nechce celou sezonu, m\u016F\u017Ee si vz\u00EDt nepravidelnou bed\u00FDnku \u2014 mal\u00FD nebo velk\u00FD pytel podle toho, co je zrovna sklizen\u00E9.",
                  "Co je ten t\u00FDden k dispozici, hl\u00E1s\u00ED na Facebooku."],
              en:["A certified organic farm run as community-supported agriculture (CSA).",
                  "Organic vegetables and farm eggs; part of the soil work is still done with horses.",
                  "The main way in is a seasonal CSA share: MINI 4\u20137 kg every fortnight, STANDARD 4\u20137 kg weekly, DOUBLE 7\u201313 kg weekly.",
                  "Shares are collected at pickup points across the Liberec region, or at the farm itself.",
                  "If a whole season is too much, they also sell irregular boxes \u2014 a small or large bag of whatever has just been harvested.",
                  "What is ready each week goes up on Facebook."] } },

      region:{cs:"Plze\u0148sk\u00FD kraj", en:"Plze\u0148 Region"},
      lat:49.30, lon:13.30, cats:["veggies","eggs","honey"],
      website:"https://biofarmaludmila.cz/",
      story:{ cs:["\u0160umavsk\u00E1 BIO farma hospoda\u0159\u00EDc\u00ED bez orby (no-till).",
                  "Zelenina, ovoce, vejce, bylinky, med a \u0161\u0165\u00E1vy.",
              "Objedn\u00E1vku si m\u016F\u017Eete zdarma vyzvednout v provozovn\u011B v Javo\u0159\u00ED\u010Dku 2 u Str\u00E1\u017Eova; na adresu stoj\u00ED doprava 79 K\u010D a nad 1 000 K\u010D je zdarma.",
              "Zbo\u017E\u00ED expeduj\u00ED zpravidla do druh\u00E9ho dne, nejpozd\u011Bji do dvou kalend\u00E1\u0159n\u00EDch dn\u016F.",
              "Biofarmu Ludmila zalo\u017Eila v roce 2022 Ludmila von Winterfeldt \u2014 po p\u011Btadvaceti letech ve velkom\u011Bst\u011B vym\u011Bnila dob\u0159e placenou pr\u00E1ci za polorozpadlou chalupu v podh\u016F\u0159\u00ED \u0160umavy.",
              "Hospoda\u0159\u00ED na p\u016Fl hektaru v ekologick\u00E9m re\u017Eimu a bez chemie: zelenina roste na z\u00E1honech mezi ovocn\u00FDmi stromy, kolem nich\u017E stoj\u00ED v\u010Dely, slepice pasou tr\u00E1vu a hnoj\u00ED ji, kachny dr\u017E\u00ED na uzd\u011B plz\u00E1ky a podest\u00FDlka z kurn\u00EDku jde do kompostu.",
              "P\u016Fdu obd\u011Bl\u00E1vaj\u00ED bezorebn\u011B a kombinuj\u00ED mezidruhov\u00E9 plodiny, aby \u0161k\u016Fdci m\u011Bli p\u0159irozen\u00E9 nep\u0159\u00E1tele a porosty l\u00E9pe sn\u00E1\u0161ely sucho i d\u00E9\u0161\u0165."],
          en:["An organic, no-till farm in the \u0160umava mountains.",
                  "Vegetables, fruit, eggs, herbs, honey and juices.",
              "Orders can be collected free at the premises at Javo\u0159\u00ED\u010Dko 2 near Str\u00E1\u017Eov; delivery to an address costs 79 CZK and is free over 1,000 CZK.",
              "They usually dispatch by the next day, at most within two calendar days.",
              "Ludmila von Winterfeldt founded Biofarma Ludmila in 2022 \u2014 after twenty-five years in the city she traded a well-paid job for a half-ruined cottage in the \u0160umava foothills.",
              "She farms half a hectare organically and without chemicals: vegetables grow in beds among fruit trees with beehives around them, hens graze the grass and manure it, ducks keep the slugs down and the hen-house bedding goes to compost.",
              "The soil is worked no-till with mixed companion crops, so pests meet natural enemies and the beds cope better with both drought and rain."] } },

      lat:49.46, lon:18.14, cats:["dairy"],
      story:{ cs:["BIO ml\u00E9\u010Dn\u00E1 farma na Vala\u0161sku.",
                  "Rodinn\u00E9 hospod\u00E1\u0159stv\u00ED na zhruba 60 hektarech luk a pastvin v podh\u016F\u0159\u00ED Beskyd.",
                  "Ml\u00E9ko zpracov\u00E1vaj\u00ED ve vlastn\u00ED BIO miniml\u00E9k\u00E1rn\u011B p\u0159\u00EDmo na farm\u011B.",
                  "Ml\u00E9ko, podm\u00E1sl\u00ED ochucen\u00E9 i klasick\u00E9, syrov\u00E1tka, ky\u0161ka, jogurty, tvaroh, m\u00E1slo a s\u00FDry \u2014 \u010Derstv\u00E9, zraj\u00EDc\u00ED, uzen\u00E9, ko\u0159en\u011Bn\u00E9 i \u0159eck\u00E9.",
                  "Vedle samoobslu\u017En\u00E9 lednice stoj\u00ED automat na \u010Derstv\u00E9 ml\u00E9ko, v provozu denn\u011B od 8:00 do 18:00; v ned\u011Bli je odstaven\u00FD kv\u016Fli pravideln\u00E9mu \u010Di\u0161t\u011Bn\u00ED.",
                  "Automat nevrac\u00ED hotovost \u2014 na\u010Depuje p\u0159esn\u011B za vlo\u017Eenou \u010D\u00E1stku. Lahve jsou u n\u011Bj k dispozici, farma ale doporu\u010Duje p\u0159in\u00E9st si vlastn\u00ED sklen\u011Bnou.",
                  "Plat\u00ED se hotov\u011B do p\u0159ipraven\u00E9 pokladni\u010Dky, nebo bezhotovostn\u011B naskenov\u00E1n\u00EDm QR k\u00F3du.",
                  "Vlastn\u00ED e-shop nemaj\u00ED; nakupuje se na farm\u011B nebo ze samoobslu\u017En\u00E9 lednice."],
              en:["An organic dairy farm in the Wallachia region.",
                  "A family holding on roughly 60 hectares of meadows and pasture in the Beskydy foothills.",
                  "The milk is processed in their own small organic dairy right on the farm.",
                  "Milk, plain and flavoured buttermilk, whey, ky\u0161ka, yoghurt, tvaroh, butter and cheeses \u2014 fresh, aged, smoked, spiced and Greek-style.",
                  "Next to the self-service fridge stands a fresh-milk vending machine, running daily from 8:00 to 18:00; it is off on Sundays for its regular clean.",
                  "The machine gives no change \u2014 it pours exactly what you pay for. Bottles are provided, though the farm suggests bringing your own glass one.",
                  "Pay cash into the honesty box, or by scanning the QR code.",
                  "There is no e-shop; you buy at the farm or from the self-service fridge."] } },

      story:{
        cs:[
          "Farma v B\u00EDl\u00FDch Karpatech, kde podle vlastn\u00EDch slov hospoda\u0159ily generace sedl\u00E1k\u016F p\u0159ed nimi.",

          "A farm in the White Carpathians where, by their own account, generations of farmers worked the land before them.",

        ]

      story:{ cs:[
          "Rodinn\u00FD podnik v srdci Vala\u0161ska, kde se skot pase na horsk\u00FDch pastvin\u00E1ch.",
          "Vlastn\u00ED bour\u00E1rna a zpracov\u00E1n\u00ED: maso jde z pastvy rovnou k z\u00E1kazn\u00EDkovi, se zn\u00E1m\u00FDm p\u016Fvodem a ve vlastn\u00EDch chladic\u00EDch vozech.",
          "\u201EJsme p\u0159edev\u0161\u00EDm farm\u00E1\u0159i, ne prodejci\u201C \u2014 cel\u00FD \u0159et\u011Bzec od pastvy po v\u00FDdej si dr\u017E\u00ED farma sama.",
          "V e-shopu krom\u011B BIO hov\u011Bz\u00EDho najdete i region\u00E1ln\u00ED v\u00FDrobky sousedn\u00EDch hospod\u00E1\u0159\u016F z podh\u016F\u0159\u00ED B\u00EDl\u00FDch Karpat \u2014 \u0161\u0165\u00E1vy, marmel\u00E1dy a zava\u0159eniny.",
              "Maso prod\u00E1vaj\u00ED na p\u0159edobjedn\u00E1vku: nejd\u0159\u00EDv se sb\u00EDraj\u00ED objedn\u00E1vky, teprve pak jde zv\u00ED\u0159e na por\u00E1\u017Eku, zr\u00E1n\u00ED a bour\u00E1n\u00ED \u2014 d\u00EDky tomu se vyu\u017Eije cel\u00FD kus a nic se nepl\u00FDtv\u00E1.",
              "Rozv\u00E1\u017Eej\u00ED chlazen\u00FDm vozem po t\u0159ech tras\u00E1ch z Lide\u010Dka: na Zl\u00EDn, Krom\u011B\u0159\u00ED\u017E, Olomouc a Prost\u011Bjov; na Uhersk\u00FD Brod a Uhersk\u00E9 Hradi\u0161t\u011B; a na Vset\u00EDn, Vala\u0161sk\u00E9 Mezi\u0159\u00ED\u010D\u00ED, Ro\u017Enov a Ostravu \u2014 200 K\u010D.",
              "Do 20 km od trasy p\u0159ijedou za 250 K\u010D, nad 9 000 K\u010D je doprava zdarma. Mimo tuto oblast nezav\u00E1\u017Eej\u00ED \u2014 maso m\u00E1 podle nich z\u016Fstat ve sv\u00E9m regionu.",
              "Vyzvednout se d\u00E1 zdarma p\u0159\u00EDmo na farm\u011B, nebo za 75 K\u010D ve v\u00FDdejn\u00E1ch ODTADYMA a BEZOBAL\u00C1\u010C."],
          en:[
          "A family business in the heart of Wallachia, with cattle grazing on mountain pastures.",
          "Their own butchery and processing: the meat goes from pasture straight to the customer, traceable to its origin and carried in the farm's own refrigerated vans.",
          "\"We are farmers first, not sellers\" \u2014 the farm keeps the whole chain, from grazing to handover, in its own hands.",
          "Alongside organic beef the shop carries regional products from neighbouring growers in the White Carpathian foothills \u2014 juices, jams and preserves.",
              "The meat is sold against pre-orders: orders are collected first, and only then does the animal go to slaughter, ageing and butchering \u2014 so the whole carcass is used and nothing is wasted.",
              "They deliver in a chilled van on three routes out of Lide\u010Dko: to Zl\u00EDn, Krom\u011B\u0159\u00ED\u017E, Olomouc and Prost\u011Bjov; to Uhersk\u00FD Brod and Uhersk\u00E9 Hradi\u0161t\u011B; and to Vset\u00EDn, Vala\u0161sk\u00E9 Mezi\u0159\u00ED\u010D\u00ED, Ro\u017Enov and Ostrava \u2014 200 CZK.",
              "Up to 20 km off the route costs 250 CZK, and delivery is free over 9,000 CZK. They do not deliver beyond that area \u2014 the meat should stay in its own region.",
              "Collection is free at the farm, or 75 CZK at the ODTADYMA and BEZOBAL\u00C1\u010C pickup points."] } },

  region:{cs:"Kraj Vyso\u010Dina", en:"Vyso\u010Dina Region"},
  lat:49.7446, lon:15.6007, cats:["meat"],
  story:{ cs:["Farma Vojt\u011Bcha Svobody na samot\u011B mezi lesy u Nejep\u00EDna.",
              "Chovaj\u00ED skot plemene Dexter na pestr\u00FDch pastvin\u00E1ch, bez chemie.",
              "Prod\u00E1vaj\u00ED vyzr\u00E1l\u00E9 BIO hov\u011Bz\u00ED p\u0159\u00EDmo koncov\u00FDm z\u00E1kazn\u00EDk\u016Fm, ne velkoodb\u011Bratel\u016Fm.",
              "Maso rozv\u00E1\u017Eej\u00ED po trase \u010C\u00E1slav \u2013 Kol\u00EDn \u2013 \u00DAvaly \u2013 Praha \u2013 Humpolec a okol\u00ED.",
              "Maso se objedn\u00E1v\u00E1 p\u0159edem a prod\u00E1v\u00E1 v bal\u00ED\u010Dc\u00EDch \u2014 Classic, Deluxe a Exclusive \u2014 nebo samostatn\u011B ro\u0161t\u011Bnec a osso bucco; v\u0161echno vakuovan\u00E9 a ozna\u010Den\u00E9.",
              "Z\u00E1voz jede nej\u010Dast\u011Bji v p\u00E1tek po trase \u010C\u00E1slav 13:40, Kol\u00EDn 14:15, \u00DAvaly 15:00, Praha-\u010Cern\u00FD Most 16:00, Praha-Chodov 17:00 a Humpolec 18:30; p\u0159edat se d\u00E1 kdekoli na trase.",
              "Nov\u011B chystaj\u00ED i trasu na Brno a dovezou a\u017E na adresu do 25 km od v\u00FDdejn\u00EDch m\u00EDst za 100 K\u010D.",
              "Statek stoj\u00ED na samot\u011B mezi lesy u Nejep\u00EDna a v rodin\u011B je od konce 18. stolet\u00ED; Vojt\u011Bch Svoboda ho p\u0159evzal v roce 2015 po d\u011Bdovi a p\u0159e\u0161el od ovc\u00ED k masn\u00E9mu skotu.",
              "Prvn\u00ED kravky plemene Dexter dovezl ze Skotska, dal\u0161\u00ED pak z D\u00E1nska. Hospoda\u0159\u00ED bez chemie, s\u00E1z\u00ED na zdravou p\u016Fdu a zv\u00ED\u0159ata se do\u017E\u00EDvaj\u00ED nadpr\u016Fm\u011Brn\u00E9ho v\u011Bku."],
          en:["Vojt\u011Bch Svoboda's farm, off on its own among the woods near Nejep\u00EDn.",
              "They raise Dexter cattle on diverse pasture, with no chemicals on the land.",
              "Aged organic beef goes straight to individual customers rather than wholesalers.",
              "They deliver along a route through \u010C\u00E1slav, Kol\u00EDn, \u00DAvaly, Prague and Humpolec.",
              "Meat is ordered ahead and sold in packs \u2014 Classic, Deluxe and Exclusive \u2014 or as individual sirloin and osso bucco; everything vacuum-packed and labelled.",
              "The delivery run is usually on Friday: \u010C\u00E1slav 13:40, Kol\u00EDn 14:15, \u00DAvaly 15:00, Prague-\u010Cern\u00FD Most 16:00, Prague-Chodov 17:00 and Humpolec 18:30, and they will hand the meat over anywhere along it.",
              "A Brno route is in preparation, and they deliver to the door within 25 km of the pickup points for 100 CZK.",
              "The farmstead stands alone among woods near Nejep\u00EDn and has been in the family since the late 18th century; Vojt\u011Bch Svoboda took it over in 2015 from his grandfather and moved from sheep to beef cattle.",
              "He imported his first Dexter cows from Scotland and later more from Denmark. He farms without chemicals, builds the soil first, and his animals live well beyond the usual age."] } },

              "Vyr\u00E1b\u011Bj\u00ED v\u00FDhradn\u011B z BIO kravsk\u00E9ho ml\u00E9ka \u2014 farm\u00E1\u0159sk\u00E9 a smetanov\u00E9 jogurty, tvaroh, smetany, probiotick\u00FD n\u00E1poj, \u017Eerv\u00E9, cottage, kef\u00EDr, tvarohov\u00E9 dezerty a s\u00FDry od \u010Derstv\u00FDch p\u0159es pa\u0159en\u00E9 po polotvrd\u00E9.",
              "Bez konzervant\u016F, zahu\u0161\u0165ovadel, barviv, su\u0161en\u00E9ho ml\u00E9ka a stabiliz\u00E1tor\u016F: jen ml\u00E9ko, mikrobi\u00E1ln\u00ED kultury a sy\u0159idlo.",
              "Vedle ml\u00E9\u010Dn\u00FDch v\u00FDrobk\u016F nab\u00EDzej\u00ED BIO jehn\u011B\u010D\u00ED maso a jehn\u011B\u010D\u00ED i ov\u010D\u00ED uzeniny.",
              "Cel\u00FD sortiment maj\u00ED ka\u017Edou sobotu na pra\u017Esk\u00FDch trz\u00EDch; prod\u00E1vaj\u00ED tak\u00E9 p\u0159es Rohl\u00EDk, Scuk, Delmart, Sklizeno a dal\u0161\u00ED farm\u00E1\u0159sk\u00E9 obch\u016Fdky."],
          en:["The Kosa\u0159 family farm at Nov\u00FD Kn\u00EDn, where they keep pedigree Suffolk sheep and crossbred sheep for meat under organic rules.",
              "They came to dairying sideways: they were regular buyers of the BioVav\u0159inec dairy's sv. Barbora cheese, and when they heard it was closing, they took it over.",
              "Everything is made from organic cow's milk \u2014 farmhouse and cream yoghurts, tvaroh, creams, a probiotic drink, \u017Eerv\u00E9, cottage, kefir, curd desserts and cheeses from fresh through scalded to semi-hard.",
              "No preservatives, thickeners, colourings, milk powder or stabilisers: just milk, microbial cultures and rennet.",
              "Alongside the dairy they sell organic lamb and lamb and mutton charcuterie.",
              "The full range is at Prague markets every Saturday; they also sell through Rohl\u00EDk, Scuk, Delmart, Sklizeno and other farm shops."] } },
