<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Živé farmy</title>
<meta name="description" content="Mapa bio a regenerativních farem v Česku — 89 farem, u kterých se dá nakoupit maso, mléko a sýry, vejce a drůbež, zelenina i med.">
<link rel="canonical" href="https://zivefarmy.cz/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8C%BE</text></svg>">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zivefarmy.cz/">
<meta property="og:title" content="Živé farmy">
<meta property="og:description" content="Mapa bio a regenerativních farem v Česku — 89 farem, u kterých se dá nakoupit maso, mléko a sýry, vejce a drůbež, zelenina i med.">
<meta property="og:locale" content="cs_CZ">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F0E1;
    --surface:#FFFDF7;
    --surface-2:#EFE2C6;
    --surface-3:#E6D4AE;
    --text:#332619;
    --text-soft:#7C6A50;
    --border:#DECBA3;
    --pasture-fill:#DCE3C2;
    --pasture-fill-hover:#CCDAA9;
    --pasture-fill-active:#BCD3A2;
    --pasture-fill-muted:#EAF0DF;
    --pasture-stroke:#96AC76;
    --accent:#B2552A;
    --pin-fill:#B2552A;
    --accent-ink:#FFFFFF;
    --meat:#B2552A;
    --dairy:#5C7C8B;
    --eggs:#C38A30;
    --veg:#5B7A3A;
    --honey:#8A5A16;
    --shadow:rgba(51,38,25,0.16);
    --scrim:rgba(35,26,16,0.45);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:22px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E170F;
      --surface:#282015;
      --surface-2:#302719;
      --surface-3:#3A2F1E;
      --text:#EFE4CE;
      --text-soft:#B8A47E;
      --border:#48391F;
      --pasture-fill:#39452A;
      --pasture-fill-hover:#44512F;
      --pasture-fill-active:#4E6B3E;
      --pasture-fill-muted:#333B27;
      --pasture-stroke:#7C8B5980;
      --accent:#D97B45;
      --pin-fill:#D97B45;
      --accent-ink:#241505;
      --meat:#D97B45;
      --dairy:#8FB0BE;
      --eggs:#D9AA51;
      --veg:#8CAE6C;
      --honey:#C89246;
      --shadow:rgba(0,0,0,0.45);
      --scrim:rgba(8,6,3,0.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E170F;
    --surface:#282015;
    --surface-2:#302719;
    --surface-3:#3A2F1E;
    --text:#EFE4CE;
    --text-soft:#B8A47E;
    --border:#48391F;
    --pasture-fill:#39452A;
    --pasture-fill-hover:#44512F;
    --pasture-fill-active:#4E6B3E;
    --pasture-fill-muted:#333B27;
    --pasture-stroke:#7C8B5980;
    --accent:#D97B45;
    --pin-fill:#D97B45;
    --accent-ink:#241505;
    --meat:#D97B45;
    --dairy:#8FB0BE;
    --eggs:#D9AA51;
    --veg:#8CAE6C;
    --honey:#C89246;
    --shadow:rgba(0,0,0,0.45);
    --scrim:rgba(8,6,3,0.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Fraunces","Iowan Old Style",Georgia,serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }
  button{font-family:inherit;}
  a{color:var(--accent);}
  svg.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  svg.icon-filled{fill:currentColor;stroke:none;}

  .app{
    height:100vh;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 22px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(145deg,var(--veg),var(--dairy));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    color:#fff;
    box-shadow:0 3px 8px var(--shadow);
  }
  .brand-mark svg{width:22px;height:22px;stroke:#fff;}
  .brand h1{font-size:1.28rem;line-height:1.1;letter-spacing:-0.01em;}
  .tagline{margin:2px 0 0;font-size:0.82rem;color:var(--text-soft);}

  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .lang-switch{
    display:flex;border:1px solid var(--border);border-radius:999px;
    padding:3px;background:var(--surface-2);gap:2px;
  }
  .lang-switch button{
    border:none;background:none;color:var(--text-soft);
    font-size:0.78rem;font-weight:700;letter-spacing:0.03em;
    padding:5px 11px;border-radius:999px;cursor:pointer;
  }
  .lang-switch button.active{background:var(--accent);color:var(--accent-ink);}
  .search{position:relative;}
  .search > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-soft);width:16px;height:16px;}
  .search input{
    width:230px;max-width:48vw;
    padding:9px 12px 9px 34px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:0.88rem;
  }
  .search input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search input::placeholder{color:var(--text-soft);}

  .icon-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:0.86rem;font-weight:500;
    cursor:pointer;
  }
  .icon-btn:hover{background:var(--surface-3);}
  .icon-btn svg{width:16px;height:16px;}
  #listToggle{display:inline-flex;}
  #listToggle.on{background:var(--accent);border-color:transparent;color:var(--accent-ink);}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .fav-toggle{position:relative;padding:9px 11px;}
  .fav-toggle .dot.cat-icon{width:18px;height:18px;color:var(--text-soft);}
  .fav-toggle .dot.cat-icon svg{width:18px;height:18px;}
  .fav-toggle.active{background:var(--accent);border-color:transparent;}
  .fav-toggle.active .dot.cat-icon{color:#fff;}
  .fav-toggle .chip-count{
    position:absolute;top:-3px;right:-3px;
    min-width:17px;height:17px;padding:0 4px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:var(--accent-ink);
    font-size:0.66rem;font-weight:700;opacity:1;
  }
  .fav-toggle .chip-count:empty{display:none;}

  /* ---------- Filters ---------- */
  .filters{
    display:flex;align-items:center;
    padding:12px 22px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  /* Only the chips scroll; the clear button keeps its place beside them. */
  .filters-scroll{
    display:flex;gap:8px;align-items:center;
    flex:1;min-width:0;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .filters-scroll::-webkit-scrollbar{height:6px;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:0.85rem;font-weight:500;
    cursor:pointer;white-space:nowrap;flex-shrink:0;
    transition:transform .12s ease;
  }
  .chip:hover{transform:translateY(-1px);}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cat,var(--text-soft));flex-shrink:0;}
  .chip .dot.cat-icon{width:17px;height:17px;background:none;border-radius:0;color:var(--cat);display:inline-flex;align-items:center;justify-content:center;}
  .chip .dot.cat-icon svg{width:17px;height:17px;}
  .chip.active .dot.cat-icon{color:#fff;}
  .chip[data-cat="all"] .dot{background:conic-gradient(var(--meat) 0 25%,var(--dairy) 25% 50%,var(--eggs) 50% 75%,var(--veg) 75% 100%);}
  .chip.active{
    background:var(--cat,var(--accent));
    border-color:transparent;
    color:#fff;
  }
  .chip[data-cat="all"].active{background:var(--text);}
  .chip-count{
    font-variant-numeric:tabular-nums;
    font-size:0.76rem;
    opacity:0.75;
  }
  .filter-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 2px;}
  /* Filter dropdowns are built from the page's own parts rather than a native
     select, whose open list can't be styled to match. */
  .dd{position:relative;flex-shrink:0;}
  .dd[hidden]{display:none;}
  .dd-trigger{
    display:inline-flex;align-items:center;gap:8px;
    font-family:inherit;font-size:0.85rem;font-weight:500;
    color:var(--text);background:var(--surface-2);
    border:1px solid var(--border);border-radius:999px;
    padding:8px 13px 8px 15px;cursor:pointer;max-width:250px;
  }
  .dd-trigger .dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dd-icon{display:inline-flex;flex-shrink:0;opacity:0.85;}
  .dd-icon svg{width:15px;height:15px;}
  .dd.on .dd-icon{opacity:1;}
  /* Clearing is an action, not another filter - and it has to stay reachable:
     the chips scroll sideways, so this sits outside their track. */
  .chip-clear{
    position:relative;flex-shrink:0;margin-left:20px;
    background:var(--surface);
    border-color:var(--accent);
    color:var(--accent);font-weight:600;
    gap:8px;padding-left:12px;
  }
  .chip-clear::before{
    content:"";position:absolute;right:calc(100% + 10px);
    top:-7px;bottom:-7px;width:1px;background:var(--border);
  }
  .chip-clear:hover{
    background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  }
  .chip-clear .icon{width:14px;height:14px;stroke-width:2.2;opacity:0.9;}
  /* How many filters are live, as a counter rather than a trailing dot. */
  .chip-clear .chip-count{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 5px;border-radius:999px;
    background:var(--accent);color:var(--accent-ink);
    font-size:0.72rem;font-weight:700;opacity:1;
  }
  .chip-clear:hover .chip-count{background:var(--accent-ink);color:var(--accent);}
  .chip-clear .chip-count:empty{display:none;}
  .chip-clear[hidden]{display:none;}
  .dd-chev{width:14px;height:14px;flex-shrink:0;opacity:0.8;transition:transform .15s ease;}
  .dd.open .dd-chev{transform:rotate(180deg);}
  .dd-trigger:hover{background:var(--surface-3);}
  .dd-trigger:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .dd.on .dd-trigger{
    border-color:var(--accent);color:var(--accent);
    background:var(--surface-3);font-weight:600;
  }
  .dd-menu{
    position:fixed;z-index:40;
    min-width:230px;max-width:320px;max-height:340px;overflow-y:auto;
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;box-shadow:0 12px 30px var(--shadow);
    padding:6px;display:none;
  }
  .dd-menu.open{display:block;}
  .dd-opt{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:100%;padding:9px 12px;border:none;background:none;
    border-radius:10px;cursor:pointer;text-align:left;
    font-family:inherit;font-size:0.86rem;color:var(--text);
  }
  .dd-opt:hover,.dd-opt.focused{background:var(--surface-2);}
  .dd-opt[aria-selected="true"]{color:var(--accent);font-weight:600;background:var(--surface-3);}
  .dd-opt .dd-count{
    font-size:0.78rem;color:var(--text-soft);
    font-variant-numeric:tabular-nums;flex-shrink:0;
  }
  .dd-opt[aria-selected="true"] .dd-count{color:var(--accent);}
  .near-ring[hidden]{display:none;}
  .near-ring ellipse{
    fill:var(--accent);fill-opacity:0.10;
    stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4;
    vector-effect:non-scaling-stroke;
  }
  .near-ring circle{fill:var(--accent);stroke:var(--surface);stroke-width:2;vector-effect:non-scaling-stroke;}
  .picking .map-stage{cursor:crosshair;}
  .chip-near.active{background:var(--accent);border-color:transparent;color:#fff;}
  .chip-near .icon{width:15px;height:15px;}
  .farm-card .dist{
    margin-left:auto;align-self:center;flex-shrink:0;
    font-size:0.76rem;font-weight:600;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }

.chip-fav .dot.cat-icon{color:var(--accent);}
.chip-fav.active{background:var(--accent);border-color:transparent;color:#fff;}
.chip-fav.active .dot.cat-icon{color:#fff;}

.suggest{
  position:absolute;top:calc(100% + 6px);left:0;z-index:45;
  width:330px;max-width:80vw;max-height:340px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:0 12px 30px var(--shadow);padding:6px;
}
.suggest[hidden]{display:none;}
.suggest-group{
  padding:8px 12px 4px;font-size:0.68rem;font-weight:700;
  letter-spacing:0.07em;text-transform:uppercase;color:var(--text-soft);
}
.suggest-item{
  display:flex;align-items:flex-start;gap:9px;width:100%;
  padding:9px 12px;border:none;background:none;border-radius:10px;
  font-family:inherit;font-size:0.86rem;color:var(--text);
  text-align:left;cursor:pointer;line-height:1.35;
}
.suggest-item > span:first-of-type{flex:1;min-width:0;}
.suggest-item:hover,.suggest-item.focused{background:var(--surface-2);}
.suggest-item svg{width:15px;height:15px;flex-shrink:0;color:var(--text-soft);margin-top:2px;}
.suggest-item .sub{
  font-size:0.76rem;color:var(--text-soft);
  flex-shrink:0;max-width:45%;text-align:right;margin-top:1px;
}

/* The farm-gate line is a statement of fact, not somewhere to click. */
.shop-tag.own,.shop-tag.plain{
  border-style:dashed;border-color:var(--border);
  color:var(--text-soft);background:transparent;
  font-weight:500;cursor:default;gap:6px;
}
.shop-tag.own:hover,.shop-tag.plain:hover{background:transparent;}
.shop-tag.own svg{width:14px;height:14px;margin:0;opacity:0.8;}

/* Secondary action, but still clearly a button. */
.btn{background:var(--surface-3);border-color:transparent;}
.btn:hover{background:var(--surface-2);}
.btn.primary:hover{background:var(--accent);}

.fav-btn{
  margin-left:auto;align-self:flex-start;flex-shrink:0;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;background:none;cursor:pointer;
  color:var(--text-soft);
}
.fav-btn:hover{background:var(--surface);color:var(--accent);}
/* Hearts stop shouting from every row: they appear on hover or focus and
   stay put once a farm is actually saved. Touch devices keep them on. */
@media (hover:hover){
  .fav-btn{opacity:0;transition:opacity .15s ease;}
  .farm-card:hover .fav-btn,
  .farm-card:focus-within .fav-btn,
  .fav-btn.on{opacity:1;}
}
.fav-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;}
.fav-btn.on{color:var(--accent);}
.fav-btn.on svg{fill:currentColor;stroke:currentColor;}
.d-fav{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 15px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface-2);
  color:var(--text);font-family:inherit;font-size:0.86rem;font-weight:600;
}
.d-fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;}
.d-fav.on{border-color:var(--accent);color:var(--accent);}
.d-fav.on svg{fill:currentColor;}

  /* ---------- Layout ---------- */
  .layout{
    flex:1;
    display:grid;
    grid-template-columns:1fr;
    min-height:0;
  }
  .layout.list-open{grid-template-columns:300px 1fr;}

  .sidebar{
    display:none;
    border-right:1px solid var(--border);
    background:var(--surface);
    overflow-y:auto;
    min-height:0;
    padding:14px;
    flex-direction:column;
    gap:10px;
  }
  .layout.list-open .sidebar{display:flex;}
  .sidebar-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:2px 4px 8px;
    border-bottom:1px solid var(--border);
    font-size:0.72rem;font-weight:700;letter-spacing:0.07em;
    text-transform:uppercase;color:var(--text-soft);
  }
  .sidebar-count{font-variant-numeric:tabular-nums;letter-spacing:0;margin-left:auto;}
  .sort-row{display:inline-flex;gap:3px;}
  .sort-btn{
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--text-soft);font-family:inherit;
    font-size:0.64rem;font-weight:700;letter-spacing:0.04em;
    padding:3px 8px;border-radius:999px;cursor:pointer;text-transform:none;
  }
  .sort-btn:hover{background:var(--surface-3);}
  .sort-btn.active{background:var(--accent);border-color:transparent;color:var(--accent-ink);}
  .farm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .farm-card{
    display:flex;align-items:flex-start;gap:10px;
    width:100%;
    text-align:left;
    padding:10px 11px;
    border-radius:var(--radius-md);
    border:1px solid var(--border);
    background:var(--surface-2);
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .farm-card:hover{background:var(--surface-3);}
  .farm-card.active{border-color:var(--accent);background:var(--surface-3);}
  .farm-card .swatch{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;margin-top:1px;
  }
  .farm-card .swatch svg{width:16px;height:16px;fill:#fff;stroke:none;}
  .farm-card .meta{min-width:0;display:flex;flex-direction:column;gap:3px;}
  .farm-card .name{display:block;font-weight:600;font-size:0.92rem;line-height:1.25;}
  .farm-card .town{
    display:flex;align-items:flex-start;gap:5px;
    font-size:0.78rem;color:var(--text-soft);line-height:1.3;
  }
  .farm-card .town svg{width:12px;height:12px;flex-shrink:0;margin-top:1px;stroke:currentColor;fill:none;}
  .farm-card.hidden{display:none;}
  .empty-state{
    padding:22px 10px;text-align:center;color:var(--text-soft);font-size:0.86rem;
  }
  .sidebar-footnote{
    margin-top:auto;
    font-size:0.76rem;
    color:var(--text-soft);
    line-height:1.5;
    padding-top:10px;
    border-top:1px solid var(--border);
  }

  /* ---------- Map ---------- */
  .map-wrap{
    position:relative;
    touch-action:none;
    min-height:0;
    background:
      radial-gradient(ellipse at 30% 15%, var(--surface-2), var(--bg) 60%);
    overflow:hidden;
  }
  .map-inner{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:30px 22px 58px;
  }
  .map-stage{
    position:relative;
    width:min(1100px, 100%);
    max-height:100%;
    aspect-ratio:900/532.92;
    transform-origin:0 0;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
  }
  .map-stage > svg{width:100%;height:100%;display:block;overflow:visible;}
  .map-stage path.region{
    fill:var(--pasture-fill);
    stroke:var(--pasture-stroke);
    stroke-width:1.1;
    cursor:pointer;
    vector-effect:non-scaling-stroke;
    transition:fill .15s ease;
  }
  .map-stage path.region:hover{fill:var(--pasture-fill-hover);}
  /* With a region chosen, it goes a deeper green and the rest fade back. */
  .regions.has-selection path.region{fill:var(--pasture-fill-muted);}
  .regions.has-selection path.region:hover{fill:var(--pasture-fill-hover);}
  .map-stage path.region.selected,
  .regions.has-selection path.region.selected:hover{
    fill:var(--pasture-fill-active);
    stroke:var(--accent);
  }
  /* Drawn above every region so no neighbour can paint over it. */
  .region-outline{
    fill:none;stroke:var(--accent);stroke-width:2.2;
    stroke-linejoin:round;pointer-events:none;
    vector-effect:non-scaling-stroke;
  }
  .cities{pointer-events:none;}
  .cities circle{
    fill:var(--text-soft);opacity:0.55;
    stroke:var(--surface);stroke-width:calc(1.4px / var(--zoom-scale,1));
  }
  /* Every label sits on a halo in the page's surface colour, so it reads over
     pale pasture and over the deep green of a selected region alike. The halo
     stays thin relative to the glyphs &#8212; a heavy one turns small text to mush. */
  .cities text{
    fill:#2F5D45;
    font-family:"Work Sans",sans-serif;font-weight:650;
    letter-spacing:0.01em;
    font-size:calc(12px / var(--zoom-scale,1));
    paint-order:stroke fill;
    stroke:var(--surface);
    stroke-width:calc(2.6px / var(--zoom-scale,1));
    stroke-linejoin:round;
    stroke-opacity:0.92;
  }
  .cities .capital circle{fill:var(--text);opacity:0.9;}
  .cities .capital text{font-weight:800;font-size:calc(13.5px / var(--zoom-scale,1));}
  /* District towns only earn their space once you are zoomed in. */
  .cities .town{opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .cities.zoomed .town{opacity:1;}
  .cities .town.off-focus{display:none;}
  .cities .town circle{fill:var(--text-soft);opacity:0.65;}
  .cities .town text{font-size:calc(10.5px / var(--zoom-scale,1));font-weight:600;}
  /* Zoomed in there is room to read, so labels grow on screen instead of
     holding their size, and the halo grows only a little with them. */
  /* Zoomed in, labels flip to white on a dark halo &#8212; the map-label convention
     that stays readable over the deep green of a selected region and over the
     pale pasture around it, in either theme. */
  .cities.zoomed text{
    font-size:max(6.5px, calc(16px / var(--zoom-scale,1)));
    fill:#24503A;
    stroke:var(--surface);
    stroke-width:max(1.7px, calc(3.4px / var(--zoom-scale,1)));
    stroke-opacity:0.96;
  }
  .cities.zoomed circle{fill:#24503A;stroke:var(--surface);opacity:0.95;}
  .cities.zoomed .capital text{font-size:max(7.4px, calc(18px / var(--zoom-scale,1)));}
  .cities.zoomed .town text{font-size:max(6px, calc(14px / var(--zoom-scale,1)));font-weight:600;}
  /* Zoomed in, the farms that match keep their name showing. */
  /* Zoomed in, the pins speak for themselves - a name appears on hover,
     focus or selection, so the region stays readable. */
  .pin.selected .pin-tip{opacity:1;transform:translateX(-50%) translateY(0);}

  .pins{position:absolute;inset:0;pointer-events:none;}
  .pin{
    position:absolute;
    transform:translate(-50%,-100%);
    pointer-events:auto;
    background:none;border:none;padding:0;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;
    filter:drop-shadow(0 2px 4px var(--shadow));
    transition:transform .15s ease, opacity .15s ease;
    z-index:1;
  }
  .pin{transform-origin:50% 100%;transform:translate(-50%,-100%) scale(calc(1 / var(--zoom-scale,1)));}
  .pin:hover,.pin:focus-visible{transform:translate(-50%,-100%) scale(calc(1.16 / var(--zoom-scale,1)));z-index:5;}
  .pin:focus-visible{outline:none;}
  /* Farms outside the current filter leave the map entirely &#8212; a greyed-out
     layer underneath read as noise. */
  .pin.dim{display:none;}
  .pin.hovered{z-index:5;transform:translate(-50%,-100%) scale(calc(1.2 / var(--zoom-scale,1)));}
  .pin.faded{opacity:0.28;}
  .pin.faded .pin-tip{opacity:0 !important;}
  .pin.hovered .pin-outline{stroke:var(--surface);stroke-width:2.6;}
  .pin.hovered{filter:drop-shadow(0 4px 9px var(--shadow)) drop-shadow(0 1px 2px var(--shadow));}
  .pins.zoomed .pin{transform:translate(-50%,-100%) scale(calc(1.32 / var(--zoom-scale,1)));}
  .pins.zoomed .pin:hover,
  .pins.zoomed .pin:focus-visible{transform:translate(-50%,-100%) scale(calc(1.5 / var(--zoom-scale,1)));}
  .pins.zoomed .pin.hovered{transform:translate(-50%,-100%) scale(calc(1.55 / var(--zoom-scale,1)));}
  @media (pointer:coarse){
    .pin{filter:none;}
    .pin.hovered,.pin:hover{filter:none;}
    .pin-badge .pin-outline{stroke-width:2.6;}
  }
  .pin.selected{z-index:6;filter:drop-shadow(0 0 5px var(--accent)) drop-shadow(0 3px 6px var(--shadow));}
  .pin-badge{width:29px;height:36px;display:block;}
  .pin.selected .pin-badge .pin-outline{stroke:var(--text);stroke-width:3;}
  .pin-tip{
    position:absolute;
    bottom:calc(100% + 6px);
    left:50%;transform:translateX(-50%) translateY(4px);
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
    box-shadow:0 4px 12px var(--shadow);
    font-size:0.73rem;font-weight:600;letter-spacing:0.01em;
    padding:5px 10px;border-radius:9px;
    white-space:nowrap;
    opacity:0;pointer-events:none;
    transition:opacity .12s ease, transform .12s ease;
  }
  .pin:hover .pin-tip,.pin:focus-visible .pin-tip{opacity:1;transform:translateX(-50%) translateY(0);}
  .pin.tip-below .pin-tip{bottom:auto;top:calc(100% + 6px);transform:translateX(-50%) translateY(-4px);}
  .pin.tip-below:hover .pin-tip,.pin.tip-below:focus-visible .pin-tip{transform:translateX(-50%) translateY(0);}

  .map-reset{
    position:absolute;right:18px;bottom:14px;
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 15px;border-radius:999px;
    border:1px solid var(--accent);background:var(--surface);
    color:var(--accent);font-size:0.83rem;font-weight:600;cursor:pointer;
    box-shadow:0 2px 10px var(--shadow);
  }
  .map-zoom{
    position:absolute;right:18px;bottom:62px;
    display:flex;flex-direction:column;
    border:1px solid var(--border);border-radius:12px;
    background:var(--surface);overflow:hidden;
    box-shadow:0 2px 10px var(--shadow);
  }
  .map-zoom button{
    width:38px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border:none;background:none;color:var(--text);cursor:pointer;
  }
  .map-zoom button + button{border-top:1px solid var(--border);}
  .map-zoom button:hover:not(:disabled){background:var(--surface-3);}
  .map-zoom button:disabled{opacity:0.35;cursor:default;}
  .map-zoom svg{width:17px;height:17px;}
  .map-reset[hidden]{display:none;}
  .map-reset:hover{background:var(--surface-3);}
  .map-reset svg{width:15px;height:15px;}
  .map-caption{
    position:absolute;left:18px;bottom:14px;
    font-size:0.74rem;color:var(--text-soft);
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    padding:5px 10px;border-radius:999px;
    border:1px solid var(--border);
  }

  /* ---------- Scrim & Drawer ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  z-index:60;display:flex;align-items:center;gap:14px;
  padding:11px 14px 11px 18px;border-radius:999px;
  background:var(--text);color:var(--bg);
  font-size:0.86rem;font-weight:600;
  box-shadow:0 8px 26px var(--shadow);
  opacity:0;transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast[hidden]{display:none;}
.toast button{
  border:none;background:none;color:var(--bg);
  font-family:inherit;font-size:0.82rem;font-weight:700;
  text-decoration:underline;cursor:pointer;padding:0;opacity:0.85;
}
.toast button:hover{opacity:1;}
  .scrim{
    position:fixed;inset:0;background:var(--scrim);
    opacity:0;pointer-events:none;transition:opacity .18s ease;
    z-index:20;
  }
  .scrim.show{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;left:50%;top:50%;
    width:min(680px, calc(100vw - 56px));
    max-height:min(88vh, 940px);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:0 24px 64px var(--shadow);
    transform:translate(-50%,-48%) scale(0.98);
    opacity:0;pointer-events:none;
    transition:opacity .18s ease, transform .18s cubic-bezier(.32,.72,0,1);
    z-index:21;
    overflow-y:auto;
  }
  .drawer.open{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;pointer-events:auto;
  }
.drawer-tools{
  position:sticky;top:0;z-index:2;
  display:flex;justify-content:flex-end;gap:8px;
  padding:12px 12px 0;margin-bottom:-38px;
  pointer-events:none;
}
.drawer-tool{
  pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
/* A finger is not a cursor: on touch the buttons grow to a size that can
   actually be hit, and stop sharing an edge with each other. */
@media (pointer:coarse){
  .drawer-tools{gap:12px;padding:14px 14px 0;margin-bottom:-46px;}
  .drawer-tool{width:44px;height:44px;}
  .drawer-tool svg{width:20px;height:20px;}
  .d-cats{padding-right:110px;}
}
.drawer-tool:hover{background:var(--surface-3);}
.drawer-tool svg{width:17px;height:17px;}
/* Saved farms keep a filled heart; the rest show an outline. */
#drawerFav svg{fill:none;stroke:currentColor;stroke-width:1.9;transition:transform .18s ease;}
#drawerFav:hover svg{transform:scale(1.12);}
#drawerFav.on{color:var(--accent);border-color:var(--accent);background:var(--surface);}
#drawerFav.on svg{fill:currentColor;}
  .drawer-content{padding:20px 26px 32px;}

  .mobile-list-drawer{
    position:fixed;top:0;left:0;height:100%;width:340px;max-width:88vw;
    background:var(--surface);
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);
    z-index:21;overflow-y:auto;padding:14px;
    display:none;
  }
  .mobile-list-drawer.open{transform:translateX(0);}

  /* ---------- Drawer content ---------- */
  .cert-pill{

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .cert-bio{background:#33452A;color:#C6DCAB;border-color:#55703F;}
  }
  :root[data-theme="dark"] .cert-bio{background:#33452A;color:#C6DCAB;border-color:#55703F;}
  .d-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:86px;}
  .d-cat-pill{
    font-size:0.72rem;font-weight:600;color:#fff;
    padding:4px 10px;border-radius:999px;
  }

  .d-loc{
    display:inline-flex;align-items:center;gap:6px;

    text-decoration:none;border-bottom:1px solid transparent;

  .d-loc svg{width:15px;height:15px;flex-shrink:0;}
  .d-loc svg:last-child{width:12px;height:12px;opacity:0.7;}
  .drawer h3{
    font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;
    color:var(--text-soft);font-family:"Work Sans",sans-serif;font-weight:700;
    margin:22px 0 10px;
  }
  .d-story{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;}
  .d-story li{
    position:relative;padding-left:18px;font-size:0.92rem;line-height:1.5;
  }
  .d-story li::before{
    content:"";position:absolute;left:0;top:0.55em;
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
  }
  .d-shops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:2px;}
  .d-shops + .d-fact{margin-top:13px;}
  .ship-note{

    color:var(--text-soft);
  }
  .ship-note + .d-fact{margin-top:13px;}
  /* A stated fact about the farm - deliberately not shaped like the links. */
  .d-fact{
    display:flex;align-items:flex-start;gap:7px;
    margin:0;font-size:0.84rem;line-height:1.45;color:var(--text-soft);
  }

  .d-fact span{color:var(--text);font-weight:600;}
  .d-fact-sub{margin-top:10px;}

  .d-fact-sub strong{color:var(--text);font-weight:600;}
  .d-buy{margin-right:2px;padding:8px 15px;font-size:0.84rem;}
  .shop-tag{
    display:inline-flex;align-items:center;
    padding:6px 12px;border-radius:999px;

    border:1px solid var(--accent);color:var(--accent);background:transparent;

  .shop-tag:hover{background:var(--surface-3);}
  .shop-tag .icon{width:11px;height:11px;margin-left:5px;opacity:0.65;}
.d-hours{
  margin:12px 0 0;padding:11px 13px;
  border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--surface-2);
}
.d-hours-head{
  display:flex;align-items:center;gap:7px;margin:0 0 6px;
  font-size:0.68rem;font-weight:700;letter-spacing:0.07em;
  text-transform:uppercase;color:var(--text-soft);
}
.d-hours-head svg{width:14px;height:14px;flex-shrink:0;}
.hours-group + .hours-group{margin-top:9px;}
.d-hours-place,.hours-where{
    display:inline-flex;align-items:flex-start;gap:5px;
    margin:0 0 3px;font-size:0.78rem;line-height:1.45;font-weight:500;
    color:var(--text-soft);text-decoration:none;
  }
  .d-hours-place{border-bottom:1px solid var(--border);}
  .d-hours-place:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .d-hours-place svg{width:11px;height:11px;flex-shrink:0;margin-top:3px;opacity:0.7;}
.d-hours-rows{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;}
.d-hours-rows li{
  font-size:0.86rem;color:var(--text);font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.45;
}
.hours-qual{font-weight:400;color:var(--text-soft);}
/* Remarks are context, not a timing - they read as a sentence, not as data. */
.hours-note{
  margin:8px 0 0;padding-top:8px;
  border-top:1px solid var(--border);
  font-size:0.82rem;font-weight:400;line-height:1.55;

}

  margin-top:0;padding-top:0;border-top:0;
}
  /* The next pickup or delivery window, resolved against today. It gets a
     card of its own because it is the one date the visitor has to act on;
     everything else folds away behind a summary. */
  .d-slots{
    margin-top:12px;padding:13px 15px 12px;
    border-radius:var(--radius-md);
    background:var(--pasture-fill);
    border:1px solid var(--pasture-stroke);
  }

    color:var(--text-soft);

    font-variant-numeric:tabular-nums;
  }
  .slot-place{
    display:inline-flex;align-items:center;gap:6px;margin-top:7px;

  .slot-place svg{width:13px;height:13px;flex-shrink:0;color:var(--text-soft);}

    font-size:0.78rem;font-weight:600;color:#7A5A12;

    display:inline-flex;align-items:center;gap:8px;
    padding:10px 16px;border-radius:999px;
    font-size:0.88rem;font-weight:600;text-decoration:none;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn svg{width:16px;height:16px;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .d-contacts{display:flex;flex-direction:column;gap:8px;margin-top:2px;}
  .contact-line{
    display:flex;align-items:center;gap:10px;
    padding:9px 13px;border-radius:var(--radius-md);
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);text-decoration:none;font-size:0.88rem;
  }
  .contact-line:hover{background:var(--surface-3);border-color:var(--accent);color:var(--accent);}
  .contact-line svg{width:15px;height:15px;flex-shrink:0;color:var(--text-soft);}
  .contact-line span{word-break:break-word;}
  .d-contact{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .contact-btn{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  }
  .contact-btn svg{width:17px;height:17px;}
  .contact-btn:hover{background:var(--surface-3);}

  /* ---------- Responsive ---------- */
  @media (max-width:960px){
    .layout{grid-template-columns:1fr;}
    .sidebar{display:none;}
    .mobile-list-drawer{display:block;}
    #listToggle{display:inline-flex;}
    .search input{width:150px;}
    .tagline{display:none;}
    /* Too narrow to centre a card: it comes up from the bottom instead. */
    .drawer{width:100%;max-width:100%;left:0;top:auto;bottom:0;
      height:86vh;max-height:86vh;
      border:none;border-top:1px solid var(--border);
      border-radius:20px 20px 0 0;
      transform:translateY(100%);opacity:1;pointer-events:auto;
      transition:transform .22s cubic-bezier(.32,.72,0,1);
    }
    .drawer.open{transform:translateY(0);}
    .drawer::before{
      content:"";display:block;width:38px;height:4px;border-radius:2px;
      background:var(--border);margin:10px auto 2px;
    }
  }

  /* Phone layout: stack the header, let search take the width, keep taps big. */
  @media (max-width:600px){
    .topbar{padding:10px 14px;gap:9px;}

    .map-caption{left:10px;bottom:10px;}
    .drawer-content{padding:14px 18px 28px;}
    .drawer h2{font-size:1.3rem;}
    .d-story li{font-size:0.88rem;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:0.01ms !important;}
  }

    catch(e){ return new Set(); }
  })();
  function saveFavs(){
    try { localStorage.setItem('cfa_favs', JSON.stringify(Array.from(FAVS))); } catch(e){}
  }
  function toggleFav(id, silent){
    var added = !FAVS.has(id);
    if (added) FAVS.add(id); else FAVS.delete(id);
    saveFavs();
    updateCounts();
    renderFarmLists();
    if (currentId === id) syncDrawerFav(id);
    if (!silent) showToast(added ? t('favAdded') : t('favRemoved'), id);
  }

  var toastTimer = null;
  function showToast(msg, undoId){
    var box = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    var undo = document.getElementById('toastUndo');
    undo.hidden = !undoId;
    undo.textContent = t('undo');
    undo.onclick = function(){ toggleFav(undoId, true); hideToast(); };
    box.hidden = false;
    requestAnimationFrame(function(){ box.classList.add('show'); });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 3600);

      website:"https://www.hornackafarma.cz/",
      story:{
        cs:[
          "Farma v B\u00EDl\u00FDch Karpatech, kde podle vlastn\u00EDch slov hospoda\u0159ily generace sedl\u00E1k\u016F p\u0159ed nimi.",
          "Hospoda\u0159\u00ED bez chemick\u00FDch hnojiv a post\u0159ik\u016F, s c\u00EDlem p\u0159edat pole v lep\u0161\u00ED kondici, ne\u017E je p\u0159evzali.",

        ],
        en:[
          "A farm in the White Carpathians where, by their own account, generations of farmers worked the land before them.",
          "They farm without chemical fertilisers or sprays, aiming to hand the fields on in better shape than they found them.",

        ]
      } },

  (function spreadOverlappingPins(){
    var placed = [];
    var minDx = 2.3, minDy = 3.9, aspect = VB_W / VB_H;
    FARMS.forEach(function(f){
      var baseX = parseFloat(f.leftPct), baseY = parseFloat(f.topPct);
      var x = baseX, y = baseY, tries = 0, angle = 0;
      function collides(){
        return placed.some(function(p){
          return Math.abs(p.x - x) < minDx && Math.abs(p.y - y) < minDy;
        });
      }
      while (collides() && tries < 24){
        angle += 1.1;
        var r = 1.1 + tries * 0.22;
        x = baseX + Math.cos(angle) * r;
        y = baseY + Math.sin(angle) * r * aspect;
        tries++;

  (f.awards || []).forEach(function(a){ parts.push(a.cs, a.en); });
  (f.sellers || []).forEach(function(x){ parts.push(x.name); });
  (f.tags || []).forEach(function(x){ parts.push(x); });
  if (f.hours) parts.push(f.hours.cs, f.hours.en);
  f._hay = fold(parts.filter(Boolean).join(' '));
  return f._hay;
}

function matches(f){
    if (onlyFavs && !FAVS.has(f.id)) return false;
    if (nearActive && userLoc && farmDistance(f) > nearRadiusKm()) return false;
    var catOk = !activeCats.length || f.cats.some(function(c){ return activeCats.indexOf(c) !== -1; });
    var chanOk = activeChannel === 'all' || farmChannels(f).indexOf(activeChannel) !== -1;
    var regionOk = activeRegion === 'all' || f.region.cs === activeRegion;
    var delivOk = activeDelivery === 'all' || (f.delivery || []).indexOf(activeDelivery) !== -1;
    var q = searchQuery.trim().toLowerCase();
    var textOk = !q || farmHaystack(f).indexOf(fold(q)) !== -1;
    return catOk && chanOk && regionOk && delivOk && textOk;
  }

  function renderDeliveryOptions(){
    var counts = {};
    FARMS.forEach(function(f){ (f.delivery || []).forEach(function(d){ counts[d] = (counts[d] || 0) + 1; }); });
    var opts = [{ value:'all', label:(activeDelivery === 'all' ? t('deliveryLabel') : t('deliveryAll')), count:FARMS.length }];
    DELIVERY.forEach(function(d){
      if (!counts[d]) return;
      opts.push({ value:d, label:t('deliveryNames')[d], count:counts[d] });
    });
    deliveryDD.set(opts, activeDelivery);
    deliveryDD.setOn(activeDelivery !== 'all');
  }

  function renderRegionOptions(){
    var counts = {};
    FARMS.forEach(function(f){ counts[f.region.cs] = (counts[f.region.cs] || 0) + 1; });
    var opts = [{ value:'all', label:(activeRegion === 'all' ? t('regionLabel') : t('regionAll')), count:FARMS.length }];
    REGION_LIST.forEach(function(r){
      opts.push({ value:r.cs, label:r[LANG], count:counts[r.cs] || 0 });
    });
    regionDD.set(opts, activeRegion);
    regionDD.setOn(activeRegion !== 'all');
  }

  /* Minimal listbox: a pill trigger plus a menu in the page's own styling.
     The menu lives on <body> because the filter bar scrolls and would clip it. */
  function makeDropdown(hostId, onSelect){
    var host = document.getElementById(hostId);
    var trigger = host.querySelector('.dd-trigger');
    var labelEl = host.querySelector('.dd-label');
    var menu = document.createElement('div');
    menu.className = 'dd-menu';
    menu.setAttribute('role', 'listbox');
    document.body.appendChild(menu);

    var options = [], value = null, focusIdx = -1;

    function close(){
      menu.classList.remove('open');
      host.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
      focusIdx = -1;
    }
    function open(){
      menu.classList.add('open');
      var r = trigger.getBoundingClientRect();
      var w = menu.offsetWidth;
      menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
      menu.style.top = (r.bottom + 6) + 'px';
      host.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
      var sel = menu.querySelector('[aria-selected="true"]');
      if (sel) sel.scrollIntoView({ block:'nearest' });
    }
    function isOpen(){ return menu.classList.contains('open'); }

    function paint(){
      menu.innerHTML = options.map(function(o, i){
        return '<button type="button" class="dd-opt" role="option" data-i="'+i+'"' +
               ' aria-selected="'+(o.value === value)+'">' +
               '<span>'+o.label+'</span>' +
               (o.count === undefined ? '' : '<span class="dd-count">'+o.count+'</span>') +
               '</button>';
      }).join('');
      var cur = options.filter(function(o){ return o.value === value; })[0];
      labelEl.textContent = cur ? cur.label : '';
    }

    menu.addEventListener('click', function(e){
      var opt = e.target.closest('.dd-opt');
      if (!opt) return;
      close();
      onSelect(options[parseInt(opt.dataset.i, 10)].value);
    });
    trigger.addEventListener('click', function(){ isOpen() ? close() : open(); });
    trigger.addEventListener('keydown', function(e){
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if (!isOpen()) open(); }
    });
    document.addEventListener('keydown', function(e){
      if (!isOpen()) return;
      var opts = [].slice.call(menu.querySelectorAll('.dd-opt'));
      if (e.key === 'Escape'){ close(); trigger.focus(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        e.preventDefault();
        focusIdx = Math.max(0, Math.min(opts.length - 1, focusIdx + (e.key === 'ArrowDown' ? 1 : -1)));
        opts.forEach(function(o, i){ o.classList.toggle('focused', i === focusIdx); });
        opts[focusIdx].scrollIntoView({ block:'nearest' });
      } else if (e.key === 'Enter' && focusIdx >= 0){
        e.preventDefault();
        close();
        onSelect(options[focusIdx].value);
      }
    });
    document.addEventListener('click', function(e){
      if (isOpen() && !menu.contains(e.target) && !host.contains(e.target)) close();
    });
    window.addEventListener('resize', close);
    document.getElementById('filterBar').addEventListener('scroll', close);

    return {
      set:function(opts, val){ options = opts; value = val; paint(); },
      value:function(){ return value; },
      setOn:function(on){ host.classList.toggle('on', on); },
      host:host
    };
  }

  var channelDD = makeDropdown('channelDD', function(v){
    activeChannel = v;
    renderChannelOptions();
    applyFilters();
  });
  var regionDD = makeDropdown('regionDD', function(v){ setRegion(v); });
  var deliveryDD = makeDropdown('deliveryDD', function(v){
    activeDelivery = v;
    renderDeliveryOptions();
    applyFilters();
  });
  var nearDD = makeDropdown('nearDD', function(v){
    nearMinutes = parseInt(v, 10);

  });

  function renderChannelOptions(){
    var counts = {};
    CHANNELS.forEach(function(c){ counts[c] = 0; });
    FARMS.forEach(function(f){
      farmChannels(f).forEach(function(c){ counts[c] = (counts[c] || 0) + 1; });
    });
    var opts = [{ value:'all', label:(activeChannel === 'all' ? t('channelLabel') : t('channelAll')), count:FARMS.length }];
    CHANNELS.forEach(function(c){
      opts.push({ value:c, label:channelName(c), count:counts[c] || 0 });
    });

  function applyFilters(){
    var visibleCount = 0;
    FARMS.forEach(function(f){
      var ok = matches(f);

      var pin = pinsLayer.querySelector('.pin[data-id="'+f.id+'"]');
      if (pin) pin.classList.toggle('dim', !ok);

        card.classList.toggle('hidden', !ok);

    document.querySelectorAll('.empty-state').forEach(function(el){

    var filtered = activeCats.length > 0 || activeChannel !== 'all' || activeRegion !== 'all' || activeDelivery !== 'all' ||
                   nearActive || searchQuery;
    document.getElementById('mapCaption').textContent = visibleCount + ' ' + t('farmWord')(visibleCount) + (filtered ? t('farmsShown') + FARMS.length : '');
    document.getElementById('sidebarCount').textContent = visibleCount + (filtered ? '/' + FARMS.length : '');
    refreshPinMarks();
    var activeCount = [activeCats.length > 0, activeChannel !== 'all', activeDelivery !== 'all',
                       activeRegion !== 'all', onlyFavs, nearActive, !!searchQuery]
                      .filter(Boolean).length;

  /* "V\u0161e" clears the lot; any other chip toggles itself on or off, and with
     nothing chosen we are back to showing everything. */
  function refreshPinMarks(){
    FARMS.forEach(function(f){
      var pin = pinsLayer.querySelector('.pin[data-id="' + f.id + '"]');

  document.getElementById('filterBar').addEventListener('click', function(e){
    var chip = e.target.closest('.chip[data-cat]');

  /* ---- Proximity controls ---- */
  var nearChip = document.getElementById('nearChip');

  function drawNearRing(){
    if (!userLoc){ nearRing.hidden = true; return; }
    var x = (userLoc.lon - PROJ.minlon) * PROJ.cosLat * PROJ.scale + PROJ.margin;
    var y = (PROJ.maxlat - userLoc.lat) * PROJ.scale + PROJ.margin;
    var km = nearRadiusKm();
    var dLon = km / (111.32 * Math.cos(userLoc.lat * Math.PI / 180));
    var dLat = km / 110.57;
    document.getElementById('nearEllipse').setAttribute('cx', x.toFixed(1));
    document.getElementById('nearEllipse').setAttribute('cy', y.toFixed(1));
    document.getElementById('nearEllipse').setAttribute('rx', (dLon * PROJ.cosLat * PROJ.scale).toFixed(1));
    document.getElementById('nearEllipse').setAttribute('ry', (dLat * PROJ.scale).toFixed(1));
    document.getElementById('nearDot').setAttribute('cx', x.toFixed(1));
    document.getElementById('nearDot').setAttribute('cy', y.toFixed(1));
    nearRing.hidden = !nearActive;
  }

  function setUserLocation(loc, quiet){
    userLoc = loc;
    pickingLocation = false;
    document.querySelector('.map-wrap').classList.remove('picking');

  function deactivateNear(){

  nearChip.addEventListener('click', function(){
    if (nearActive || pickingLocation){ deactivateNear(); return; }
    if (userLoc){ setUserLocation(userLoc); return; }
    if (navigator.geolocation){
      nearChip.classList.add('active');
      navigator.geolocation.getCurrentPosition(
        function(pos){ setUserLocation({ lat:pos.coords.latitude, lon:pos.coords.longitude }); },
        function(){ startPicking(); showHint(t('nearDenied'), false); },

  document.getElementById('sortRow').addEventListener('click', function(e){

  document.getElementById('searchInput').addEventListener('input', function(e){
